                        <label class="svc-assign-card${selected ? ' is-selected' : ''}" data-stage="${stageKey}">
                          <input type="checkbox" value="${p.id}" class="invite-prod-check" ${selected ? 'checked' : ''} onchange="syncInviteSelectionUI()" />
                          <div class="svc-assign-card-icon" style="background:${pStyle.gradient};--icon-gradient:${pStyle.gradient};--icon-bloom:${pStyle.bloom};" aria-hidden="true">${getIconSvg(p.icon || 'Layers', 16, '#fff')}</div>
                          <div class="svc-assign-card-copy">
                            <div class="svc-assign-card-top">
                              <h5 class="svc-assign-card-name">${p.name}</h5>
                              <span class="svc-assign-card-check" aria-hidden="true">${getIconSvg('Check', 12)}</span>
                            </div>
                            <p class="svc-assign-card-desc">${p.role || p.description || ''}</p>
                          </div>
                        </label>
                      `;
                    }).join('')}
                  </div>
                </section>
              `;
            }).join('')}
          </div>
        </div>

        <div class="modal-footer">
          <span class="svc-assign-footer-meta" id="invite-footer-meta">${granted.length ? `<strong>${granted.length}</strong> service${granted.length === 1 ? '' : 's'} ready to provision` : 'No services selected yet'}</span>
          <button type="button" onclick="closeModal()" class="modal-btn">Cancel</button>
          <button type="button" id="invite-primary-btn" onclick="submitInviteServices('${client.id}')" class="modal-btn modal-btn-primary">${isActive ? 'Save changes' : 'Send invitation'}</button>
        </div>
      </div>
    </div>
  `;
  if (window.lucide) window.lucide.createIcons();
  syncInviteSelectionUI();
  bindInviteListScrollChrome();
}

function bindInviteListScrollChrome() {
  const list = document.getElementById('invite-products-list');
  if (!list || list.dataset.scrollChromeBound === '1') return;
  list.dataset.scrollChromeBound = '1';
  let hideTimer;
  list.addEventListener('scroll', () => {
    list.classList.add('is-scrolling');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => list.classList.remove('is-scrolling'), 700);
  }, { passive: true });
}

function syncInviteSelectionUI() {
  const checks = Array.from(document.querySelectorAll('.invite-prod-check'));
  const selected = checks.filter(c => c.checked).length;
  const total = checks.length || PRODUCTS_CATALOG.length;

  checks.forEach(c => {
    const card = c.closest('.svc-assign-card');
    if (card) card.classList.toggle('is-selected', c.checked);
  });

  const countEl = document.getElementById('invite-selected-n');
  if (countEl) countEl.textContent = String(selected);

  const countWrap = document.getElementById('invite-selection-count');
  if (countWrap) {
    const span = countWrap.querySelector('span');
    if (span) span.textContent = `of ${total} selected`;
  }

  const progress = document.getElementById('invite-selection-progress');
  if (progress) {
    progress.style.width = `${total ? Math.round((selected / total) * 100) : 0}%`;
  }

  const meta = document.getElementById('invite-footer-meta');
  if (meta) {
    meta.innerHTML = selected
      ? `<strong>${selected}</strong> service${selected === 1 ? '' : 's'} ready to provision`
      : 'No services selected yet';
  }

  const primary = document.getElementById('invite-primary-btn');
  if (primary) {
    primary.disabled = selected === 0;
    primary.style.opacity = selected === 0 ? '0.55' : '1';
    primary.style.cursor = selected === 0 ? 'not-allowed' : 'pointer';
  }
}

function filterInviteStage(stageKey, btn) {
  document.querySelectorAll('.svc-assign-stage-btn').forEach(b => b.classList.remove('is-active'));
  if (btn) btn.classList.add('is-active');

  document.querySelectorAll('.svc-assign-group').forEach(group => {
    const key = group.getAttribute('data-stage-group');
    group.style.display = (stageKey === 'all' || key === stageKey) ? '' : 'none';
  });
}

function setInvitePreset(type) {
  const checks = document.querySelectorAll('.invite-prod-check');
  checks.forEach(c => {
    if (type === 'all') c.checked = true;
    else if (type === 'clear') c.checked = false;
    else if (type === 'core') c.checked = ['fuel', 'growthos', 'gtm-launchpad', 'pulse'].includes(c.value);
  });

  document.querySelectorAll('.svc-assign-preset').forEach(b => {
    b.classList.toggle('is-active', b.getAttribute('data-preset') === type);
  });

  // Reset stage filter to All so selected cards stay visible
  const allBtn = document.querySelector('.svc-assign-stage-btn[data-stage="all"]');
  if (allBtn) filterInviteStage('all', allBtn);

  syncInviteSelectionUI();
  if (window.lucide) window.lucide.createIcons();
}

function submitInviteServices(clientId) {
  const checks = document.querySelectorAll('.invite-prod-check:checked');
  const selected = Array.from(checks).map(c => c.value);
  closeModal();
  const client = app.clients.find(c => c.id === clientId);
  if (client && client.status === 'active') {
    client.grantedProducts = selected || [];
    if (client.accessRequests?.length) {
      client.accessRequests = client.accessRequests.filter(id => !client.grantedProducts.includes(id));
    }
    if (!client.serviceAdoption) client.serviceAdoption = {};
    client.grantedProducts.forEach(pid => {
      if (!client.serviceAdoption[pid]) {
        client.serviceAdoption[pid] = {
          status: "active",
          usageRate: "Active workspace",
          notes: "Access provisioned by York Operating Lead"
        };
      }
    });
    app.saveState();
    render();
    if (typeof showToast === 'function') {
      showToast(`Updated assigned services for ${client.name} (${selected.length} provisioned)`, 'success');
    }
  } else {
    app.sendCompanyInviteWithServices(clientId, selected);
  }
}

function requestEcosystemAccess(productId) {
  const p = PRODUCTS_CATALOG.find(item => item.id === productId);
  const ok = app.requestEcosystemAccess(productId);
  if (ok) {
    showToast(`Access request for ${p?.name || 'this product'} sent to your York Operating Lead.`, 'success');
  } else if (p && (app.getCurrentClient()?.grantedProducts || []).includes(productId)) {
    showToast(`${p.name} is already in your path.`, 'info');
  } else if (p) {
    showToast(`Access for ${p.name} is already requested.`, 'info');
  }
}

function openCatalogProductModal(productId, mode = 'admin') {
  const p = PRODUCTS_CATALOG.find(item => item.id === productId);
  const root = document.getElementById('modal-root');
  if (!root || !p) return;

  const style = getCatalogStageStyle(p);
  const client = app.getCurrentClient();
  const isGranted = !!(client?.grantedProducts || []).includes(p.id);
  const isRequested = !!(client?.accessRequests || []).includes(p.id) && !isGranted;
  const deployments = getProductDeploymentClients(p.id);

  let footerActions = `
    <button type="button" onclick="closeModal()" class="modal-btn">Close</button>
  `;

  if (mode === 'client') {
    if (isGranted) {
      footerActions += `
        <button type="button" onclick="closeModal(); openLaunchWorkspaceModal('${p.id}')" class="modal-btn modal-btn-primary">Open workspace →</button>
      `;
    } else if (isRequested) {
      footerActions += `
        <button type="button" class="modal-btn modal-btn-primary" disabled style="opacity:0.55;cursor:not-allowed">Requested</button>
      `;
    } else {
      footerActions += `
        <button type="button" onclick="closeModal(); requestEcosystemAccess('${p.id}')" class="modal-btn modal-btn-primary">Request access</button>
      `;
    }
  } else {
    footerActions += `
      <button type="button" onclick="closeModal()" class="modal-btn modal-btn-primary">Done</button>
    `;
  }

  root.innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal-content" style="max-width:560px" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-header-main">
            <div class="modal-icon" style="background:${style.gradient};border-color:transparent;color:#fff">${getIconSvg(p.icon || 'Layers', 16, '#fff')}</div>
            <div>
              <h3 class="modal-title">${p.name}</h3>
              <p class="modal-subtitle">${p.stage} · ${p.role || 'York product'}</p>
            </div>
          </div>
          <button type="button" onclick="closeModal()" class="modal-close" aria-label="Close">${getIconSvg('X', 16)}</button>
        </div>
        <div class="modal-body">
          <p style="margin:0;font-size:14px;color:var(--text-secondary);line-height:1.55">${p.description || ''}</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div class="modal-field">
              <span class="modal-label">Credit type</span>
              <div style="font-size:14px;font-weight:500;color:var(--text-main)">${p.creditType || '—'}</div>
            </div>
            <div class="modal-field">
              <span class="modal-label">Default credits</span>
              <div style="font-size:14px;font-weight:500;color:var(--text-main)">${(p.defaultCredits ?? 0).toLocaleString()}</div>
            </div>
          </div>
          ${mode === 'admin' ? `
            <div class="modal-field">
              <span class="modal-label">Deployed accounts (${deployments.length})</span>
              ${deployments.length ? `
                <div class="catalog-deploy-list">
                  ${deployments.map(c => `
                    <button type="button" class="catalog-deploy-row" onclick="closeModal(); openCompanyDashboardPopup('${c.id}')">
                      <span class="catalog-deploy-name">${c.name}</span>
                      <span class="catalog-deploy-meta">${c.domain || c.status || 'Account'} →</span>
                    </button>

              <span class="modal-label">Your access</span>
              <div style="font-size:14px;font-weight:500;color:var(--text-main)">

        <div class="modal-footer">
          ${footerActions}
