    companies = companies.filter(c => c.status === "invited");

function renderAdminProductsCatalogTab() {
  const currentStage = app.adminProductFilterStage || "all";
  const query = (app.adminProductSearchQuery || "").toLowerCase().trim();

  let products = PRODUCTS_CATALOG;
  if (currentStage !== "all") {
    products = products.filter(p => p.stage.toLowerCase() === currentStage.toLowerCase());
  }
  if (query) {
    products = products.filter(p => 
      p.name.toLowerCase().includes(query) ||
      p.role.toLowerCase().includes(query) ||
      p.description.toLowerCase().includes(query)
    );
  }

  // Count active deployments for each product
  const deploymentCounts = {};
  app.clients.forEach(c => {
    (c.grantedProducts || []).forEach(pid => {
      deploymentCounts[pid] = (deploymentCounts[pid] || 0) + 1;
    });
  });

  const operatorName = getBentoFirstName("Kyle");
  const stageCounts = ['decide','execute','measure','assess','operate'].reduce((acc, s) => {
    acc[s] = PRODUCTS_CATALOG.filter(p => p.stage.toLowerCase() === s).length;
    return acc;
  }, { all: PRODUCTS_CATALOG.length });

  return `
    <div class="bento-page">
      ${renderBentoGreeting({
        title: `Hey ${operatorName}, explore the software catalog`,
        subtitle: "18 B2B solutions across Decide → Operate.",
        primaryCta: `<div class="bento-search" style="width:220px"><i data-lucide="search" class="bento-search-icon"></i><input type="text" value="${app.adminProductSearchQuery || ""}" oninput="app.setAdminProductSearchQuery(this.value)" placeholder="Search products..." /></div>`
      })}

      ${renderBentoMetrics([
        { value: stageCounts.all, label: 'Products' },
        { value: Object.values(deploymentCounts).reduce((a,b)=>a+b,0), label: 'Deployments' }
      ])}

      <div class="bento-surface">
        <div class="bento-chip-row">
          ${['all','decide','execute','measure','assess','operate'].map(stage => `
            <button type="button" class="bento-chip ${currentStage === stage ? 'active' : ''}" onclick="app.setAdminProductFilterStage('${stage}')">
              <span>${stage === 'all' ? 'All' : stage.charAt(0).toUpperCase() + stage.slice(1)}</span>
              <span class="bento-chip-count">${stageCounts[stage]}</span>
            </button>
          `).join('')}
        </div>
        <div class="eco-grid" style="margin-top:14px">
          ${products.map(p => {
            const count = deploymentCounts[p.id] || 0;
            return `
              <article class="eco-card">
                <div class="eco-card-stage">${p.stage}</div>
                <h3 class="eco-card-name">${p.name}</h3>
                <p class="eco-card-desc">${p.description}</p>
                <div class="eco-card-footer">
                  <span class="eco-available">${p.creditType}</span>
                  <span style="font-size:11.5px;color:var(--text-muted)">${count} accounts</span>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderClientTeamTab(client) {
  const team = client.team || [];
  const grantedIds = client.grantedProducts || [];
  const grantedProducts = PRODUCTS_CATALOG.filter(p => grantedIds.includes(p.id));

  const initials = (name = '') => {
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return name.substring(0, 2).toUpperCase() || 'TM';
  };

  const roleLabel = (role) => (role === 'owner' ? 'Owner' : 'Member');
  const titleClean = (title = '') => title.replace(/\s*\(Owner\)\s*/i, '').trim();
  const firstName = (client.ownerName || app.currentUser?.name || "there").split(" ")[0];

  return `
    <div class="bento-page">
      ${renderBentoGreeting({
        title: `Hey ${firstName}, manage team access`,
        subtitle: "Invite collaborators and control per-service access.",
        primaryCta: `<button type="button" class="bento-cta" onclick="showToast('Invitation sent to new team member.', 'success')"><span>+</span><span>Invite member</span></button>`
      })}

      ${renderBentoMetrics([
        { value: team.length, label: 'Members' },
        { value: grantedProducts.length, label: 'Services' },
        { value: 'Owner', label: 'Access model' }
      ])}

      <div class="bento-surface team-panel" style="border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg-card)">
        <div class="team-panel-header" style="padding:12px 16px;border-bottom:1px solid var(--line);background:transparent">
          <h2 class="bento-panel-title">Members &amp; permissions</h2>
        </div>
        ${team.length === 0 ? `
          <div style="padding:32px 16px;text-align:center;color:var(--text-muted)">No team members yet.</div>
        ` : team.map(m => {
          const isOwner = m.role === 'owner';
          const allowed = m.allowedProducts || [];
          return `
            <div class="team-member-row">
              <div class="team-member-identity">
                <div class="team-member-avatar" aria-hidden="true">${initials(m.name)}</div>
                <div style="min-width:0">
                  <div class="team-member-name-row">
                    <h3 class="team-member-name">${m.name}</h3>
                    <span class="team-role-badge ${isOwner ? 'owner' : 'member'}">${roleLabel(m.role)}</span>
                  </div>
                  <div class="team-member-meta">${m.email} · ${titleClean(m.title) || 'Team Member'}</div>
                </div>
              </div>
              <div class="team-rights" aria-label="Service permissions for ${m.name}">
                ${grantedProducts.map(p => {
                  if (isOwner) return `<span class="team-right-chip locked">${p.name}</span>`;
                  const hasAccess = allowed.includes(p.id);
                  return `
                    <button type="button" class="team-right-chip ${hasAccess ? 'active' : 'inactive'}"
                      onclick="app.toggleMemberProduct('${client.id}', '${m.id}', '${p.id}')"
                      title="${hasAccess ? 'Revoke' : 'Grant'} ${p.name} access">

                      <span>${p.name}</span>
                    </button>`;
                }).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}
function renderClientEcosystemTab(client) {
  const granted = client.grantedProducts || [];
  const filter = app.ecosystemFilter || 'all';
  const stages = [
    { key: 'all', label: 'All products' },
    { key: 'decide', label: 'Decide' },

    { key: 'measure', label: 'Measure' },
    { key: 'assess', label: 'Assess' },
    { key: 'operate', label: 'Operate' }
  ];

  const counts = stages.reduce((acc, s) => {
    acc[s.key] = s.key === 'all'
      ? PRODUCTS_CATALOG.length
      : PRODUCTS_CATALOG.filter(p => (p.stageClass || p.stage.toLowerCase()) === s.key).length;
    return acc;
  }, {});

  const filtered = filter === 'all'
    ? PRODUCTS_CATALOG
    : PRODUCTS_CATALOG.filter(p => (p.stageClass || p.stage.toLowerCase()) === filter);

  const titleMap = {
    all: 'All products.',
    decide: 'Decide products.',
    execute: 'Execute products.',
    measure: 'Measure products.',
    assess: 'Assess products.',
    operate: 'Operate products.'
  };

  const firstName = (client.ownerName || app.currentUser?.name || "there").split(" ")[0];
  const inPathCount = granted.length;

  return `

      ${renderBentoGreeting({
        title: `Hey ${firstName}, explore the York Ecosystem`,
        subtitle: "Browse Decide → Operate software and request access."

      ${renderBentoMetrics([
        { value: PRODUCTS_CATALOG.length, label: 'Products' },
        { value: inPathCount, label: 'In your path', tone: 'ok' }

          <h2 class="bento-panel-title">${titleMap[filter] || 'All products.'}</h2>

        <div class="bento-chip-row" role="tablist" aria-label="Ecosystem stage filter">
          ${stages.map(s => `
            <button type="button" class="bento-chip ${filter === s.key ? 'active' : ''}" onclick="app.setEcosystemFilter('${s.key}')">
              <span>${s.label}</span>
              <span class="bento-chip-count">${counts[s.key]}</span>
            </button>
          `).join('')}
        </div>
        <div class="eco-grid" style="margin-top:14px">
          ${filtered.map(p => {
            const isGranted = granted.includes(p.id);
            return `
              <article class="eco-card">
                <div class="eco-card-stage">${p.stage}</div>
                <h3 class="eco-card-name">${p.name}</h3>
                <p class="eco-card-desc">${p.description}</p>
                <div class="eco-card-footer">
                  ${isGranted ? `
                    <span class="badge-in-path">In your path</span>

                    <span class="eco-available">Available</span>

                  `}
                </div>
              </article>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function openSendInviteModal(clientId) {
  const client = app.clients.find(c => c.id === clientId);
  if (!client) return;
  const granted = client.grantedProducts || [];

  const root = document.getElementById('modal-root');
  if (!root) return;
  root.innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal-content !max-w-2xl" onclick="event.stopPropagation()">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h3 class="text-lg font-bold text-slate-900">${isActive ? 'Manage Assigned Services' : 'Configure Services & Invite'}</h3>
            <p class="text-xs text-slate-500 mt-0.5">${isActive ? 'Update active software workspaces provisioned for ' + client.name : 'Select software services to provision for ' + client.name}.</p>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-sm">✕</button>
        </div>

        <div class="p-6 space-y-4">
          <div class="flex items-center justify-between text-xs">
            <span class="font-bold text-slate-700">Available Products (18)</span>
            <div class="flex items-center gap-2">
              <button onclick="setInvitePreset('core')" class="text-emerald-800 font-bold hover:underline">Core Growth (4)</button>
              <span>·</span>
              <button onclick="setInvitePreset('all')" class="text-emerald-800 font-bold hover:underline">Select All</button>
              <span>·</span>
              <button onclick="setInvitePreset('clear')" class="text-slate-500 font-semibold hover:underline">Clear</button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5 max-h-72 overflow-y-auto p-1" id="invite-products-list">
            ${PRODUCTS_CATALOG.map(p => `
              <label class="flex items-start gap-2.5 p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                <input type="checkbox" value="${p.id}" ${granted.includes(p.id) ? 'checked' : ''} class="mt-0.5 invite-prod-check text-emerald-600 focus:ring-emerald-500 rounded" />
                <div>
                  <div class="font-bold text-xs text-slate-900">${p.name}</div>
                  <div class="text-[10px] text-slate-500 line-clamp-1">${p.role}</div>
                </div>
              </label>
            `).join('')}
          </div>

          <div class="pt-4 border-t border-slate-100 flex justify-end gap-2">
            <button onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-50">Cancel</button>
            <button onclick="submitInviteServices('${client.id}')" class="px-4 py-2 bg-[#084c36] hover:bg-[#063828] text-white rounded-lg text-xs font-bold shadow-2xs">${isActive ? 'Save Service Changes' : 'Send Invitation'}</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function setInvitePreset(type) {
  const checks = document.querySelectorAll('.invite-prod-check');
  checks.forEach(c => {
    if (type === 'all') c.checked = true;
    else if (type === 'clear') c.checked = false;
    else if (type === 'core') c.checked = ['fuel', 'growthos', 'gtm-launchpad', 'pulse'].includes(c.value);
  });
}

function submitInviteServices(clientId) {
  const checks = document.querySelectorAll('.invite-prod-check:checked');
  const selected = Array.from(checks).map(c => c.value);
  closeModal();
  const client = app.clients.find(c => c.id === clientId);
  if (client && client.status === 'active') {
    client.grantedProducts = selected || [];
    if (!client.serviceAdoption) client.serviceAdoption = {};
    client.grantedProducts.forEach(pid => {
      if (!client.serviceAdoption[pid]) {
        client.serviceAdoption[pid] = {
          status: "active",
          usageRate: "Active workspace",
          notes: "Access provisioned by York Operating Lead"
        };
      }
    });
    app.saveState();
    render();
    if (typeof showToast === 'function') {
      showToast(`Updated assigned services for ${client.name} (${selected.length} provisioned)`, 'success');
    }
  } else {
    app.sendCompanyInviteWithServices(clientId, selected);
  }
}
