  <script>
    (function(){
      try {
        sessionStorage.setItem('york_session_active', 'true');
        var saved = localStorage.getItem('york_theme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
          if (saved === 'dark') document.documentElement.classList.add('dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e){}
    })();

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      if (next === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      try {
        localStorage.setItem('york_theme', next);
      } catch(e){}
      if (typeof showToast === 'function') {
        showToast(next === 'dark' ? '🌙 Dark Executive Theme enabled' : '☀️ Pearl Light Theme enabled', 'info', 2000);
      }
    }

.product-card {

/* Modals */

  box-shadow: 0 4px 12px -1px rgba(0, 0, 0, 0.06);
  transform: translateY(-1px);
}

  </style>

// Helper: Calculate Syndicate Perk Savings for a client
function getClientPerkSavings(client) {
  const claimedIds = client.claimedPerks || [];
  let claimedTotal = 0;
  let totalAvailable = 0;
  SYNDICATE_PERKS_CATALOG.forEach(perk => {
    totalAvailable += perk.valueNumber;
    if (claimedIds.includes(perk.id)) {
      claimedTotal += perk.valueNumber;
    }
  });
  const remainingTotal = Math.max(0, totalAvailable - claimedTotal);
  const pct = Math.round((claimedTotal / (totalAvailable || 1)) * 100);
  return {
    claimedTotal,
    remainingTotal,
    totalAvailable,
    pct,
    claimedCount: claimedIds.length,
    totalCount: SYNDICATE_PERKS_CATALOG.length
  };
}

// Token calculation helpers (Tokens, not credits)
function getCompanyTokens(client) {
  if (!client) return { allocated: 25000, total: 25000, used: 0, percent: 0, balance: 25000 };
  if (client.tokenUsage && typeof client.tokenUsage.allocated === "number") {
    const allocated = client.tokenUsage.allocated || 25000;
    const used = client.tokenUsage.used || 0;
    const percent = Math.min(100, Math.round((used / allocated) * 100));
    return { allocated, total: allocated, used, percent, balance: allocated - used };
  }
  const map = {
    "client-cloudscale": { allocated: 60000, used: 38450 },
    "client-novubio": { allocated: 35000, used: 18200 },
    "client-apexfin": { allocated: 25000, used: 5000 },
    "client-datastream": { allocated: 25000, used: 0 },
    "client-biogenix": { allocated: 15000, used: 0 },
    "client-krypton": { allocated: 20000, used: 0 },
    "client-veloce": { allocated: 25000, used: 0 },
    "client-omnihealth": { allocated: 30000, used: 0 },
    "client-aerosphere": { allocated: 25000, used: 0 }
  };
  const item = map[client.id] || { allocated: 25000, used: 0 };
  const percent = Math.min(100, Math.round((item.used / item.allocated) * 100));
  return { allocated: item.allocated, total: item.allocated, used: item.used, percent, balance: item.allocated - item.used };
}

function getPortfolioTokenTotals() {
  let totalAllocated = 0;
  let totalUsed = 0;
  app.clients.forEach(c => {
    const t = getCompanyTokens(c);
    totalAllocated += t.allocated;
    totalUsed += t.used;
  });
  const percent = totalAllocated > 0 ? Math.round((totalUsed / totalAllocated) * 100) : 0;
  return { totalAllocated, totalUsed, percent, totalRemaining: totalAllocated - totalUsed };
}

      if (saved) {
        const parsed = JSON.parse(saved);
        this.currentUser = parsed.currentUser || null;

  advanceMilestone(clientId, milestoneId, targetStage) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client || !client.milestones) return;

    const ms = client.milestones.find(m => m.id === milestoneId);
    if (ms) {
      ms.stage = targetStage;
      this.saveState();
      render();
    }
  }

  approveMilestone(clientId, milestoneId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client || !client.milestones) return;

    const ms = client.milestones.find(m => m.id === milestoneId);
    if (ms) {
      ms.stage = 'approved';
      ms.approvedAt = 'Just now';

      // Automatically approve associated deliverable if any!
      if (ms.deliverableLinked && client.deliverables) {
        const deliv = client.deliverables.find(d => d.title.includes(ms.deliverableLinked) || ms.deliverableLinked.includes(d.title));
        if (deliv) deliv.status = 'approved';
      }

      this.saveState();
      render();
    }
  }

  // Phase 2: Bi-Directional HubSpot Sync
  pushTelemetryToHubspot(clientId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    client.hubspotSync.lastPushedAt = `Today at ${timeStr}`;
    client.hubspotSync.pushedProperties = {
      york_health_score: `${client.healthTelemetry?.score || 90} / 100`,
      york_active_products: client.grantedProducts.map(p => p.toUpperCase()).join(', '),
      york_burn_velocity: client.healthTelemetry?.burnVelocity || '350 credits/wk',
      york_credit_runway: client.healthTelemetry?.runwayWeeks || '20 weeks',
      york_milestones_completed: `${(client.milestones || []).filter(m => m.stage === 'approved').length} of ${(client.milestones || []).length}`
    };

    this.saveState();
    render();
  }

  createHubspotExpansionDeal(clientId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client || !client.healthTelemetry?.expansionOpportunity) return;

    const exp = client.healthTelemetry.expansionOpportunity;
    exp.dealCreated = true;

    // Add expansion deal to HubSpot Deals List!
    const newDeal = {
      id: 'hs-exp-' + Date.now(),
      companyName: client.name,
      domain: client.domain,
      dealName: `${client.name} - ${exp.productName} Expansion Retainer`,
      retainerTier: exp.retainerTier || 'Specialized Practice Add-On',
      contractScope: exp.scopeTitle || '+5,000 Credits',
      creditQuota: exp.scopeTitle || '+5,000 Credits Included',
      contractTerm: 'Expansion Addendum',
      amount: exp.dealAmount,
      closeDate: 'Dec 01, 2026',
      stage: 'Proposal Presented',
      contactName: client.ownerName,
      contactEmail: client.ownerEmail,
      contactRole: 'Owner',
      invited: true,
      clientId: client.id
    };

    this.hubspotDeals.unshift(newDeal);
    this.saveState();
    render();
    return newDeal;
  }

  // Phase 1 Actions
  completeChecklistItem(clientId, itemId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client || !client.onboardingChecklist) return;

    const item = client.onboardingChecklist.find(i => i.id === itemId);
    if (item) {
      item.completed = true;
      this.saveState();
      render();
    }
  }

  approveDeliverable(clientId, deliverableId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client || !client.deliverables) return;

    const d = client.deliverables.find(item => item.id === deliverableId);
    if (d) {
      d.status = 'approved';
      this.saveState();
      render();
    }
  }

  uploadClientDeliverable(clientId, { title, category, type, summary }) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    if (!client.deliverables) client.deliverables = [];

    const newDeliverable = {
      id: 'deliv-up-' + Date.now(),
      title,
      category: category || 'gtm',
      type: type || 'Client Document',
      date: 'Just now',
      author: `${this.currentUser?.name || 'Client'} (Uploaded)`,
      status: 'approved',
      version: 'v1.0',
      summary: summary || 'Shared directly with the York IE operating team.',
      fileSize: '2.5 MB'
    };

    client.deliverables.unshift(newDeliverable);
    this.saveState();
    render();
    return newDeliverable;
  }

  inviteClientCompany({ companyName, domain, contactName, contactEmail, contactRole, grantedProducts, initialCredits, dealId }) {
    const clientId = 'client-' + (domain.split('.')[0] || Date.now()).toLowerCase().replace(/[^a-z0-9]/g, '');
    const ownerId = 'user-' + (contactEmail.split('@')[0] || Date.now()).toLowerCase().replace(/[^a-z0-9]/g, '');

    const credits = {};
    grantedProducts.forEach(prodId => {
      const prod = PRODUCTS_CATALOG.find(p => p.id === prodId);
      const allocated = initialCredits[prodId] || prod?.defaultCredits || 1000;
      credits[prodId] = { allocated, balance: allocated, label: prod?.creditType || 'Credits' };
    });

    const deal = this.hubspotDeals.find(d => d.id === dealId);

    const newClient = {
      id: clientId,
      name: companyName,
      domain: domain,
      ownerId: ownerId,
      ownerName: contactName,
      ownerEmail: contactEmail,
      status: 'onboarding',
      yorkLead: 'Kyle York & Practice Lead',
      retainerTier: deal?.retainerTier || 'Tier 2: Scale Acceleration',
      contractScope: deal?.contractScope || 'GTM Practice + Tech Ops',
      creditQuota: deal?.creditQuota || '18,500 Credits Included',
      contractTerm: deal?.contractTerm || '12-Month SOW',
      dealAmount: deal?.amount || '$150,000 ARR',
      grantedProducts: [...grantedProducts],
      credits: credits,
      healthTelemetry: {
        score: 85,
        statusLabel: 'Onboarding - Calibration Phase',
        statusTier: 'high',
        burnVelocity: '100 credits / week',
        runwayWeeks: '48 weeks remaining',
        activeSprintCount: 2,
        codeDeploysCount: 2,
        expansionOpportunity: {
          id: 'exp-new-1',
          product: 'pulse',
          productName: 'Pulse Engineering Signals',
          dealAmount: '$30,000 ARR',
          reason: 'Opportunity to attach developer velocity telemetry.',
          hubspotStage: 'Discovery',
          dealCreated: false
        }
      },
      hubspotSync: {
        lastPushedAt: 'Just now',
        pushedProperties: {
          york_health_score: '85 / 100',
          york_active_products: grantedProducts.join(', ').toUpperCase(),
          york_burn_velocity: '100 credits/wk',
          york_credit_runway: '48 weeks'
        }
      },
      milestones: [
        { id: 'ms-new-1', title: 'Phase 1 Workspace Handshake', practice: 'Engineering', lead: 'Alex Tremblay', targetDate: 'This week', stage: 'in_progress', desc: 'Initial repo setup and CI/CD pipelines.' },
        { id: 'ms-new-2', title: 'GTM Positioning Matrix v1.0', practice: 'GTM Practice', lead: 'Mike Veilleux', targetDate: 'Next week', stage: 'scoping', desc: 'Market messaging differentiation.' }
      ],
      cadence: {
        nextCallDate: 'Friday, Nov 21',
        nextCallTime: '2:00 PM - 2:45 PM EST',
        agenda: 'Initial Kickoff & Telemetry Alignment with York Leads',
        zoomLink: `https://meet.york.ie/${domain.split('.')[0]}-kickoff`,
        operatingTeam: [
          { name: 'Kyle York', role: 'Partner & Strategic Advisory Lead', email: 'kyle@york.ie' },
          { name: 'Mike Veilleux', role: 'Partner & GTM Practice Lead', email: 'mike@york.ie' },
          { name: 'Alex Tremblay', role: 'VP Engineering & Architecture', email: 'alex@york.ie' }
        ]
      },
      onboardingChecklist: [
        { id: 'chk-1', title: 'Deal Finalized & Closed-Won Handshake', desc: 'Contract synchronized.', completed: true, actionType: null },
        { id: 'chk-2', title: 'Core Workspace Entitlements Activated', desc: 'Product access granted.', completed: true, actionType: null },
        { id: 'chk-3', title: 'Connect Company GitHub / GitLab Org', desc: 'Link repository for York scaffolding.', completed: false, actionType: 'connect_github', actionLabel: 'Connect GitHub Org' },
        { id: 'chk-4', title: 'Upload Pitch Deck & Competitor List', desc: 'Accelerate Fuel AI market telemetry.', completed: false, actionType: 'upload_context', actionLabel: 'Upload Context Materials' },
        { id: 'chk-5', title: 'Confirm Executive Kickoff Strategy Call', desc: 'Lock in strategy session with York partners.', completed: false, actionType: 'confirm_kickoff', actionLabel: 'Confirm Kickoff Date' }
      ],
      deliverables: [],
      team: [
        { id: ownerId, name: contactName, email: contactEmail, role: 'owner', title: `${contactRole || 'Executive'} (Owner)`, allowedProducts: [...grantedProducts] }
      ],
      memberRequests: []
    };

    this.clients.unshift(newClient);

    if (dealId) {
      const deal = this.hubspotDeals.find(d => d.id === dealId);
      if (deal) {
        deal.invited = true;
        deal.clientId = clientId;
      }
    }

    this.saveState();
    return newClient;
  }

  inviteTeamMember(clientId, { name, email, title, allowedProducts }) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const newMemberId = 'user-' + (email.split('@')[0] || Date.now()).toLowerCase().replace(/[^a-z0-9]/g, '');
    const member = {
      id: newMemberId,
      name,
      email,
      role: 'member',
      title: title || 'Team Member',
      allowedProducts: [...allowedProducts]
    };

    client.team.push(member);
    this.saveState();
    return member;
  }

  toggleMemberProduct(clientId, memberId, productId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const member = client.team.find(m => m.id === memberId);
    if (!member) return;

    if (member.allowedProducts.includes(productId)) {
      member.allowedProducts = member.allowedProducts.filter(id => id !== productId);
    } else {
      member.allowedProducts.push(productId);
    }
    this.saveState();
    render();
  }

  requestMemberAccess(clientId, memberId, productId, note) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const member = client.team.find(m => m.id === memberId);
    const prod = PRODUCTS_CATALOG.find(p => p.id === productId);

    const req = {
      id: 'mreq-' + Date.now(),
      memberId,
      memberName: member?.name || 'Team Member',
      productId,
      productName: prod?.name || productId,
      requestedAt: 'Just now',
      note: note || 'Requesting access to collaborate with the team.',
      status: 'pending'
    };

    client.memberRequests.unshift(req);
    this.saveState();
    return req;
  }

  approveMemberRequest(clientId, requestId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const req = client.memberRequests.find(r => r.id === requestId);
    if (!req) return;

    req.status = 'approved';
    const member = client.team.find(m => m.id === req.memberId);
    if (member && !member.allowedProducts.includes(req.productId)) {
      member.allowedProducts.push(req.productId);
    }
    this.saveState();
    render();
  }

  declineMemberRequest(clientId, requestId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const req = client.memberRequests.find(r => r.id === requestId);
    if (req) req.status = 'declined';
    this.saveState();
    render();
  }
}

// Non-blocking in-app toast notification system
function showToast(message, type = 'success', duration = 3500) {
  if (typeof document === 'undefined') return;
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'fixed bottom-5 right-5 z-[9999] flex flex-col gap-2.5 max-w-sm pointer-events-none';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  const bgClass = type === 'error' ? 'bg-rose-900/95 border-rose-700 text-rose-50' 
                : type === 'warning' ? 'bg-amber-900/95 border-amber-700 text-amber-50' 
                : 'bg-slate-900/95 border-slate-700 text-white';
  
  const icon = type === 'error' ? '✕' : type === 'warning' ? '⚠' : '✓';
  const iconColor = type === 'error' ? 'text-rose-400' : type === 'warning' ? 'text-amber-400' : 'text-emerald-400';

  toast.className = `pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-xl backdrop-blur-md text-xs font-medium transition-all duration-300 transform translate-y-0 ${bgClass}`;
  toast.innerHTML = `
    <span class="font-bold text-sm ${iconColor} flex-shrink-0 mt-0.5">${icon}</span>
    <div class="flex-1 leading-relaxed">${message}</div>
    <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white transition-colors flex-shrink-0 text-sm ml-1">✕</button>
  `;

  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(8px)';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// Ensure smooth non-blocking toasts across the entire app
if (typeof window !== 'undefined') {
  window.showToast = showToast;
  window.alert = function(msg) {
    showToast(msg, 'success');
  };
}

// TAB 4: ADMIN EXPLORE PRODUCTS & SERVICES CATALOG
// -------------------------------------------------------------------------------------------------
function renderAdminProductsCatalogTab() {
  const currentStage = app.adminProductFilterStage || "all";
  const query = (app.adminProductSearchQuery || "").toLowerCase().trim();

  let products = PRODUCTS_CATALOG;
  if (currentStage !== "all") {
    products = products.filter(p => p.stage.toLowerCase() === currentStage.toLowerCase());
  }
  if (query) {
    products = products.filter(p => 
      p.name.toLowerCase().includes(query) ||
      p.role.toLowerCase().includes(query) ||
      p.description.toLowerCase().includes(query)
    );
  }

  // Count active deployments for each product
  const deploymentCounts = {};
  app.clients.forEach(c => {
    (c.grantedProducts || []).forEach(pid => {
      deploymentCounts[pid] = (deploymentCounts[pid] || 0) + 1;
    });
  });

  return `
    <div class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-slate-900 tracking-tight">York IE 18-Product Suite</h2>
          <p class="text-xs text-slate-500 mt-0.5">
            18 B2B software solutions organized across 5 core stages: Decide, Execute, Measure, Assess, and Operate.
          </p>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <div class="relative w-64">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              ${getIconSvg("Search", 14)}
            </div>
            <input 
              type="text" 
              value="${app.adminProductSearchQuery || ""}" 
              oninput="app.setAdminProductSearchQuery(this.value)" 
              placeholder="Search 18 products..." 
              class="w-full pl-9 pr-8 py-2 bg-white border border-slate-300 rounded-xl text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 shadow-2xs transition-all"
            />
          </div>

          <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-slate-200 shadow-2xs text-xs overflow-x-auto">
            ${['all', 'decide', 'execute', 'measure', 'assess', 'operate'].map(stage => `
              <button 
                onclick="app.setAdminProductFilterStage('${stage}')"
                class="px-2.5 py-1 rounded-lg font-semibold capitalize transition-all ${
                  currentStage === stage ? "bg-[#084c36] text-white shadow-2xs" : "text-slate-600 hover:bg-slate-100"
                }"
              >
                ${stage}
              </button>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        ${products.map(p => {
          const count = deploymentCounts[p.id] || 0;
          return `
            <div class="product-card">
              <div>
                <div class="flex items-start justify-between">
                  <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-[#084c36]">
                    ${getIconSvg(p.icon || 'Rocket', 20, '#084c36')}
                  </div>
                  <div class="flex items-center gap-1.5">
                    <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">
                      ${p.stage}
                    </span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                      count > 0 ? "bg-emerald-50 text-emerald-800 border border-emerald-200" : "bg-slate-50 text-slate-500"
                    }">
                      ${count} Accounts
                    </span>
                  </div>
                </div>

                <h3 class="font-bold text-slate-900 text-sm mt-3">${p.name}</h3>
                <p class="text-xs text-slate-600 font-medium mt-1">${p.role}</p>

function setInvitePreset(type) {
  const checks = document.querySelectorAll('.invite-prod-check');
  checks.forEach(c => {
    if (type === 'all') c.checked = true;
    else if (type === 'clear') c.checked = false;
    else if (type === 'core') c.checked = ['fuel', 'growthos', 'gtm-launchpad', 'pulse'].includes(c.value);
  });
}

  const checks = document.querySelectorAll('.invite-prod-check:checked');

  closeModal();
  app.sendCompanyInviteWithServices(clientId, selected);
}

        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-[#084c36] text-white flex items-center justify-center font-bold text-sm">
              ${client.name.substring(0, 2).toUpperCase()}
            </div>
            <div>
              <h3 class="text-lg font-bold text-slate-900">${client.name} Dashboard</h3>
              <p class="text-xs text-slate-500">${client.domain} · Lead: ${client.yorkLead || "Kyle York"}</p>
            </div>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-sm">✕</button>
        </div>

        <div class="p-6 space-y-6">
          <div class="grid grid-cols-3 gap-3">
            <div class="clean-card !p-3.5">
              <span class="text-[10px] uppercase font-bold text-slate-400">Health Score</span>
              <div class="text-2xl font-bold text-slate-900 mt-1">${client.healthTelemetry?.score || 94} / 100</div>
              <span class="text-[10px] text-emerald-700 font-bold">Healthy</span>
            </div>

            <div class="clean-card !p-3.5">
              <span class="text-[10px] uppercase font-bold text-slate-400">Tokens Consumed</span>
              <div class="text-2xl font-bold text-slate-900 mt-1">${(tokens.used).toLocaleString()}</div>
              <span class="text-[10px] text-slate-400">Zero-billing policy</span>
            </div>

            <div class="clean-card !p-3.5">
              <span class="text-[10px] uppercase font-bold text-slate-400">Active Services</span>
              <div class="text-2xl font-bold text-slate-900 mt-1">${granted.length} Tools</div>
              <span class="text-[10px] text-purple-700 font-bold">Provisioned</span>
            </div>
          </div>

          <div>
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Assigned Software Workspaces</h4>
            <div class="grid grid-cols-2 gap-2">
              ${granted.map(pid => {
                const p = PRODUCTS_CATALOG.find(item => item.id === pid);
                return `
                  <div class="p-3 rounded-xl border border-slate-200 flex items-center justify-between">
                    <div>
                      <div class="font-bold text-xs text-slate-900">${p?.name || pid}</div>
                      <div class="text-[10px] text-slate-500">${p?.stage || 'GA'}</div>
                    </div>
                    <span class="badge-in-path">Active</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          ${blockers.length > 0 ? `
            <div>
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Operational Blockers</h4>
              <div class="space-y-2">
                ${blockers.map(b => `
                  <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-between">
                    <div>
                      <div class="font-bold text-xs text-amber-900">${b.title}</div>
                      <div class="text-[11px] text-amber-800 mt-0.5">${b.description}</div>
                    </div>
                    <button onclick="app.resolveBlocker('${client.id}', '${b.id}')" class="px-2.5 py-1 bg-amber-700 hover:bg-amber-800 text-white text-[11px] font-bold rounded-lg">Resolve</button>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div class="pt-4 border-t border-slate-100 flex justify-end">
            <button onclick="closeModal()" class="px-4 py-2 bg-[#084c36] text-white rounded-lg text-xs font-bold">Done</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function openLaunchWorkspaceModal(productId) {
  const p = PRODUCTS_CATALOG.find(item => item.id === productId);
  const root = document.getElementById('modal-root');
  if (!root) return;
  root.innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-800 flex items-center justify-center font-bold">
              ${getIconSvg(p?.icon || 'Rocket', 16, '#065f46')}
            </div>
            <h3 class="text-base font-bold text-slate-900">${p?.name || 'Workspace'}</h3>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-sm">✕</button>
        </div>
        <div class="p-6 space-y-4 text-xs">
          <p class="text-slate-600 leading-relaxed">${p?.description}</p>
          <div class="bg-slate-900 text-emerald-400 p-4 rounded-xl font-mono text-[11px]">
            &gt; Initializing secure workspace session...<br>
            &gt; Authentication token validated.<br>
            &gt; Redirecting to ${p?.name || 'Tool'} cloud instance...
          </div>
          <div class="pt-4 flex justify-end">
            <button onclick="closeModal(); showToast('${p?.name} workspace launched in new tab.', 'success')" class="px-4 py-2 bg-[#084c36] text-white rounded-lg text-xs font-bold">Open Session →</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function openAddCompetitorModal() {
  const root = document.getElementById('modal-root');
  if (!root) return;
  root.innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-900">Add Tracked Competitor</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-sm">✕</button>
        </div>
        <form onsubmit="handleAddCompetitorSubmit(event)" class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Competitor Name</label>
            <input type="text" id="comp-name" required placeholder="e.g. Rival AI" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Domain</label>
            <input type="text" id="comp-domain" required placeholder="rival.com" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Market Segment</label>
            <input type="text" id="comp-seg" placeholder="e.g. Cloud APM" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>
          <div class="pt-4 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-xs font-semibold">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-[#084c36] text-white rounded-lg text-xs font-bold">Start Indexing</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function handleAddCompetitorSubmit(e) {
  e.preventDefault();
  const name = document.getElementById('comp-name').value;
  const domain = document.getElementById('comp-domain').value;
  const segment = document.getElementById('comp-seg').value;
  closeModal();
  app.addTrackedCompetitor(app.getCurrentClient()?.id, { name, domain, segment, threatLevel: 'medium' });
  showToast(`Competitor "${name}" added to live Fuel threat radar!`, 'success');
}

function openNewTicketModal() {
  const root = document.getElementById('modal-root');
  if (!root) return;
  root.innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-900">Raise Support Ticket</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-sm">✕</button>
        </div>
        <form onsubmit="handleNewTicketSubmit(event)" class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Issue Title</label>
            <input type="text" id="tkt-title" required placeholder="e.g. Webhook timeout on PR merge" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Platform</label>
            <select id="tkt-platform" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
              ${PRODUCTS_CATALOG.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Severity</label>
            <select id="tkt-sev" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="medium">Medium</option>
              <option value="high">High - Urgent</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Description</label>
            <textarea id="tkt-desc" rows="3" required placeholder="Describe what happened..." class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
          </div>
          <div class="pt-4 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-xs font-semibold">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-[#084c36] text-white rounded-lg text-xs font-bold">Submit Ticket</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function handleNewTicketSubmit(e) {
  e.preventDefault();
  const title = document.getElementById('tkt-title').value;
  const product = document.getElementById('tkt-platform').value;
  const severity = document.getElementById('tkt-sev').value;
  const description = document.getElementById('tkt-desc').value;
  closeModal();
  app.createSupportTicket(app.getCurrentClient()?.id, { product, title, severity, description });
  showToast("Support ticket raised. Assigned York engineering specialist notified.", "success");
}

// Global bootstrap
document.addEventListener("DOMContentLoaded", () => {
  render();
});

// Run immediate render
render();
</script>
</body>
</html>
