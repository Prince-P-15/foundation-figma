:root[data-theme="dark"] .svc-assign-status.is-pending {
  color: #FDE68A;
  background: rgba(245, 158, 11, 0.16);
  border-color: rgba(253, 230, 138, 0.3);
}
.svc-assign-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-card);
}
.svc-assign-count-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 140px;
}
.svc-assign-count {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}
.svc-assign-count span {
  font-weight: 400;
  color: var(--text-muted);
}
.svc-assign-progress {
  height: 5px;
  border-radius: 999px;
  background: var(--bg-subtle-2);
  overflow: hidden;
  width: 160px;
  max-width: 100%;
}
.svc-assign-progress > span {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, #059669 0%, #10B981 60%, #34D399 100%);
  transition: width 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.svc-assign-presets {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.svc-assign-preset {
  height: 30px;
  padding: 0 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 550;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.12s;
}
.svc-assign-preset:hover {
  background: var(--bg-subtle-2);
  color: var(--text-main);
  border-color: var(--line-strong);
}
.svc-assign-preset.is-active {
  background: color-mix(in srgb, var(--emerald-subtle, #ECFDF5) 85%, white);
  color: var(--emerald-dark, #047857);
  border-color: color-mix(in srgb, var(--emerald, #10B981) 35%, transparent);
}
:root[data-theme="dark"] .svc-assign-preset.is-active {
  background: rgba(16, 185, 129, 0.16);
  color: #6EE7B7;
  border-color: rgba(110, 231, 183, 0.3);
}
.svc-assign-stages {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: 4px;
  border-radius: 12px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
}
.svc-assign-stage-btn {
  height: 30px;
  padding: 0 11px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 550;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.svc-assign-stage-btn:hover {
  color: var(--text-main);
  background: var(--bg-card);
}
.svc-assign-stage-btn.is-active {
  background: var(--bg-card);
  color: var(--text-main);
  border-color: var(--line);
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}
.svc-assign-stage-count {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--bg-subtle-2);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 650;
  display: inline-grid;
  place-items: center;
}
.svc-assign-stage-btn.is-active .svc-assign-stage-count {
  background: color-mix(in srgb, var(--emerald-subtle, #ECFDF5) 80%, white);
  color: var(--emerald-dark, #047857);
}
.svc-assign-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-height: min(440px, 50vh);
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 2px 2px 4px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.svc-assign-list::-webkit-scrollbar {
  width: 0;
  height: 0;
}
.svc-assign-list.is-scrolling {
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.svc-assign-list.is-scrolling::-webkit-scrollbar {
  width: 6px;
  height: 0;
}
.svc-assign-list.is-scrolling::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 999px;
}
.svc-assign-list.is-scrolling::-webkit-scrollbar-track {
  background: transparent;
}
.svc-assign-group {
  min-width: 0;
}
.svc-assign-group-title {
  margin: 0 0 10px;
  font-size: 11px;
  font-weight: 650;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}
.svc-assign-group-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}
.svc-assign-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.svc-assign-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 13px 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s, box-shadow 0.18s, transform 0.18s;
  position: relative;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
}
.svc-assign-card:hover {
  border-color: var(--line-strong);
  background: var(--bg-subtle);
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
}
.svc-assign-card.is-selected {
  border-color: color-mix(in srgb, var(--emerald, #10B981) 45%, var(--line));
  background: color-mix(in srgb, var(--emerald-subtle, #ECFDF5) 55%, var(--bg-card));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--emerald, #10B981) 12%, transparent);
}
:root[data-theme="dark"] .svc-assign-card.is-selected {
  background: rgba(16, 185, 129, 0.1);
  border-color: rgba(110, 231, 183, 0.35);
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
}
.svc-assign-card input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.svc-assign-card-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--icon-gradient, var(--btn-primary-bg));
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #fff;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  box-shadow: 0 4px 10px -2px var(--icon-bloom, rgba(16, 185, 129, 0.3));
  transition: transform 0.18s ease;
}
.svc-assign-card:hover .svc-assign-card-icon {
  transform: scale(1.05);
}
.svc-assign-card-icon i,
.svc-assign-card-icon svg {
  width: 16px;
  height: 16px;
  color: #fff !important;
  stroke: #fff;
}
.svc-assign-card-copy {
  flex: 1;
  min-width: 0;
}
.svc-assign-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.svc-assign-card-name {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.3;
}
.svc-assign-card-stage {
  display: inline-flex;
  margin-top: 4px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 999px;
  border: 1px solid transparent;
}
.svc-assign-card-check {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 1.5px solid var(--line-strong);
  background: var(--bg-card);
  color: transparent;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;
}
.svc-assign-card-check i,
.svc-assign-card-check svg {
  width: 12px;
  height: 12px;
}
.svc-assign-card.is-selected .svc-assign-card-check {
  background: var(--btn-primary-bg);
  border-color: var(--btn-primary-bg);
  color: #fff;
  transform: scale(1.05);
}
.svc-assign-card-desc {
  margin: 6px 0 0;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.svc-assign-footer-meta {
  margin-right: auto;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
}
.svc-assign-footer-meta strong {
  color: var(--text-main);
  font-weight: 650;
}
.svc-assign-modal .modal-footer {
  background: var(--bg-subtle);
}
@media (max-width: 700px) {
  .svc-assign-grid {
    grid-template-columns: 1fr;
  }
  .svc-assign-progress {
    width: 120px;
  }
}
.modal-console {
  background: #0F172A;
  color: #6EE7B7;
  padding: 14px 16px;
  border-radius: 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  border: 1px solid rgba(255,255,255,0.08);
}


/* ─── CANVAS CONTENT FLOW & LAYOUT RHYTHM ─── */
.canvas-content-flow {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 100%;
}

/* ─── EXECUTIVE CARDS & CONTAINERS ─── */
.clean-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 22px 24px;
  box-shadow: var(--shadow-card);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}
.clean-card:hover {
  border-color: var(--line-strong);
  box-shadow: none;
}

/* ─── CADENCE STRATEGY WIDGET (CLIENT WORKSPACES) ─── */
.cadence-widget {
  background: var(--bg-card);
  color: var(--text-main);
  border-radius: 12px;
  padding: 20px 24px;
  box-shadow: none;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
  overflow: hidden;
}
.cadence-widget::after {
  display: none;
}
.cadence-tag {
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--line);
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  display: inline-block;
}

/* ─── PRODUCT CARDS (WORKSPACES & CATALOG) ─── */
.product-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
  box-shadow: var(--shadow-card);
  position: relative;
}
.product-card:hover {
  border-color: var(--emerald);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
  transform: translateY(-2px);
}
.product-card.active-granted {
  border-color: var(--emerald-light);
  background: var(--bg-card);
}
:root[data-theme="dark"] .product-card.active-granted {
  border-color: rgba(0, 180, 138, 0.35);
}
.product-card.active-granted::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--cta-primary-bg);
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
}

/* Workspaces first-screen hero + card system */
.workspaces-hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.workspaces-eyebrow {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 6px;
}
.workspaces-hero .page-headline-lead {
  font-size: 22px !important;
  letter-spacing: -0.02em;
  color: var(--text-main);
}
:root[data-theme="dark"] .workspaces-hero .page-headline-lead {
  color: var(--text-main);
}
.workspaces-hero-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 2px;
}
.workspaces-meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 12px;
  border-radius: 9999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  box-shadow: var(--shadow-pill);
}
.workspaces-meta-pill .meta-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--emerald) 20%, transparent);
}
.workspaces-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
@media (max-width: 900px) {
  .workspaces-grid {
    grid-template-columns: 1fr;
  }
}
.workspace-card {
  background: var(--bg-card);
  border: 0.75px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.workspace-card:hover {
  border-color: var(--line-active);
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-2px);
}
.workspace-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.workspace-card-identity {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.workspace-card-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border: 1px solid color-mix(in srgb, var(--emerald) 24%, transparent);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.workspace-card-icon i,
.workspace-card-icon svg {
  width: 18px;
  height: 18px;
  color: var(--emerald-dark) !important;
  stroke: var(--emerald-dark);
}
.workspace-card-name {
  margin: 0;
  font-size: 15px;
  font-weight: 650;
  color: var(--text-main);
  letter-spacing: -0.02em;
  line-height: 1.3;
}
.workspace-card-stage {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  flex-shrink: 0;
  padding-top: 2px;
}
.workspace-card-role {
  margin: 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  line-height: 1.4;
}
.workspace-card-desc {
  margin: 6px 0 0;
  font-size: 14px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.5;
}
.workspace-status-block {
  margin-top: auto;
  padding-top: 4px;
}
.workspace-status-label {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.workspace-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.workspace-status-row .live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--emerald);
}
.workspace-status-bar {
  height: 5px;
  border-radius: 9999px;
  background: var(--bg-subtle-2);
  overflow: hidden;
}
.workspace-status-bar > span {
  display: block;
  height: 100%;
  width: 100%;
  border-radius: 9999px;
  background: var(--btn-primary-bg);
}
.workspace-launch-btn {
  width: 100%;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--btn-primary-bg);
  border: 1px solid var(--btn-primary-bg);
  border-radius: 10px;
  color: #ffffff !important;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.12s ease;
}
.workspace-launch-btn:hover {
  background: var(--btn-primary-hover, #005E44);
}
.workspace-launch-btn:active {
  transform: scale(0.99);
}

/* ─── SOW MILESTONES PIPELINE ─── */
.pipeline-col {
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  min-height: 380px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.milestone-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  box-shadow: var(--shadow-card);
  transition: all 0.18s ease;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.milestone-card:hover {
  border-color: var(--line-strong);
  box-shadow: none;
  transform: none;
}

/* Initiatives page (client portal) */
.initiatives-banner {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-card);
}
.initiatives-banner-title {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: -0.01em;
  line-height: 1.25;
}
.initiatives-banner-desc {
  margin: 8px 0 0;
  font-size: 14px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.5;
  max-width: 640px;
}
.initiatives-awaiting-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
  height: 32px;
  padding: 0 12px;
  border-radius: 9999px;
  background: rgba(124, 58, 237, 0.12);
  border: 1px solid rgba(124, 58, 237, 0.28);
  color: #6D28D9;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.initiatives-awaiting-pill .await-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #7C3AED;
}
.initiatives-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
@media (max-width: 900px) {
  .initiatives-banner {
    flex-direction: column;
  }
  .initiatives-grid {
    grid-template-columns: 1fr;
  }
}
.initiative-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.15s ease;
}
.initiative-card:hover {
  box-shadow: none;
  border-color: var(--line-strong);
}
.initiative-card.needs-signoff {
  border-color: var(--line-strong);
  box-shadow: none;
}
.initiative-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.initiative-practice {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--line);
}
.initiative-status {
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.initiative-status.approved { color: var(--text-secondary); }
.initiative-status.signoff { color: #B45309; }
.initiative-status.delivery { color: var(--text-secondary); }
.initiative-status.scoping { color: var(--text-muted); }
.initiative-title {
  margin: 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-main);
  letter-spacing: -0.01em;
  line-height: 1.3;
}
.initiative-meta {
  margin: 0;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.5;
}
.initiative-desc-box {
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.initiative-deliverable-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 4px;
}
.initiative-deliverable-value {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.35;
}
.initiative-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.initiative-footer-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-faint);
}
.initiative-footer-status {
  font-size: 12px;
  font-weight: 600;
  color: var(--emerald-dark);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.initiative-footer-muted {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}
.initiative-signoff-btn {
  height: 34px;
  padding: 0 14px;
  border-radius: 8px;
  border: 1px solid #6D28D9;
  background: #7C3AED;
  color: #ffffff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s ease;
}
.initiative-signoff-btn:hover {
  background: #6D28D9;
}

/* Support Desk (client portal) */
.support-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 24px;
  border-radius: 16px;
  background: linear-gradient(135deg, #063828 0%, #084C36 55%, #0A5C42 100%);
  color: #ffffff;
  box-shadow: 0 12px 28px rgba(8, 76, 54, 0.28);
}
.support-hero-tags {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.support-hero-tag {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #A7F3D0;
}
.support-hero-sla {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 600;
  background: rgba(52, 211, 153, 0.18);
  border: 1px solid rgba(52, 211, 153, 0.35);
  color: #D1FAE5;
}
.support-hero-title {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.3;
  color: #ffffff;
}
.support-hero-desc {
  margin: 8px 0 0;
  font-size: 14px;
  line-height: 1.5;
  color: rgba(255, 255, 255, 0.78);
  max-width: 560px;
}
.support-raise-btn {
  flex-shrink: 0;
  height: 40px;
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: 10px;
  border: none;
  background: #ffffff;
  color: #063828;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  transition: transform 0.12s ease, background 0.15s ease;
}
.support-raise-btn:hover {
  background: #F0FDF4;
  transform: translateY(-1px);
}
.support-tickets-panel {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.support-tickets-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-subtle);
}
.support-tickets-title {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
}
.support-tickets-caption {
  font-size: 12px;
  color: var(--text-muted);
}
.support-ticket-list {
  display: flex;
  flex-direction: column;
}
.support-ticket-card {
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.support-ticket-card:last-child {
  border-bottom: none;
}
.support-ticket-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.support-ticket-badges {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.support-status-badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 9px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 600;
}
.support-status-badge.in_progress {
  background: var(--info-bg);
  color: var(--info-text);
  border: 1px solid color-mix(in srgb, var(--info-text) 28%, transparent);
}
.support-status-badge.resolved {
  background: var(--ok-bg);
  color: var(--ok-text);
  border: 1px solid color-mix(in srgb, var(--ok-text) 28%, transparent);
}
.support-status-badge.open,
.support-status-badge.new {
  background: var(--warn-bg);
  color: var(--warn-text);
  border: 1px solid color-mix(in srgb, var(--warn-text) 28%, transparent);
}
.support-product-badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 9px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--line);
}
.support-ticket-title {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: -0.02em;
  line-height: 1.35;
}
.support-ticket-id {
  color: var(--text-faint);
  font-weight: 600;
}
.support-ticket-time {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--text-muted);
  padding-top: 2px;
  white-space: nowrap;
}
.support-ticket-desc {
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.support-ticket-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  font-size: 12px;
  color: var(--text-muted);
}
.support-ticket-meta strong {
  color: var(--text-secondary);
  font-weight: 600;
}
.support-ticket-meta .sev-high { color: #B91C1C; }
.support-ticket-meta .sev-medium { color: #C2410C; }
.support-ticket-meta .sev-low { color: var(--emerald-dark); }
.support-york-response {
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--emerald-subtle);
  border: 1px solid var(--emerald-light);
}
.support-york-response-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--emerald-dark);
  margin-bottom: 4px;
}
.support-york-response-text {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.support-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-muted);
}
@media (max-width: 800px) {
  .support-hero {
    flex-direction: column;
    align-items: flex-start;
  }
  .support-tickets-header {
    flex-direction: column;
    align-items: flex-start;
  }
}

/* Team & Access (client portal) — member cards */
.team-access-surface {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 18px 16px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.team-access-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.team-access-toolbar-title {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: -0.01em;
}
.team-access-toolbar-meta {
  margin: 3px 0 0;
  font-size: 13px;
  color: var(--text-muted);
}
.team-access-legend {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-muted);
}
.team-access-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.team-access-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--line-strong);
}
.team-access-dot.on {
  background: var(--emerald, #10B981);
}
.team-access-dot.lock {
  background: var(--text-secondary);
}
.team-member-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 980px) {
  .team-member-grid {
    grid-template-columns: 1fr;
  }
}
.team-member-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
}
.team-member-card:hover {
  border-color: var(--line-strong);
  box-shadow: var(--shadow-card-hover, 0 8px 20px rgba(15, 23, 42, 0.06));
  transform: translateY(-1px);
}
.team-member-card.is-owner {
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--emerald-subtle, #ECFDF5) 70%, var(--bg-card)) 0%, var(--bg-card) 58%);
}
:root[data-theme="dark"] .team-member-card.is-owner {
  background:
    linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, var(--bg-card) 58%);
}
.team-member-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.team-member-identity {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}
.team-member-avatar {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  background: var(--bg-subtle-2);
  color: var(--text-secondary);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 650;
  flex-shrink: 0;
}
.team-member-card.is-owner .team-member-avatar {
  background: var(--btn-primary-bg, #084C36);
  color: #fff;
  border-color: transparent;
}
.team-member-name {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.3;
}
.team-member-meta {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 260px;
}
.team-member-role {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  flex-shrink: 0;
}
.team-member-role.owner {
  background: color-mix(in srgb, var(--emerald-subtle, #ECFDF5) 80%, white);
  color: var(--emerald-dark, #047857);
  border-color: color-mix(in srgb, var(--emerald, #10B981) 28%, transparent);
}
:root[data-theme="dark"] .team-member-role.owner {
  background: rgba(16, 185, 129, 0.16);
  color: #6EE7B7;
  border-color: rgba(110, 231, 183, 0.28);
}
.team-member-coverage {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.team-member-coverage-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.team-member-coverage-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
}
.team-member-coverage-value {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.team-member-coverage-value.full {
  color: var(--emerald-dark, #047857);
}
.team-member-coverage-value.none {
  color: var(--text-muted);
  font-weight: 500;
}
.team-member-bar {
  height: 6px;
  border-radius: 999px;
  background: var(--bg-subtle-2);
  overflow: hidden;
}
.team-member-bar > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #059669 0%, #10B981 55%, #34D399 100%);
}
.team-member-services-label {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.team-member-services {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.team-service-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 550;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.12s;
}
.team-service-chip:hover {
  border-color: var(--line-strong);
  color: var(--text-main);
  background: var(--bg-subtle-2);
}
.team-service-chip.on {
  background: color-mix(in srgb, var(--emerald-subtle, #ECFDF5) 85%, white);
  border-color: color-mix(in srgb, var(--emerald, #10B981) 35%, transparent);
  color: var(--emerald-dark, #047857);
}
:root[data-theme="dark"] .team-service-chip.on {
  background: rgba(16, 185, 129, 0.16);
  border-color: rgba(110, 231, 183, 0.3);
  color: #6EE7B7;
}
.team-service-chip.locked {
  cursor: default;
  background: var(--bg-subtle-2);
  border-color: var(--line-strong);
  color: var(--text-main);
}
.team-service-chip.locked:hover {
  transform: none;
}
.team-service-chip i,
.team-service-chip svg {
  width: 12px;
  height: 12px;
}
.team-access-empty {
  grid-column: 1 / -1;
  padding: 36px 20px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 14px;
  background: var(--bg-subtle);
}
.team-access-empty-title {
  margin: 0 0 4px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
}
.team-access-empty-copy {
  margin: 0 0 14px;
  font-size: 13px;
  color: var(--text-muted);
}
.team-access-note {
  margin: 0;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
}
.team-invite-services {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.team-invite-service {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 550;
  cursor: pointer;
  user-select: none;
}
.team-invite-service input {
  accent-color: var(--emerald, #10B981);
}
.team-invite-service:has(input:checked) {
  background: color-mix(in srgb, var(--emerald-subtle, #ECFDF5) 85%, white);
  border-color: color-mix(in srgb, var(--emerald, #10B981) 35%, transparent);
  color: var(--emerald-dark, #047857);
}
:root[data-theme="dark"] .team-invite-service:has(input:checked) {
  background: rgba(16, 185, 129, 0.16);
  border-color: rgba(110, 231, 183, 0.3);
  color: #6EE7B7;
}

/* ─── THREAT SIGNALS ─── */
.threat-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow-card);
  transition: all 0.2s ease;
}
.threat-card:hover {
  border-color: var(--line-strong);
  box-shadow: none;
}
.counter-strategy-box {
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
}

/* ─── PERKS CATALOG ─── */
.perk-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-card);
  min-height: 220px;
}
.perk-card:hover {
  transform: translateY(-2px);
  border-color: var(--emerald);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
}
.savings-bar-container {
  height: 8px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 9999px;
  overflow: hidden;
  position: relative;
}
.savings-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #10B981 0%, #34D399 100%);
  border-radius: 9999px;
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ─── BADGES ─── */
.badge-in-path {
  background-color: var(--emerald-subtle);
  color: var(--emerald-dark);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 9999px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid rgba(0, 180, 138, 0.3);
}
.badge-in-path::before {
  content: "";
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background-color: var(--emerald);
}

.badge-member-access {
  background-color: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 9999px;
  border: 1px solid var(--line);
}

/* York Ecosystem catalog (client portal) */
.eco-panel {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow-card);
  padding: 22px 22px 20px;
}
.eco-panel-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
.eco-eyebrow {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.eco-title {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-main);
  line-height: 1.25;
}
.eco-hint {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  padding-bottom: 4px;
  white-space: nowrap;
}
.eco-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}
.eco-filter-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.eco-filter-btn:hover {
  border-color: var(--line-strong);
  color: var(--text-main);
}
.eco-filter-btn.active {
  background: var(--bg-subtle-2);
  border-color: var(--line-strong);
  color: var(--text-main);
  font-weight: 500;
}
.eco-filter-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-subtle-2);
  color: var(--text-muted);
}
.eco-filter-btn.active .eco-filter-count {
  background: var(--bg-card);
  color: var(--text-muted);
}
.eco-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.eco-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 168px;
  box-shadow: var(--shadow-card);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.eco-card:hover {
  border-color: var(--line-active);
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-2px);
}
.eco-card-stage {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.eco-card-name {
  margin: 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-main);
  letter-spacing: -0.01em;

// Helper: Calculate Syndicate Perk Savings for a client
function getClientPerkSavings(client) {
  const claimedIds = client.claimedPerks || [];
  let claimedTotal = 0;
  let totalAvailable = 0;
  SYNDICATE_PERKS_CATALOG.forEach(perk => {
    totalAvailable += perk.valueNumber;
    if (claimedIds.includes(perk.id)) {
      claimedTotal += perk.valueNumber;
    }
  });
  const remainingTotal = Math.max(0, totalAvailable - claimedTotal);
  const pct = Math.round((claimedTotal / (totalAvailable || 1)) * 100);
  return {
    claimedTotal,
    remainingTotal,
    totalAvailable,
    pct,
    claimedCount: claimedIds.length,
    totalCount: SYNDICATE_PERKS_CATALOG.length
  };
}

// Token calculation helpers (Tokens, not credits)
function getCompanyTokens(client) {
  if (!client) return { allocated: 25000, total: 25000, used: 0, percent: 0, balance: 25000 };
  if (client.tokenUsage && typeof client.tokenUsage.allocated === "number") {
    const allocated = client.tokenUsage.allocated || 25000;
    const used = client.tokenUsage.used || 0;
    const percent = Math.min(100, Math.round((used / allocated) * 100));
    return { allocated, total: allocated, used, percent, balance: allocated - used };
  }
  const map = {
    "client-cloudscale": { allocated: 60000, used: 38450 },
    "client-novubio": { allocated: 35000, used: 18200 },
    "client-apexfin": { allocated: 25000, used: 5000 },
    "client-datastream": { allocated: 25000, used: 0 },
    "client-biogenix": { allocated: 15000, used: 0 },
    "client-krypton": { allocated: 20000, used: 0 },
    "client-veloce": { allocated: 25000, used: 0 },
    "client-omnihealth": { allocated: 30000, used: 0 },
    "client-aerosphere": { allocated: 25000, used: 0 }
  };
  const item = map[client.id] || { allocated: 25000, used: 0 };
  const percent = Math.min(100, Math.round((item.used / item.allocated) * 100));
  return { allocated: item.allocated, total: item.allocated, used: item.used, percent, balance: item.allocated - item.used };
}

function getPortfolioTokenTotals() {
  let totalAllocated = 0;
  let totalUsed = 0;
  app.clients.forEach(c => {
    const t = getCompanyTokens(c);
    totalAllocated += t.allocated;
    totalUsed += t.used;
  });
  const percent = totalAllocated > 0 ? Math.round((totalUsed / totalAllocated) * 100) : 0;
  return { totalAllocated, totalUsed, percent, totalRemaining: totalAllocated - totalUsed };
}

// Application State with LocalStorage
class YorkConsoleApp {
  constructor() {
    this.loadState();
  }

  loadState() {
    try {
      const saved = localStorage.getItem('york_console_state_v19');
      if (saved) {
        const parsed = JSON.parse(saved);
        this.currentUser = parsed.currentUser || null;
        this.hubspotConnected = parsed.hubspotConnected ?? true; // Defaults connected for smooth testing!
        this.hubspotDeals = parsed.hubspotDeals || INITIAL_HUBSPOT_DEALS;
        this.clients = parsed.clients || INITIAL_CLIENTS;
        this.adminSearchQuery = parsed.adminSearchQuery || "";
        this.adminFilterStatus = parsed.adminFilterStatus || "all";
        this.adminTab = parsed.adminTab || 'clients'; // 'hubspot', 'clients', 'milestones', 'ecosystem', 'support'
        this.clientTab = parsed.clientTab || 'workspaces';
      if (['cadence', 'threat-radar', 'deliverables', 'perks', 'support', 'radar'].includes(this.clientTab)) this.clientTab = 'workspaces';
      if (this.clientTab === 'products') this.clientTab = 'workspaces';

    const newMemberId = 'user-' + (email.split('@')[0] || Date.now()).toLowerCase().replace(/[^a-z0-9]/g, '');
    const member = {
      id: newMemberId,
      name,
      email,
      role: 'member',
      title: title || 'Team Member',
      allowedProducts: [...allowedProducts]
    };

    client.team.push(member);
    this.saveState();
    return member;
  }

  toggleMemberProduct(clientId, memberId, productId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const member = client.team.find(m => m.id === memberId);
    if (!member || member.role === 'owner') return;

    if (!member.allowedProducts) member.allowedProducts = [];
    if (member.allowedProducts.includes(productId)) {
      member.allowedProducts = member.allowedProducts.filter(id => id !== productId);
    } else {
      member.allowedProducts.push(productId);
    }
    this.saveState();
    render();
  }

  requestMemberAccess(clientId, memberId, productId, note) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const member = client.team.find(m => m.id === memberId);
    const prod = PRODUCTS_CATALOG.find(p => p.id === productId);

    const req = {
      id: 'mreq-' + Date.now(),
      memberId,
      memberName: member?.name || 'Team Member',
      productId,
      productName: prod?.name || productId,
      requestedAt: 'Just now',
      note: note || 'Requesting access to collaborate with the team.',
      status: 'pending'
    };

    client.memberRequests.unshift(req);
    this.saveState();
    return req;
  }

  approveMemberRequest(clientId, requestId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const req = client.memberRequests.find(r => r.id === requestId);
    if (!req) return;

    req.status = 'approved';
    const member = client.team.find(m => m.id === req.memberId);
    if (member && !member.allowedProducts.includes(req.productId)) {
      member.allowedProducts.push(req.productId);
    }
    this.saveState();
    render();
  }

  declineMemberRequest(clientId, requestId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const req = client.memberRequests.find(r => r.id === requestId);
    if (req) req.status = 'declined';
    this.saveState();
    render();
  }
}

// Non-blocking in-app toast notification system (icons + microinteractions)
const TOAST_ICONS = {
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
  warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>',
  loading: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>'
};

function dismissToast(toastEl) {
  if (!toastEl || toastEl.dataset.dismissing === '1') return;
  toastEl.dataset.dismissing = '1';
  toastEl.classList.remove('is-in');
  toastEl.classList.add('is-out');
  const remove = () => toastEl.remove();
  toastEl.addEventListener('transitionend', remove, { once: true });
  setTimeout(remove, 320);
}

function showToast(message, type = 'success', duration = 3500) {
  if (typeof document === 'undefined') return null;

  const normalized = ['success', 'error', 'warning', 'info', 'loading'].includes(type) ? type : 'success';
  const isLoading = normalized === 'loading';
  const ttl = isLoading ? 0 : (typeof duration === 'number' ? duration : 3500);

  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = `york-toast is-${normalized}`;
  toast.setAttribute('role', isLoading ? 'status' : 'alert');
  toast.innerHTML = `
    <div class="york-toast-icon ${isLoading ? 'is-spin' : 'is-pop'}" aria-hidden="true">${TOAST_ICONS[normalized]}</div>
    <div class="york-toast-body">${message}</div>
    <button type="button" class="york-toast-close" aria-label="Dismiss">${TOAST_ICONS.error}</button>
    <div class="york-toast-progress" aria-hidden="true"><span style="${ttl ? `animation-duration:${ttl}ms` : ''}"></span></div>
  `;

  const closeBtn = toast.querySelector('.york-toast-close');
  if (closeBtn) closeBtn.addEventListener('click', () => dismissToast(toast));

  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('is-in'));

  if (ttl > 0) {
    const timer = setTimeout(() => dismissToast(toast), ttl);
    toast._toastTimer = timer;
  }

  return toast;
}

function updateToast(toastEl, message, type) {
  if (!toastEl) return null;
  if (typeof message === 'string') {
    const body = toastEl.querySelector('.york-toast-body');
    if (body) body.innerHTML = message;
  }
  if (type && ['success', 'error', 'warning', 'info', 'loading'].includes(type)) {
    toastEl.className = `york-toast is-in is-${type}`;
    const icon = toastEl.querySelector('.york-toast-icon');
    if (icon) {
      icon.className = `york-toast-icon ${type === 'loading' ? 'is-spin' : 'is-pop'}`;
      icon.innerHTML = TOAST_ICONS[type];
    }
    if (type !== 'loading' && !toastEl._toastTimer) {
      const timer = setTimeout(() => dismissToast(toastEl), 3200);
      toastEl._toastTimer = timer;
      const bar = toastEl.querySelector('.york-toast-progress > span');
      if (bar) bar.style.animationDuration = '3200ms';
    }
  }
  return toastEl;
}

// Ensure smooth non-blocking toasts across the entire app
if (typeof window !== 'undefined') {
  window.showToast = showToast;
  window.dismissToast = dismissToast;
  window.updateToast = updateToast;
  window.alert = function(msg) {
    showToast(msg, 'info');
  };
}

    this._keyBound = (e) => {
      if (!this.active) return;
      if (e.key === 'Escape') this.stop(true);
      if (e.key === 'ArrowRight' || e.key === 'Enter') this.next();
      if (e.key === 'ArrowLeft') this.prev();
    };
    window.addEventListener('resize', this._resizeBound);
    window.addEventListener('keydown', this._keyBound);
  },

  unbind() {
    if (this._resizeBound) window.removeEventListener('resize', this._resizeBound);
    if (this._keyBound) window.removeEventListener('keydown', this._keyBound);
    this._resizeBound = null;
    this._keyBound = null;
  },

  clearLiveTarget() {
    document.querySelectorAll('.tour-target-live').forEach(el => el.classList.remove('tour-target-live'));
  },

  async ensureTab(step) {
    if (!step || !step.tab) return false;
    let changed = false;
    if (this.role === 'admin' && app.adminTab !== step.tab) {
      app.adminTab = step.tab;
      changed = true;
    }
    if (this.role === 'client' && app.clientTab !== step.tab) {
      app.clientTab = step.tab;
      changed = true;
    }
    if (changed) {
      app.saveState();
      render();
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    }
    return changed;
  },

  async go(index, opts = {}) {
    if (!this.active) return;
    if (index < 0 || index >= this.steps.length) {
      this.stop(true);
      if (!opts.fromStart) showToast('Tour complete. Reopen anytime from Tour.', 'success');
      return;
    }
    this.index = index;
    const step = this.steps[index];
    await this.ensureTab(step);
    this.renderStep(step);
  },

  refresh() {
    if (!this.active || !this.steps[this.index]) return;
    this.renderStep(this.steps[this.index]);
  },

  next() { this.go(this.index + 1); },
  prev() { this.go(Math.max(0, this.index - 1)); },

  renderStep(step) {
    const root = document.getElementById('tour-root');
    if (!root) return;
    this.clearLiveTarget();

    let el = document.querySelector(`[data-tour="${step.target}"]`);
    if (!el) {
      // Fallback: skip missing targets forward
      if (this.index < this.steps.length - 1) {
        this.go(this.index + 1);
        return;
      }
      this.stop(true);
      return;
    }

    el.classList.add('tour-target-live');
    try { el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' }); } catch (e) {}

    const rect = el.getBoundingClientRect();
    const pad = 8;
    const spot = {
      top: Math.max(8, rect.top - pad),
      left: Math.max(8, rect.left - pad),
      width: Math.min(window.innerWidth - 16, rect.width + pad * 2),
      height: Math.min(window.innerHeight - 16, rect.height + pad * 2)
    };

    const isLast = this.index === this.steps.length - 1;
    const roleLabel = this.role === 'admin' ? 'Admin tour' : 'Client tour';

    root.classList.add('is-active');
    root.innerHTML = `
      <div class="tour-scrim" onclick="YorkTour.stop(true)"></div>
      <div class="tour-spotlight" style="top:${spot.top}px;left:${spot.left}px;width:${spot.width}px;height:${spot.height}px;"></div>
      <div class="tour-card" role="dialog" aria-modal="true" aria-label="${step.title}">
        <div class="tour-card-kicker">
          <span class="tour-card-role">${roleLabel}</span>
          <span class="tour-card-progress">${this.index + 1} / ${this.steps.length}</span>
        </div>
        <h3 class="tour-card-title">${step.title}</h3>
        <p class="tour-card-body">${step.body}</p>
        <div class="tour-card-actions">
          <button type="button" class="tour-btn tour-btn-ghost" onclick="YorkTour.stop(true)">Skip</button>
          <div class="tour-card-nav">
            <button type="button" class="tour-btn" onclick="YorkTour.prev()" ${this.index === 0 ? 'disabled style="opacity:0.45;cursor:default"' : ''}>Back</button>
            <button type="button" class="tour-btn tour-btn-primary" onclick="YorkTour.${isLast ? 'finish' : 'next'}()">${isLast ? 'Finish' : 'Next'}</button>
          </div>
        </div>
      </div>
    `;

    this.positionCard(spot);
  },

  positionCard(spot) {
    const card = document.querySelector('.tour-card');
    if (!card) return;
    const gap = 14;
    const cardRect = card.getBoundingClientRect();
    let top = spot.top + spot.height + gap;
    let left = spot.left;

    if (top + cardRect.height > window.innerHeight - 12) {
      top = spot.top - cardRect.height - gap;
    }
    if (top < 12) top = 12;

    if (left + cardRect.width > window.innerWidth - 12) {
      left = window.innerWidth - cardRect.width - 12;
    }
    if (left < 12) left = 12;

    // Prefer right side for tall sidebar targets
    if (spot.width > window.innerWidth * 0.35 && spot.left < 80) {
      left = Math.min(window.innerWidth - cardRect.width - 12, spot.left + spot.width + gap);
      top = Math.max(12, Math.min(spot.top, window.innerHeight - cardRect.height - 12));
    }

    card.style.top = `${top}px`;
    card.style.left = `${left}px`;
  },

  finish() {
    this.stop(true);
    showToast('Tour complete. Reopen anytime from Tour in the top bar.', 'success');
  }
};

function refreshLucideIcons() {
  const run = () => {
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
      return true;
    }
    return false;
  };
  if (run()) return;
  // Lucide CDN may still be loading on first paint — retry briefly
  let tries = 0;
  const timer = setInterval(() => {
    tries += 1;
    if (run() || tries >= 20) clearInterval(timer);
  }, 50);
}

function render() {
  const root = document.getElementById('app-root');
  if (!root) return;
  const tourWasActive = !!(window.YorkTour && YorkTour.active);

  if (!app.currentUser) {
    if (tourWasActive) YorkTour.stop(false);
    root.innerHTML = renderLoginScreen();
    renderGlobalWidgets();
    requestAnimationFrame(() => refreshLucideIcons());
    return;
  }

  if (app.currentUser.role === 'admin') {
    root.innerHTML = renderAdminConsole();
  } else {
    root.innerHTML = renderClientDashboard();
  }

  renderGlobalWidgets();
  // Ensure catalog/ecosystem icons paint on first load and after tab switches
  requestAnimationFrame(() => {
    refreshLucideIcons();
    requestAnimationFrame(() => refreshLucideIcons());
  });

  if (tourWasActive) {
    requestAnimationFrame(() => YorkTour.refresh());
  } else {
    YorkTour.maybeAutoStart();
  }
}

  const user = app.currentUser;
  const raw = (user?.name || "").trim();

function renderAdminCompaniesTab() {
  const query = (app.adminSearchQuery || "").toLowerCase().trim();
  const filter = app.adminFilterStatus || "all";

  let companies = app.clients || [];
  if (filter === "active") {
    companies = companies.filter(c => c.status === "active");
  } else if (filter === "invited") {
    companies = companies.filter(c => c.status === "invited");
  } else if (filter === "pending") {
    companies = companies.filter(c => c.status === "pending_invite");
  }

  if (query) {

function ticketStatusLabel(status) {
  if (status === 'resolved') return 'Resolved';
  if (status === 'in_progress') return 'In Progress';
  return 'Open';
}

function ticketStatusClass(status) {
  if (status === 'resolved') return 'resolved';
  if (status === 'in_progress') return 'in_progress';
  return 'open';
}

function ticketCode(id) {
  return `#${String(id || 'tkt-101')}`;
}

function filterTicketCollection(tickets, filter, query, fields = []) {
  let filtered = tickets;
  if (filter && filter !== 'all') filtered = filtered.filter(t => t.status === filter);
  const q = (query || '').toLowerCase().trim();
  if (!q) return filtered;
  return filtered.filter(t => fields.some(key => String(t[key] || '').toLowerCase().includes(q)));
}

function renderSupportPlatformOptions(ticket) {
  const granted = ticket.grantedProducts || [];
  let options = PRODUCTS_CATALOG.filter(p => granted.includes(p.id));
  if (!options.length) options = PRODUCTS_CATALOG.slice(0, 8);
  if (ticket.product && !options.some(p => p.id === ticket.product)) {
    const current = PRODUCTS_CATALOG.find(p => p.id === ticket.product);
    if (current) options = [current, ...options];
  }
  return options.map(p => {
    const stage = (p.stageClass || p.stage || '').toString().toUpperCase();
    const selected = p.id === ticket.product ? ' selected' : '';
    return `<option value="${p.id}"${selected}>${p.name}${stage ? ` (${stage})` : ''}</option>`;
  }).join('');
}

function closeSupportTicketMenus(exceptId) {
  document.querySelectorAll('.sd-menu-wrap.is-open').forEach(wrap => {
    const menu = wrap.querySelector('.sd-menu');
    if (exceptId && menu && menu.id === exceptId) return;
    wrap.classList.remove('is-open');
    if (menu) {
      menu.hidden = true;
      menu.style.top = '';
      menu.style.right = '';
      menu.style.left = '';
    }
    const trigger = wrap.querySelector('.sd-menu-trigger');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  });
}

function positionSupportTicketMenu(menu, trigger) {
  if (!menu || !trigger) return;
  const rect = trigger.getBoundingClientRect();
  menu.style.left = 'auto';
  menu.style.right = `${Math.max(8, window.innerWidth - rect.right)}px`;
  menu.style.top = `${rect.bottom + 6}px`;
  const mRect = menu.getBoundingClientRect();
  if (mRect.bottom > window.innerHeight - 8) {
    menu.style.top = `${Math.max(8, rect.top - mRect.height - 6)}px`;
  }
  if (mRect.left < 8) {
    menu.style.right = 'auto';
    menu.style.left = '8px';
  }
}

function toggleSupportTicketMenu(menuId, event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  const menu = document.getElementById(menuId);
  if (!menu) return;
  const wrap = menu.closest('.sd-menu-wrap');
  const trigger = wrap ? wrap.querySelector('.sd-menu-trigger') : null;
  const willOpen = menu.hidden;
  closeSupportTicketMenus(willOpen ? menuId : null);
  menu.hidden = !willOpen;
  if (wrap) wrap.classList.toggle('is-open', willOpen);
  if (trigger) trigger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  if (willOpen) {
    positionSupportTicketMenu(menu, trigger);
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  } else {
    menu.style.top = '';
    menu.style.right = '';
    menu.style.left = '';
  }
}

if (typeof window !== 'undefined' && !window.__yorkSupportTicketMenuBound) {
  window.__yorkSupportTicketMenuBound = true;
  document.addEventListener('click', () => closeSupportTicketMenus());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSupportTicketMenus();
  });
}

  `;

  let primary = '';
  let menuItems = '';

  if (status === 'resolved') {
    primary = `
      <button type="button" class="btn-saas-secondary" onclick="app.reopenTicket('${t.clientId}', '${t.id}')">
        ${getIconSvg('RefreshCw', 13)} Re-open
      </button>
    `;
    menuItems = dashItem;
  } else if (status === 'in_progress') {
    primary = `
      <button type="button" class="btn-saas-primary" onclick="app.resolveTicket('${t.clientId}', '${t.id}')">
        ${getIconSvg('Check', 13)} Resolve
      </button>
    `;
    menuItems = dashItem;
  } else {
    primary = `
      <button type="button" class="btn-saas-primary" onclick="app.markTicketInProgress('${t.clientId}', '${t.id}')">
        ${getIconSvg('ArrowRight', 13)} Start triage
      </button>
    `;
    menuItems = `
      <button type="button" class="sd-menu-item" role="menuitem" onclick="closeSupportTicketMenus(); app.resolveTicket('${t.clientId}', '${t.id}')">
        ${getIconSvg('Check', 13)} Resolve now
      </button>
      ${dashItem}
    `;
  }

  return `
    <div class="sd-actions">
      ${primary}
      <div class="sd-menu-wrap">
        <button
          type="button"
          class="sd-menu-trigger"
          aria-label="More ticket actions"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="${menuId}"
          onclick="toggleSupportTicketMenu('${menuId}', event)"
        >
          <i data-lucide="ellipsis"></i>
        </button>
        <div id="${menuId}" class="sd-menu" role="menu" hidden onclick="event.stopPropagation()">
          ${menuItems}
        </div>
      </div>
    </div>
  `;
}

function renderSupportDeskFilters({ filter, counts, onSelect }) {
  const items = [
    { key: 'all', label: 'All', count: counts.all },
    { key: 'open', label: 'Open', count: counts.open },
    { key: 'in_progress', label: 'In Progress', count: counts.in_progress },
    { key: 'resolved', label: 'Resolved', count: counts.resolved }
  ];
  return `
    <div class="support-desk-filters" role="tablist" aria-label="Ticket status filter">
      ${items.map(item => `
        <button
          type="button"
          class="support-desk-filter ${filter === item.key ? 'active' : ''}"
          onclick="${onSelect}('${item.key}')"
        >${item.label} ${item.count}</button>
      `).join('')}
    </div>
  `;
}

function renderSupportDeskTable({ columns, rowsHtml, emptyTitle, emptyCopy, colSpan, colClasses = [] }) {

const CATALOG_STAGE_STYLES = {
  decide: {
    gradient: 'linear-gradient(135deg, #0284C7 0%, #06B6D4 50%, #10B981 100%)',
    bloom: 'rgba(6, 182, 212, 0.35)',
    tag: 'decide'
  },
  execute: {
    gradient: 'linear-gradient(135deg, #0D9488 0%, #10B981 45%, #6366F1 100%)',
    bloom: 'rgba(139, 92, 246, 0.35)',
    tag: 'execute'
  },
  measure: {
    gradient: 'linear-gradient(135deg, #F59E0B 0%, #D97706 45%, #EF4444 100%)',
    bloom: 'rgba(245, 158, 11, 0.35)',
    tag: 'measure'
  },
  assess: {
    gradient: 'linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%)',
    bloom: 'rgba(139, 92, 246, 0.35)',
    tag: 'assess'
  },
  operate: {
    gradient: 'linear-gradient(135deg, #3B82F6 0%, #6366F1 50%, #8B5CF6 100%)',
    bloom: 'rgba(99, 102, 241, 0.35)',
    tag: 'operate'
  }
};

function getCatalogStageStyle(product) {
  const key = (product.stageClass || product.stage || 'operate').toLowerCase();
  return CATALOG_STAGE_STYLES[key] || CATALOG_STAGE_STYLES.operate;
}

function getProductDeploymentClients(productId) {
  return (app.clients || []).filter(c => (c.grantedProducts || []).includes(productId));
}

function renderCatalogSvcCard(product, options = {}) {
  const mode = options.mode || 'admin';
  const style = getCatalogStageStyle(product);
  const stageKey = style.tag || 'operate';
  const stageLabel = stageKey.charAt(0).toUpperCase() + stageKey.slice(1);
  const deploymentCount = options.deploymentCount ?? 0;
  const isGranted = !!options.isGranted;
  const isRequested = !!options.isRequested;
  const stateClass = isGranted ? ' is-granted' : (isRequested ? ' is-requested' : '');
  const creditLabel = product.creditType || 'Available on both plans';

  let footRight = '';
  let footLeft = `
    <button type="button" class="svc-link-wrap" onclick="event.stopPropagation(); openCatalogProductModal('${product.id}', '${mode}')">
      <span class="svc-learn-label">Learn more</span>
      <span class="svc-arrow-glyph" aria-hidden="true">→</span>
    </button>
  `;

  if (mode === 'admin') {
    footRight = `<span class="svc-meta-pill${deploymentCount > 0 ? ' is-ok' : ''}">${deploymentCount} account${deploymentCount === 1 ? '' : 's'}</span>`;
  } else if (isGranted) {
    footRight = `<span class="svc-meta-pill is-ok">In your path</span>`;
  } else if (isRequested) {
    footRight = `
      <button type="button" class="svc-plus-btn is-requested" title="Access requested" aria-label="Access requested for ${product.name}">
        ${getIconSvg('Check', 14)}
      </button>
    `;
  } else {
    footRight = `
      <button type="button" class="svc-plus-btn" title="Request access" aria-label="Request access to ${product.name}" onclick="event.stopPropagation(); requestEcosystemAccess('${product.id}')">
        ${getIconSvg('Plus', 14)}
      </button>
    `;
  }

  const statusTags = `
    <span class="svc-cat-tag ${stageKey}">${stageLabel}</span>
    ${mode === 'client' && isGranted ? '<span class="svc-status-pill live">Live</span>' : ''}
    ${mode === 'client' && isRequested && !isGranted ? '<span class="svc-status-pill beta">Requested</span>' : ''}
  `;

  return `
    <article
      class="svc-card${stateClass}"
      role="button"
      tabindex="0"
      onclick="openCatalogProductModal('${product.id}', '${mode}')"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openCatalogProductModal('${product.id}','${mode}')}"
    >
      <div class="svc-title-row">
        <div class="svc-mini-icon" style="background:${style.gradient};--icon-gradient:${style.gradient};--icon-bloom:${style.bloom};" aria-hidden="true">
          ${getIconSvg(product.icon || 'Layers', 18, '#fff')}
        </div>
        <div class="svc-card-copy">
          <div class="svc-card-name-row">
            <h3>${product.name}</h3>
            <div class="svc-card-name-tags">${statusTags}</div>
          </div>
          <p class="svc-card-credit">${creditLabel}</p>
        </div>
      </div>
      <p class="svc-desc">${product.description || product.role || ''}</p>
      <div class="svc-card-foot">
        ${footLeft}
        ${footRight}
      </div>
    </article>
  `;
}

function renderAdminProductsCatalogTab() {
  const currentStage = app.adminProductFilterStage || "all";
  const query = (app.adminProductSearchQuery || "").toLowerCase().trim();

  let products = PRODUCTS_CATALOG;
  if (currentStage !== "all") {
    products = products.filter(p => p.stage.toLowerCase() === currentStage.toLowerCase());
  }
  if (query) {
    products = products.filter(p =>
      p.name.toLowerCase().includes(query) ||
      p.role.toLowerCase().includes(query) ||
      p.description.toLowerCase().includes(query)
    );
  }

  // Count active deployments for each product
  const deploymentCounts = {};
  app.clients.forEach(c => {
    (c.grantedProducts || []).forEach(pid => {
      deploymentCounts[pid] = (deploymentCounts[pid] || 0) + 1;
    });
  });

  const operatorName = getBentoFirstName("Kyle");
  const stageCounts = ['decide','execute','measure','assess','operate'].reduce((acc, s) => {
    acc[s] = PRODUCTS_CATALOG.filter(p => p.stage.toLowerCase() === s).length;
    return acc;
  }, { all: PRODUCTS_CATALOG.length });

  return `
    <div class="bento-page">
      ${renderBentoGreeting({
        title: `Hey ${operatorName}, explore the software catalog`,
        subtitle: `${PRODUCTS_CATALOG.length} B2B solutions across Decide → Operate.`,
        primaryCta: `<div class="bento-search" style="width:220px"><i data-lucide="search" class="bento-search-icon"></i><input type="text" value="${app.adminProductSearchQuery || ""}" oninput="app.setAdminProductSearchQuery(this.value)" placeholder="Search products..." /></div>`
      })}

      ${renderBentoMetrics([
        { value: stageCounts.all, label: 'Catalog products', hint: 'Decide → Operate' },
        { value: Object.keys(stageCounts).filter(k => k !== 'all').length, label: 'Journey stages', hint: 'Full operating path' },
        { value: Object.values(deploymentCounts).reduce((a,b)=>a+b,0), label: 'Active deployments', hint: 'Assigned across portfolio', tone: 'ok' },
        { value: Object.values(deploymentCounts).filter(n => n > 0).length, label: 'Products in use', hint: 'At least one company' }
      ])}

      <div class="bento-surface">
        <div class="bento-chip-row">
          ${['all','decide','execute','measure','assess','operate'].map(stage => `
            <button type="button" class="bento-chip ${currentStage === stage ? 'active' : ''}" onclick="app.setAdminProductFilterStage('${stage}')">
              <span>${stage === 'all' ? 'All' : stage.charAt(0).toUpperCase() + stage.slice(1)}</span>
              <span class="bento-chip-count">${stageCounts[stage]}</span>
            </button>
          `).join('')}
        </div>
        <div class="service-cards-deck-grid" style="margin-top:14px">
          ${products.length ? products.map(p => renderCatalogSvcCard(p, {
            mode: 'admin',
            deploymentCount: deploymentCounts[p.id] || 0
          })).join('') : `
            <div class="catalog-empty">
              <p class="catalog-empty-title">No products match this filter</p>
              <p class="catalog-empty-copy">Try another stage or clear the search.</p>
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

function renderClientTeamTab(client) {
  const team = client.team || [];
  const grantedIds = client.grantedProducts || [];
  const grantedProducts = PRODUCTS_CATALOG.filter(p => grantedIds.includes(p.id));
  const serviceCount = grantedProducts.length;
  const roleFilter = app.teamRoleFilter || 'all';

  const initials = (name = '') => {
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return name.substring(0, 2).toUpperCase() || 'TM';
  };

  const roleLabel = (role) => (role === 'owner' ? 'Owner' : 'Member');
  const titleClean = (title = '') => title.replace(/\s*\(Owner\)\s*/i, '').trim();

  const owners = team.filter(m => m.role === 'owner').length;
  const members = team.filter(m => m.role !== 'owner').length;
  let grantCells = 0;
  let possibleCells = 0;
  team.forEach(m => {
    if (m.role === 'owner') {
      grantCells += serviceCount;
      possibleCells += serviceCount;
    } else {
      const allowed = m.allowedProducts || [];
      grantCells += grantedProducts.filter(p => allowed.includes(p.id)).length;
      possibleCells += serviceCount;
    }
  });
  const coveragePct = possibleCells ? Math.round((grantCells / possibleCells) * 100) : 0;

  const memberCoverage = (m) => {
    if (!serviceCount) return { n: 0, pct: 0, text: 'No services', cls: 'none' };
    if (m.role === 'owner') return { n: serviceCount, pct: 100, text: `Full · ${serviceCount}/${serviceCount}`, cls: 'full' };
    const allowed = m.allowedProducts || [];
    const n = grantedProducts.filter(p => allowed.includes(p.id)).length;
    const pct = Math.round((n / serviceCount) * 100);
    if (n === 0) return { n, pct, text: `None · 0/${serviceCount}`, cls: 'none' };
    if (n === serviceCount) return { n, pct, text: `Full · ${n}/${serviceCount}`, cls: 'full' };
    return { n, pct, text: `Limited · ${n}/${serviceCount}`, cls: '' };
  };

  const filteredTeam = team.filter(m => {
    if (roleFilter === 'owners') return m.role === 'owner';
    if (roleFilter === 'members') return m.role !== 'owner';
    return true;
  });

  const firstName = (client.ownerName || app.currentUser?.name || 'there').split(' ')[0];

  return `
    <div class="bento-page">
      ${renderBentoGreeting({
        title: `Hey ${firstName}, manage team & access`,
        subtitle: `Invite people and control which provisioned services each member can use at ${client.name}.`,
        primaryCta: `
          <button type="button" class="btn-saas-secondary" onclick="showToast('Permission audit exported for ${client.name}.', 'success')">Export</button>
          <button type="button" class="btn-saas-primary" onclick="openInviteTeamModal('${client.id}')">
            ${getIconSvg('Plus', 14)}
            <span>Invite member</span>
          </button>
        `
      })}

      ${renderBentoMetrics([
        { value: team.length, label: 'People', hint: 'Active team members' },
        { value: owners, label: 'Owners', hint: 'Full account access', tone: 'ok' },
        { value: members, label: 'Members', hint: 'Role-based access' },
        { value: coveragePct + '%', label: 'Permission coverage', hint: 'Provisioned seats', tone: coveragePct >= 70 ? 'ok' : '' }
      ])}

      <div class="team-access-surface">
        <div class="team-access-toolbar">
          <div>
            <h2 class="team-access-toolbar-title">Team roster</h2>
            <p class="team-access-toolbar-meta">${serviceCount} provisioned service${serviceCount === 1 ? '' : 's'} · tap chips to grant or revoke</p>
          </div>
          <div class="bento-chip-row" role="tablist" aria-label="Filter team by role" style="margin:0">
            ${[
              { key: 'all', label: 'All', count: team.length },
              { key: 'owners', label: 'Owners', count: owners },
              { key: 'members', label: 'Members', count: members }
            ].map(s => `
              <button type="button" class="bento-chip ${roleFilter === s.key ? 'active' : ''}" onclick="app.setTeamRoleFilter('${s.key}')">
                <span>${s.label}</span>
                <span class="bento-chip-count">${s.count}</span>
              </button>
            `).join('')}
          </div>
        </div>

        <div class="team-access-legend" aria-hidden="true">
          <span class="team-access-legend-item"><span class="team-access-dot on"></span> Granted</span>
          <span class="team-access-legend-item"><span class="team-access-dot"></span> No access</span>
          <span class="team-access-legend-item"><span class="team-access-dot lock"></span> Owner locked</span>
        </div>

        <div class="team-member-grid">
          ${filteredTeam.length === 0 ? `
            <div class="team-access-empty">
              <p class="team-access-empty-title">${team.length ? 'No people in this filter' : 'No team members yet'}</p>
              <p class="team-access-empty-copy">${team.length ? 'Try another role filter above.' : 'Invite a teammate to start assigning service access.'}</p>
              ${!team.length ? `<button type="button" class="btn-saas-primary" onclick="openInviteTeamModal('${client.id}')">Invite member</button>` : ''}
            </div>
          ` : filteredTeam.map(m => {
            const isOwner = m.role === 'owner';
            const allowed = m.allowedProducts || [];
            const cov = memberCoverage(m);
            return `
              <article class="team-member-card ${isOwner ? 'is-owner' : ''}">
                <div class="team-member-top">
                  <div class="team-member-identity">
                    <div class="team-member-avatar" aria-hidden="true">${initials(m.name)}</div>
                    <div style="min-width:0">
                      <h3 class="team-member-name">${m.name}</h3>
                      <p class="team-member-meta">${m.email}${titleClean(m.title) ? ' · ' + titleClean(m.title) : ''}</p>
                    </div>
                  </div>
                  <span class="team-member-role ${isOwner ? 'owner' : ''}">${roleLabel(m.role)}</span>
                </div>

                <div class="team-member-coverage">
                  <div class="team-member-coverage-row">
                    <span class="team-member-coverage-label">Service coverage</span>
                    <span class="team-member-coverage-value ${cov.cls}">${cov.text}</span>
                  </div>
                  <div class="team-member-bar" aria-hidden="true"><span style="width:${cov.pct}%"></span></div>
                </div>

                <div>
                  <p class="team-member-services-label">Services</p>
                  <div class="team-member-services">
                    ${serviceCount === 0 ? `
                      <span class="team-member-coverage-value none">No services provisioned yet</span>
                    ` : grantedProducts.map(p => {
                      if (isOwner) {
                        return `
                          <span class="team-service-chip locked" title="Owners always have full access to ${p.name}">
                            ${getIconSvg('Check', 12)}
                            <span>${p.name}</span>
                          </span>`;
                      }
                      const hasAccess = allowed.includes(p.id);
                      return `
                        <button
                          type="button"
                          class="team-service-chip ${hasAccess ? 'on' : ''}"
                          onclick="app.toggleMemberProduct('${client.id}', '${m.id}', '${p.id}')"
                          title="${hasAccess ? 'Revoke' : 'Grant'} ${p.name} for ${m.name}"
                          aria-pressed="${hasAccess ? 'true' : 'false'}"
                        >
                          ${hasAccess ? getIconSvg('Check', 12) : getIconSvg('Plus', 12)}
                          <span>${p.name}</span>
                        </button>`;
                    }).join('')}
                  </div>
                </div>
              </article>
            `;
          }).join('')}
        </div>

        <p class="team-access-note">Permissions apply only to services already provisioned for this company. Request more from York Ecosystem, then assign them here.</p>
      </div>
    </div>
  `;
}

function openSendInviteModal(clientId) {

  const isActive = client.status === 'active';
  const initials = (client.name || 'YY').substring(0, 2).toUpperCase();

    { key: 'measure', label: 'Measure' },
    { key: 'assess', label: 'Assess' },
    { key: 'operate', label: 'Operate' }
  ];

  const grouped = {};
  PRODUCTS_CATALOG.forEach(p => {
    const key = (p.stageClass || (p.stage || 'other').toLowerCase());
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(p);
  });
  const stageOrder = ['decide', 'execute', 'measure', 'assess', 'operate'];

    acc[s.key] = s.key === 'all'
      ? PRODUCTS_CATALOG.length
      : (grouped[s.key] || []).length;
    return acc;
  }, {});
  const progressPct = PRODUCTS_CATALOG.length

  const root = document.getElementById('modal-root');

  root.innerHTML = `

              <button type="button" class="svc-assign-preset" data-preset="core" onclick="setInvitePreset('core')">Core Growth</button>
