    const cadenceEl = document.getElementById('ini-detail-cadence');
    const catEl = document.getElementById('ini-detail-category');
    const qEl = document.getElementById('ini-detail-quarter');
    const yEl = document.getElementById('ini-detail-year');
    if (titleEl) ms.title = titleEl.value.trim() || ms.title;
    if (descEl) {
      ms.desc = descEl.value.trim();
      ms.description = ms.desc;
    }
    if (cadenceEl) ms.cadence = cadenceEl.value;
    if (catEl) ms.category = catEl.value;
    if (qEl) ms.dueQuarter = qEl.value;
    if (yEl) ms.dueYear = yEl.value;
    if (ms.dueQuarter && ms.dueYear) {
      const qMap = { Q1: 'Mar 31', Q2: 'Jun 30', Q3: 'Sep 30', Q4: 'Dec 31' };
      ms.targetDate = `${qMap[ms.dueQuarter] || 'Dec 31'}, ${ms.dueYear}`;

  // Phase 2: Milestone Approval Pipeline Functions
  advanceMilestone(clientId, milestoneId, targetStage) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client || !client.milestones) return;

    const ms = client.milestones.find(m => m.id === milestoneId);
    if (ms) {
      ms.stage = targetStage;
      this.saveState();
      render();
    }
  }

  approveMilestone(clientId, milestoneId) {
    let cId = clientId;
    let mId = milestoneId;
    if (!mId) {
      mId = cId;
      cId = this.getCurrentClient()?.id || this.clients[0]?.id;
    }
    const client = this.clients.find(c => c.id === cId);
    if (!client || !client.milestones) return;

    const ms = client.milestones.find(m => m.id === mId);
    if (ms) {
      ms.stage = 'approved';
      ms.approvedAt = 'Just now';

      // Automatically approve associated deliverable if any!
      if (ms.deliverableLinked && client.deliverables) {
        const deliv = client.deliverables.find(d => d.title.includes(ms.deliverableLinked) || ms.deliverableLinked.includes(d.title));
        if (deliv) deliv.status = 'approved';
      }

      this.saveState();
      render();
      if (typeof showToast === 'function') {
        showToast(`Milestone signed off: "${ms.title}" marked as Approved ✓`, 'success', 4000);
      }
    }
  }

  // Phase 2: Bi-Directional HubSpot Sync
  pushTelemetryToHubspot(clientId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    client.hubspotSync.lastPushedAt = `Today at ${timeStr}`;
    client.hubspotSync.pushedProperties = {
      york_health_score: `${client.healthTelemetry?.score || 90} / 100`,
      york_active_products: client.grantedProducts.map(p => p.toUpperCase()).join(', '),
      york_burn_velocity: client.healthTelemetry?.burnVelocity || '350 credits/wk',
      york_credit_runway: client.healthTelemetry?.runwayWeeks || '20 weeks',
      york_milestones_completed: `${(client.milestones || []).filter(m => m.stage === 'approved').length} of ${(client.milestones || []).length}`
    };

    this.saveState();
    render();
  }

  createHubspotExpansionDeal(clientId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client || !client.healthTelemetry?.expansionOpportunity) return;

    const exp = client.healthTelemetry.expansionOpportunity;

  inviteTeamMember(clientId, { name, email, title, allowedProducts }) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;
    if (!client.team) client.team = [];

    const newMemberId = 'user-' + (email.split('@')[0] || Date.now()).toLowerCase().replace(/[^a-z0-9]/g, '');
    const member = {
      id: newMemberId,
      name,
      email,
      role: 'member',
      title: title || 'Team Member',
      allowedProducts: [...(allowedProducts || [])]
    };

    client.team.push(member);
    this.clientSelectedTeamMemberId = null;
    this.teamAccessEdit = null;
    this.saveState();
    return member;
  }

  startTeamAccessEdit(clientId, memberId) {
    openManageTeamAccessModal(clientId, memberId);
  }

  _teamAccessEditIsDirty() {
    const edit = this.teamAccessEdit;
    if (!edit) return false;
    const a = [...(edit.baseline || [])].sort().join(',');
    const b = [...(edit.draft || [])].sort().join(',');
    return a !== b;
  }

  cancelTeamAccessEdit() {
    if (this._teamAccessEditIsDirty() && !window.confirm('Discard unsaved access changes?')) return;
    this.teamAccessEdit = null;
    this.clientSelectedTeamMemberId = null;
    closeModal();
    render();
  }

  toggleTeamAccessDraft(productId) {
    const edit = this.teamAccessEdit;
    if (!edit) return;
    const client = this.clients.find(c => c.id === edit.clientId);
    if (!(client?.grantedProducts || []).includes(productId)) return;
    const set = new Set(edit.draft || []);
    if (set.has(productId)) set.delete(productId);
    else set.add(productId);
    edit.draft = [...set];
    openManageTeamAccessModal(edit.clientId, edit.memberId);
  }

  saveTeamAccessEdit() {
    const edit = this.teamAccessEdit;
    if (!edit) return;
    const client = this.clients.find(c => c.id === edit.clientId);
    const member = client?.team?.find(m => m.id === edit.memberId);
    if (!member || member.role === 'owner') {
      this.teamAccessEdit = null;
      this.clientSelectedTeamMemberId = null;
      this.saveState();
      closeModal();
      render();
      return;
    }

    const provisioned = new Set(client.grantedProducts || []);
    const next = (edit.draft || []).filter(id => provisioned.has(id));
    const prev = new Set(member.allowedProducts || []);
    const added = next.filter(id => !prev.has(id));
    const removed = [...prev].filter(id => !next.includes(id));

    if (!added.length && !removed.length) {
      this.teamAccessEdit = null;
      this.clientSelectedTeamMemberId = null;
      this.saveState();
      closeModal();
      render();
      showToast('No access changes to save.', 'info');
      return;
    }

    if (removed.length) {
      const names = removed.map(id => PRODUCTS_CATALOG.find(p => p.id === id)?.name || id).join(', ');
      const ok = window.confirm(`Revoke access to ${names} for ${member.name}? They will lose those services immediately.`);
      if (!ok) return;
    }

    member.allowedProducts = next;
    this.teamAccessEdit = null;
    this.clientSelectedTeamMemberId = null;
    this.saveState();
    closeModal();
    render();

    const bits = [];
    if (added.length) bits.push(`granted ${added.length}`);
    if (removed.length) bits.push(`revoked ${removed.length}`);
    showToast(`Updated access for ${member.name}: ${bits.join(', ')}.`, 'success');
  }

  requestMemberAccess(clientId, memberId, productId, note) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const member = client.team.find(m => m.id === memberId);
    const prod = PRODUCTS_CATALOG.find(p => p.id === productId);

    const req = {
      id: 'mreq-' + Date.now(),
      memberId,
      memberName: member?.name || 'Team Member',
      productId,
      productName: prod?.name || productId,
      requestedAt: 'Just now',
      note: note || 'Requesting access to collaborate with the team.',
      status: 'pending'
    };

    client.memberRequests.unshift(req);
    this.saveState();
    return req;
  }

  approveMemberRequest(clientId, requestId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const req = client.memberRequests.find(r => r.id === requestId);
    if (!req) return;

    req.status = 'approved';
    const member = client.team.find(m => m.id === req.memberId);
    if (member && !member.allowedProducts.includes(req.productId)) {
      member.allowedProducts.push(req.productId);
    }
    this.saveState();
    render();
  }

  declineMemberRequest(clientId, requestId) {
    const client = this.clients.find(c => c.id === clientId);
    if (!client) return;

    const req = client.memberRequests.find(r => r.id === requestId);
    if (req) req.status = 'declined';
    this.saveState();
    render();
  }
}

function renderNotificationsPanel() {
  const items = window.YorkNotifications || [];
  const unread = items.filter(n => !n.read).length;
  const list = items.length ? items.map(n => `
    <div class="notif-item${n.read ? '' : ' is-unread'}" data-notif-id="${n.id}">
      <div class="notif-icon is-${n.tone || 'info'}" aria-hidden="true">
        <i data-lucide="${n.icon || 'bell'}"></i>
      </div>
      <div class="notif-body">
        <div class="notif-item-title">${n.title}</div>
        <div class="notif-item-desc">${n.desc}</div>
        <div class="notif-item-time">${n.time}</div>
      </div>
    </div>
  `).join('') : `<div class="notif-empty">You're all caught up.</div>`;

  return `
    <div class="notif-panel" id="notif-panel" role="menu" aria-label="Notifications" hidden>
      <div class="notif-panel-head">
        <div>
          <div class="notif-panel-title">Notifications</div>
          <div class="notif-panel-meta">${unread ? `${unread} unread` : 'All caught up'}</div>
        </div>
        ${unread ? `<button type="button" class="notif-mark-read" onclick="markAllNotificationsRead(event)">Mark all read</button>` : ''}
      </div>
      <div class="notif-list">${list}</div>
      <div class="notif-panel-foot">
        <button type="button" onclick="closeNotifications()">Close</button>
      </div>
    </div>
  `;
}

function positionNotificationsPanel(panel, btn) {
  if (!panel || !btn) return;
  const rect = btn.getBoundingClientRect();
  const width = Math.min(360, window.innerWidth - 24);
  let left = rect.right - width;
  if (left < 12) left = 12;
  if (left + width > window.innerWidth - 12) left = Math.max(12, window.innerWidth - width - 12);
  const top = Math.min(rect.bottom + 10, window.innerHeight - 80);
  panel.style.top = `${Math.max(12, top)}px`;
  panel.style.left = `${left}px`;
  panel.style.right = 'auto';
  panel.style.width = `${width}px`;
}

function syncNotificationBell() {
  const unread = (window.YorkNotifications || []).filter(n => !n.read).length;
  const dot = document.getElementById('notif-bell-dot');
  if (dot) dot.classList.toggle('is-hidden', !unread);
  const btn = document.getElementById('notif-bell-btn');
  const panel = document.getElementById('notif-panel');
  if (btn) btn.setAttribute('aria-expanded', String(!!(panel && !panel.hidden)));
}

function toggleNotifications(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  const panel = document.getElementById('notif-panel');
  const btn = document.getElementById('notif-bell-btn');
  if (!panel) return;
  const willOpen = panel.hasAttribute('hidden') || panel.hidden;
  if (willOpen) {
    panel.hidden = false;
    panel.removeAttribute('hidden');
    positionNotificationsPanel(panel, btn);
    if (btn) btn.setAttribute('aria-expanded', 'true');
    if (typeof refreshLucideIcons === 'function') {
      requestAnimationFrame(() => refreshLucideIcons());
    }
  } else {
    closeNotifications();
  }
}

function closeNotifications() {
  const panel = document.getElementById('notif-panel');
  if (panel) {
    panel.hidden = true;
    panel.setAttribute('hidden', '');
  }
  const btn = document.getElementById('notif-bell-btn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

function markAllNotificationsRead(e) {
  if (e) e.stopPropagation();
  (window.YorkNotifications || []).forEach(n => { n.read = true; });
  const wrap = document.getElementById('notif-wrap');
  const btn = document.getElementById('notif-bell-btn');
  const wasOpen = !!(document.getElementById('notif-panel') && !document.getElementById('notif-panel').hidden);
  if (wrap) {
    wrap.innerHTML = `
      <button class="topbar-action-btn" onclick="toggleNotifications(event)" type="button" aria-label="Notifications" title="Notifications" aria-expanded="${wasOpen}" aria-controls="notif-panel" id="notif-bell-btn">
        <i data-lucide="bell"></i>
        <span class="topbar-bell-dot is-hidden" id="notif-bell-dot"></span>
      </button>
      ${renderNotificationsPanel()}
    `;
    const panel = document.getElementById('notif-panel');
    const nextBtn = document.getElementById('notif-bell-btn');
    if (panel && wasOpen) {
      panel.hidden = false;
      panel.removeAttribute('hidden');
      positionNotificationsPanel(panel, nextBtn);
    }
    if (typeof refreshLucideIcons === 'function') requestAnimationFrame(() => refreshLucideIcons());
  }
  syncNotificationBell();
}

function closeToolbarFilterMenus(exceptId) {
  document.querySelectorAll('[data-toolbar-filter]').forEach(wrap => {
    const id = (wrap.id || '').replace(/-wrap$/, '');
    if (exceptId && id === exceptId) return;
    wrap.classList.remove('is-open');
    const menu = document.getElementById(`${id}-menu`);
    const btn = document.getElementById(`${id}-btn`);
    if (menu) menu.hidden = true;
    if (btn) btn.setAttribute('aria-expanded', 'false');
  });
}

function toggleToolbarFilterMenu(event, id) {
  if (event) event.stopPropagation();

  const menu = document.getElementById(`${id}-menu`);
  const btn = document.getElementById(`${id}-btn`);

    menu.hidden = false;
    btn.setAttribute('aria-expanded', 'true');

function showToast(message, type = 'success', duration = 3500) {
  if (typeof document === 'undefined') return null;

  const normalized = ['success', 'error', 'warning', 'info', 'loading'].includes(type) ? type : 'success';
  const isLoading = normalized === 'loading';
  const ttl = isLoading ? 0 : (typeof duration === 'number' ? duration : 3500);

  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = `york-toast is-${normalized}`;
  toast.setAttribute('role', isLoading ? 'status' : 'alert');
  toast.innerHTML = `
    <div class="york-toast-icon${isLoading ? ' is-spin' : ''}" aria-hidden="true">${TOAST_ICONS[normalized]}</div>
    <div class="york-toast-body">${message}</div>
    <button type="button" class="york-toast-close" aria-label="Dismiss">${TOAST_ICONS.close}</button>
    <div class="york-toast-progress" aria-hidden="true"><span style="${ttl ? `animation-duration:${ttl}ms` : ''}"></span></div>
  `;

  const closeBtn = toast.querySelector('.york-toast-close');
  if (closeBtn) closeBtn.addEventListener('click', () => dismissToast(toast));

  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('is-in'));

  if (ttl > 0) {
    const timer = setTimeout(() => dismissToast(toast), ttl);
    toast._toastTimer = timer;
  }

  return toast;
}

function updateToast(toastEl, message, type) {
  if (!toastEl) return null;
  if (typeof message === 'string') {
    const body = toastEl.querySelector('.york-toast-body');
    if (body) body.innerHTML = message;
  }
  if (type && ['success', 'error', 'warning', 'info', 'loading'].includes(type)) {
    toastEl.className = `york-toast is-in is-${type}`;
    const icon = toastEl.querySelector('.york-toast-icon');
    if (icon) {
      icon.className = `york-toast-icon${type === 'loading' ? ' is-spin' : ''}`;
      icon.innerHTML = TOAST_ICONS[type];
    }
    if (type !== 'loading' && !toastEl._toastTimer) {
      const timer = setTimeout(() => dismissToast(toastEl), 3200);
      toastEl._toastTimer = timer;
      const bar = toastEl.querySelector('.york-toast-progress > span');
      if (bar) bar.style.animationDuration = '3200ms';
    }
  }
  return toastEl;
}

// Ensure smooth non-blocking toasts across the entire app
if (typeof window !== 'undefined') {
  window.showToast = showToast;
  window.dismissToast = dismissToast;
  window.updateToast = updateToast;
  window.alert = function(msg) {
    showToast(msg, 'info');
  };
}

  start(manual = true) {

    this.role = role;

    // Expand sidebar so labels are visible during the tour
    const sidebar = document.getElementById('permanentSidebar');
    if (sidebar && sidebar.classList.contains('collapsed')) {
      sidebar.classList.remove('collapsed');
      try { localStorage.setItem('york_sidebar_collapsed', 'false'); } catch (e) {}

    if (app.copilotOpen) {
      app.copilotOpen = false;
      renderGlobalWidgets();
    }
    document.querySelectorAll('.modal-overlay, .deck-modal, .cmdk-backdrop.open, .sd-menu:not([hidden])').forEach((node) => {
      if (node.classList.contains('cmdk-backdrop')) node.classList.remove('open');
      else if (node.classList.contains('sd-menu')) node.setAttribute('hidden', '');
      else node.remove();
    });
    const modalRoot = document.getElementById('modal-root');
    const deckRoot = document.getElementById('deck-modal-root');
    if (modalRoot) modalRoot.innerHTML = '';
    if (deckRoot) deckRoot.innerHTML = '';

    // Keep tour root last in body so it wins stacking against any app portal
    const tourRoot = document.getElementById('tour-root');
    if (tourRoot && tourRoot.parentElement === document.body) {
      document.body.appendChild(tourRoot);
    }

    document.body.classList.add('tour-active');
    this.bind();
    this.go(0, { fromStart: true, manual });
  },

  stop(markDone = true) {
    this.unbind();
    this.clearLiveTarget();
    const root = document.getElementById('tour-root');
    if (root) {
      root.classList.remove('is-active');
      root.innerHTML = '';
    }
    document.body.classList.remove('tour-active');
    if (markDone && this.role) {
      try { localStorage.setItem(this.storageKey(this.role), '1'); } catch (e) {}
    }
    this.active = false;
    this.role = null;
    this.index = 0;
    this.steps = [];
  },

  bind() {
    this.unbind();
    this._resizeBound = () => this.refresh();
    this._keyBound = (e) => {
      if (!this.active) return;
      if (e.key === 'Escape') this.stop(true);
      if (e.key === 'ArrowRight' || e.key === 'Enter') this.next();
      if (e.key === 'ArrowLeft') this.prev();
    };
    window.addEventListener('resize', this._resizeBound);
    window.addEventListener('keydown', this._keyBound);
  },

  unbind() {
    if (this._resizeBound) window.removeEventListener('resize', this._resizeBound);
    if (this._keyBound) window.removeEventListener('keydown', this._keyBound);
    this._resizeBound = null;
    this._keyBound = null;
  },

  clearLiveTarget() {
    document.querySelectorAll('.tour-target-live').forEach(el => el.classList.remove('tour-target-live'));
  },

  async ensureTab(step) {
    if (!step || !step.tab) return false;
    let changed = false;
    if (this.role === 'admin' && app.adminTab !== step.tab) {
      app.adminTab = step.tab;
      changed = true;
    }
    if (this.role === 'client' && app.clientTab !== step.tab) {
      app.clientTab = step.tab;
      changed = true;
    }
    if (changed) {
      app.saveState();
      render();
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    }
    return changed;
  },

  async go(index, opts = {}) {
    if (!this.active) return;
    if (index < 0 || index >= this.steps.length) {
      this.stop(true);
      if (!opts.fromStart) showToast('Tour complete. Reopen anytime from Tour.', 'success');
      return;
    }
    this.index = index;
    const step = this.steps[index];
    await this.ensureTab(step);
    this.renderStep(step);
  },

  refresh() {
    if (!this.active || !this.steps[this.index]) return;
    this.renderStep(this.steps[this.index]);
  },

  next() { this.go(this.index + 1); },
  prev() { this.go(Math.max(0, this.index - 1)); },

  renderStep(step) {
    const root = document.getElementById('tour-root');
    if (!root) return;
    this.clearLiveTarget();

    let el = document.querySelector(`[data-tour="${step.target}"]`);
    if (!el) {
      // Fallback: skip missing targets forward
      if (this.index < this.steps.length - 1) {
        this.go(this.index + 1);
        return;
      }
      this.stop(true);
      return;
    }

    el.classList.add('tour-target-live');
    try { el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' }); } catch (e) {}

    const rect = el.getBoundingClientRect();
    const pad = 8;
    const spot = {
      top: Math.max(8, rect.top - pad),
      left: Math.max(8, rect.left - pad),
      width: Math.min(window.innerWidth - 16, rect.width + pad * 2),
      height: Math.min(window.innerHeight - 16, rect.height + pad * 2)
    };

    const isLast = this.index === this.steps.length - 1;
    const roleLabel = this.role === 'admin' ? 'Admin tour' : 'Client tour';
    const progressPct = Math.round(((this.index + 1) / this.steps.length) * 100);

    root.classList.add('is-active');
    root.innerHTML = `
      <div class="tour-scrim" onclick="YorkTour.stop(true)"></div>
      <div class="tour-spotlight" style="top:${spot.top}px;left:${spot.left}px;width:${spot.width}px;height:${spot.height}px;"></div>
      <div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-card-title" aria-describedby="tour-card-body">
        <div class="tour-card-accent" aria-hidden="true"></div>
        <div class="tour-card-inner">
          <div class="tour-card-kicker">
            <span class="tour-card-role"><span class="tour-role-dot"></span><span>${roleLabel}</span></span>
            <div style="display:inline-flex;align-items:center;gap:8px">
              <span class="tour-card-progress">Step ${this.index + 1} of ${this.steps.length}</span>
              <button type="button" class="tour-card-close" onclick="YorkTour.stop(true)" aria-label="Close tour" title="Close tour (Esc)">
                ${getIconSvg('X', 14)}
              </button>
            </div>
          </div>
          <h3 class="tour-card-title" id="tour-card-title">${step.title}</h3>
          <p class="tour-card-body" id="tour-card-body">${step.body}</p>
          <div class="tour-progress-track" aria-hidden="true">
            <div class="tour-progress-fill" style="width:${progressPct}%"></div>
          </div>
          <div class="tour-card-actions">
            <button type="button" class="tour-btn tour-btn-ghost" onclick="YorkTour.stop(true)">Skip tour</button>
            <div class="tour-card-nav">
              <button type="button" class="tour-btn" onclick="YorkTour.prev()" ${this.index === 0 ? 'disabled' : ''}>Back</button>
              <button type="button" class="tour-btn tour-btn-primary" onclick="YorkTour.${isLast ? 'finish' : 'next'}()">${isLast ? 'Finish ✓' : 'Next →'}</button>
            </div>
          </div>
        </div>
      </div>
    `;

    refreshLucideIcons();
    this.positionCard(spot);
  },

  positionCard(spot) {
    const card = document.querySelector('.tour-card');
    if (!card) return;
    const gap = 18;
    const margin = 16;
    const cardRect = card.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    let top = spot.top + spot.height + gap;
    let left = spot.left;

    // Prefer right side for tall/wide sidebar targets so the card stays out of the hole
    const isSidebarish = spot.width > vw * 0.28 && spot.left < 120;
    if (isSidebarish) {
      left = Math.min(vw - cardRect.width - margin, spot.left + spot.width + gap);
      top = Math.max(margin, Math.min(spot.top + 8, vh - cardRect.height - margin));
    } else {
      if (top + cardRect.height > vh - margin) {
        top = spot.top - cardRect.height - gap;
      }
      if (top < margin) top = margin;
      if (left + cardRect.width > vw - margin) {
        left = vw - cardRect.width - margin;
      }
      if (left < margin) left = margin;

      // If still overlapping the spotlight vertically, prefer right/left of the target
      const overlapsY = top < spot.top + spot.height && top + cardRect.height > spot.top;
      const overlapsX = left < spot.left + spot.width && left + cardRect.width > spot.left;
      if (overlapsY && overlapsX) {
        const rightLeft = spot.left + spot.width + gap;
        const leftLeft = spot.left - cardRect.width - gap;
        if (rightLeft + cardRect.width <= vw - margin) left = rightLeft;
        else if (leftLeft >= margin) left = leftLeft;
        top = Math.max(margin, Math.min(spot.top, vh - cardRect.height - margin));
      }
    }

    card.style.top = `${Math.round(top)}px`;
    card.style.left = `${Math.round(left)}px`;
  },

  finish() {
    this.stop(true);
    showToast('Tour complete. Reopen anytime from Tour in the top bar.', 'success');
  }
};

function refreshLucideIcons() {
  const run = () => {
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
      return true;
    }
    return false;
  };
  if (run()) return;
  // Lucide CDN may still be loading on first paint — retry briefly
  let tries = 0;
  const timer = setInterval(() => {
    tries += 1;
    if (run() || tries >= 20) clearInterval(timer);
  }, 50);
}

function render() {
  const root = document.getElementById('app-root');
  if (!root) return;
  const tourWasActive = !!(window.YorkTour && YorkTour.active);

  if (!app.currentUser) {
    if (tourWasActive) YorkTour.stop(false);
    root.innerHTML = renderLoginScreen();
    renderGlobalWidgets();
    requestAnimationFrame(() => refreshLucideIcons());
    return;
  }

  if (app.currentUser.role === 'admin') {
    root.innerHTML = renderAdminConsole();
  } else {
    root.innerHTML = renderClientDashboard();
  }

  renderGlobalWidgets();
  // Ensure catalog/ecosystem icons paint on first load and after tab switches
  requestAnimationFrame(() => {
    refreshLucideIcons();
    applyYorkClickFxAfterRender();
    requestAnimationFrame(() => refreshLucideIcons());
  });

  if (tourWasActive) {
    requestAnimationFrame(() => YorkTour.refresh());
  } else {
    YorkTour.maybeAutoStart();
  }
}

                  <div class="copilot-msg-meta">${m.timestamp || ''}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="copilot-composer">
          <form onsubmit="handleCopilotInputSubmit(event)" class="copilot-composer-form">
            <input
              type="text"
              id="copilot-input"

            />
            <button type="submit" class="copilot-send" aria-label="Send message">

          </div>
        </div>
      </aside>
  `;
}

function handleCopilotInputSubmit(e) {
  e.preventDefault();
  const input = document.getElementById('copilot-input');
  if (!input || !input.value.trim()) return;
  const val = input.value;
  input.value = '';
  app.sendCopilotMessage(val);
}

function inferMetricIcon(label = '', tone = '') {
  const l = String(label).toLowerCase();
  if (/workspace|provisioned workspace/.test(l)) return 'Layers';
  if (/health/.test(l)) return 'Activity';
  if (/stage|journey/.test(l)) return 'Gauge';
  if (/session|live/.test(l)) return 'Zap';
  if (/initiative|deliverable/.test(l)) return 'ClipboardCheck';
  if (/sign-?off|awaiting/.test(l)) return 'FileBadge';
  if (/delivery|executing|in progress|triage/.test(l)) return 'Rocket';
  if (/signed|completed|resolved|approved/.test(l)) return 'CheckCircle2';
  if (/owner/.test(l)) return 'ShieldCheck';
  if (/people|team|member|client/.test(l)) return 'Users';
  if (/permission|coverage/.test(l)) return 'Lock';
  if (/catalog|ecosystem|product|service/.test(l)) return 'Layers';
  if (/path|provisioned|in use/.test(l)) return 'CheckCircle2';
  if (/request/.test(l)) return 'Send';
  if (/deploy/.test(l)) return 'Server';
  if (/portfolio|compan|total portfolio/.test(l)) return 'Building';
  if (/onboard|invite|ready/.test(l)) return 'Mail';
  if (/support|queue|incident|ticket|open queue/.test(l)) return 'LifeBuoy';
  if (/severity|urgent|high/.test(l)) return 'ShieldAlert';
  if (/sla|target/.test(l)) return 'Clock';
  if (/token/.test(l)) return 'Zap';
  if (/sow|active sow|active account/.test(l)) return 'FileText';
  if (tone === 'ok') return 'CheckCircle2';
  if (tone === 'warn') return 'ShieldAlert';
  return 'BarChart3';
}

function inferMetricTone(label = '', tone = '') {
  // KPI icons stay brand-emerald by default. Only warn when attention is needed.
  if (tone === 'warn') return 'warn';
  if (tone && tone !== 'warn') return '';
  const l = String(label).toLowerCase();
  if (/severity|urgent|awaiting|sign-?off|open queue|support queue|blocker|pending request/.test(l)) return 'warn';
  return '';
}

function renderDeckCard(m = {}) {
  const tone = inferMetricTone(m.label, m.tone);
  const icon = m.icon || inferMetricIcon(m.label, tone);
  const toneClass = tone === 'warn' ? ' is-warn' : '';
  const caption = m.captionHtml
    ? `<div class="deck-card-caption">${m.captionHtml}</div>`
    : (m.hint ? `<div class="deck-card-caption"><span>${m.hint}</span></div>` : '');
  return `
    <div class="deck-card${toneClass}">
      <div class="deck-card-top">
        <span class="deck-card-label">${m.label || ''}</span>
        <div class="deck-card-icon${toneClass}" aria-hidden="true">${getIconSvg(icon, 15)}</div>
      </div>
      <div>
        <div class="deck-card-value">${m.value ?? ''}</div>
        ${caption}
      </div>
    </div>
  `;
}

function renderBentoMetrics(items = [], options = {}) {
  if (!items.length) return '';
  const count = Math.min(items.length, 5);
  const style = options.style ? ` style="${options.style}"` : ' style="margin-bottom: 24px;"';
  return `
    <section class="metrics-card-deck" data-count="${count}" role="group" aria-label="Key metrics"${style}>
      ${items.slice(0, 5).map(m => renderDeckCard(m)).join('')}

}

function getCompanyDirectoryCandidates() {
  const existingDomains = new Set((app.clients || []).map(c => String(c.domain || '').toLowerCase()));
  const existingNames = new Set((app.clients || []).map(c => String(c.name || '').toLowerCase()));
  const fromDeals = (app.hubspotDeals || []).map(d => ({
    id: d.id,
    name: d.companyName,
    domain: d.domain,
    ownerName: d.contactName,
    ownerEmail: d.contactEmail,
    source: 'HubSpot',
    meta: d.stage || 'Closed Won'
  }));
  const extras = (typeof COMPANY_DIRECTORY_EXTRAS !== 'undefined' ? COMPANY_DIRECTORY_EXTRAS : []).map(c => ({ ...c }));
  return [...fromDeals, ...extras].filter(c => {
    const domain = String(c.domain || '').toLowerCase();
    const name = String(c.name || '').toLowerCase();
    if (!name) return false;
    if (domain && existingDomains.has(domain)) return false;
    if (existingNames.has(name)) return false;
    return true;
  });
}

function renderAdminAddCompaniesModule() {
  const q = (app.companyAddQuery || '').toLowerCase().trim();
  const letter = (app.companyAddLetter || 'all').toLowerCase();
  const selected = new Set(app.companyAddSelected || []);
  const strategists = app.companyAddStrategists || {};
  let allCandidates = getCompanyDirectoryCandidates().slice().sort((a, b) =>
    String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' })
  );

  const letterCounts = {};
  for (let i = 0; i < 26; i++) letterCounts[String.fromCharCode(97 + i)] = 0;
  allCandidates.forEach(c => {
    const ch = String(c.name || '').trim().charAt(0).toLowerCase();
    if (ch >= 'a' && ch <= 'z') letterCounts[ch] += 1;
  });

  let candidates = allCandidates;
  if (letter && letter !== 'all') {
    candidates = candidates.filter(c => String(c.name || '').trim().charAt(0).toLowerCase() === letter);
  }
  if (q) {
    candidates = candidates.filter(c =>
      (c.name || '').toLowerCase().includes(q) ||
      (c.domain || '').toLowerCase().includes(q) ||
      (c.ownerName || '').toLowerCase().includes(q) ||
      (c.ownerEmail || '').toLowerCase().includes(q) ||
      (c.source || '').toLowerCase().includes(q)
    );
  }

  const azChips = `
    <div class="aa-az-filter" role="group" aria-label="Filter companies A to Z">
      <button type="button" class="aa-az-chip ${letter === 'all' ? 'active' : ''}" onclick="app.setCompanyAddLetter('all')">All</button>
      ${Array.from({ length: 26 }, (_, i) => {
        const L = String.fromCharCode(65 + i);
        const key = L.toLowerCase();
        const count = letterCounts[key] || 0;
        return `<button type="button" class="aa-az-chip ${letter === key ? 'active' : ''}" ${count ? '' : 'disabled'} onclick="app.setCompanyAddLetter('${key}')" title="${count} companies">${L}</button>`;
      }).join('')}

  const selectedCount = selected.size;
  const tableBody = candidates.length === 0

        </td>
      </tr>

    : candidates.map(c => {
        const on = selected.has(c.id);
        const strategist = strategists[c.id] || '';
        return `

            <td>

                ${renderCompanyDummyLogo(c.name, 'sm', c.domain)}
                <div class="sd-company-copy">
                  <div class="sd-company">${c.name}</div>
                  <span class="sd-email">${c.domain || 'No domain'}${c.meta ? ` · ${c.meta}` : ''}</span>

function ticketStatusLabel(status) {
  if (status === 'resolved') return 'Resolved';
  if (status === 'in_progress') return 'In Progress';
  return 'Open';
}

function ticketStatusClass(status) {
  if (status === 'resolved') return 'resolved';
  if (status === 'in_progress') return 'in_progress';
  return 'open';
}

function ticketCode(id) {
  return `#${String(id || 'tkt-101')}`;
}

function filterTicketCollection(tickets, filter, query, fields = []) {
  let filtered = tickets;
  if (filter && filter !== 'all') filtered = filtered.filter(t => t.status === filter);
  const q = (query || '').toLowerCase().trim();
  if (!q) return filtered;
  return filtered.filter(t => fields.some(key => String(t[key] || '').toLowerCase().includes(q)));
}

function renderSupportPlatformOptions(ticket) {
  const granted = ticket.grantedProducts || [];
  let options = PRODUCTS_CATALOG.filter(p => granted.includes(p.id));
  if (!options.length) options = PRODUCTS_CATALOG.slice(0, 8);
  if (ticket.product && !options.some(p => p.id === ticket.product)) {
    const current = PRODUCTS_CATALOG.find(p => p.id === ticket.product);
    if (current) options = [current, ...options];
  }
  return options.map(p => {
    const stage = (p.stageClass || p.stage || '').toString().toUpperCase();
    const selected = p.id === ticket.product ? ' selected' : '';
    return `<option value="${p.id}"${selected}>${p.name}${stage ? ` (${stage})` : ''}</option>`;
  }).join('');
}

function closeSupportTicketMenus(exceptId) {
  document.querySelectorAll('.sd-menu-wrap.is-open').forEach(wrap => {
    const menu = wrap.querySelector('.sd-menu');
    if (exceptId && menu && menu.id === exceptId) return;
    wrap.classList.remove('is-open');
    if (menu) {
      menu.hidden = true;
      menu.style.top = '';
      menu.style.right = '';
      menu.style.left = '';
    }
    const trigger = wrap.querySelector('.sd-menu-trigger');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  });
}

function positionSupportTicketMenu(menu, trigger) {
  if (!menu || !trigger) return;
  const rect = trigger.getBoundingClientRect();
  menu.style.left = 'auto';
  menu.style.right = `${Math.max(8, window.innerWidth - rect.right)}px`;
  menu.style.top = `${rect.bottom + 6}px`;
  const mRect = menu.getBoundingClientRect();
  if (mRect.bottom > window.innerHeight - 8) {
    menu.style.top = `${Math.max(8, rect.top - mRect.height - 6)}px`;
  }
  if (mRect.left < 8) {
    menu.style.right = 'auto';
    menu.style.left = '8px';
  }
}

function toggleSupportTicketMenu(menuId, event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  const menu = document.getElementById(menuId);
  if (!menu) return;
  const wrap = menu.closest('.sd-menu-wrap');
  const trigger = wrap ? wrap.querySelector('.sd-menu-trigger') : null;
  const willOpen = menu.hidden;
  closeSupportTicketMenus(willOpen ? menuId : null);
  menu.hidden = !willOpen;
  if (wrap) wrap.classList.toggle('is-open', willOpen);
  if (trigger) trigger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  if (willOpen) {
    positionSupportTicketMenu(menu, trigger);
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  } else {
    menu.style.top = '';
    menu.style.right = '';
    menu.style.left = '';
  }
}

if (typeof window !== 'undefined' && !window.__yorkSupportTicketMenuBound) {

const TABLE_PAGE_SIZE_OPTIONS = [5, 10, 25, 50];
const DEFAULT_TABLE_PAGE_SIZE = 10;

function normalizeTablePageSize(size) {
  const n = Number(size);
  return TABLE_PAGE_SIZE_OPTIONS.includes(n) ? n : DEFAULT_TABLE_PAGE_SIZE;
}

function getTablePagerState(key) {
  if (!app.tablePagers || typeof app.tablePagers !== 'object') app.tablePagers = {};
  const current = app.tablePagers[key] || {};
  const pageSize = normalizeTablePageSize(current.pageSize);
  const page = Math.max(1, Number(current.page) || 1);
  if (!app.tablePagers[key] || app.tablePagers[key].page !== page || app.tablePagers[key].pageSize !== pageSize) {
    app.tablePagers[key] = { page, pageSize };
  }
  return app.tablePagers[key];
}

function paginateCollection(items = [], key) {
  const list = Array.isArray(items) ? items : [];
  const state = getTablePagerState(key);
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize) || 1);
  const page = Math.min(state.page, totalPages);
  if (page !== state.page) {
    app.tablePagers[key] = { ...state, page };
  }
  const start = (page - 1) * state.pageSize;
  const rows = list.slice(start, start + state.pageSize);
  return {
    key,
    rows,
    page,
    pageSize: state.pageSize,
    total,
    totalPages,
    rangeStart: total === 0 ? 0 : start + 1,
    rangeEnd: Math.min(start + state.pageSize, total)
  };
}

function renderTablePagination(pager) {
  if (!pager) return '';
  const { key, page, pageSize, total, totalPages, rangeStart, rangeEnd } = pager;
  return `
    <div class="table-foot">
      <div class="table-foot-meta">${rangeStart}–${rangeEnd} of ${total}</div>
      <div class="table-foot-controls">
        <label class="table-page-size">
          <span class="table-page-size-label">Rows</span>
          <select
            class="table-page-size-select"
            aria-label="Rows per page"
            onchange="app.setTablePageSize('${key}', this.value)"
          >
            ${TABLE_PAGE_SIZE_OPTIONS.map(opt => `
              <option value="${opt}" ${opt === pageSize ? 'selected' : ''}>${opt}</option>
            `).join('')}
          </select>
        </label>
        <div class="table-pager">
          <button type="button" class="table-pager-btn" ${page <= 1 ? 'disabled' : ''} onclick="app.setTablePage('${key}', ${page - 1})" aria-label="Previous page">
            ${getIconSvg('ChevronLeft', 14)}
          </button>
          <span class="table-pager-label">${page} / ${totalPages}</span>
          <button type="button" class="table-pager-btn" ${page >= totalPages ? 'disabled' : ''} onclick="app.setTablePage('${key}', ${page + 1})" aria-label="Next page">
            ${getIconSvg('ChevronRight', 14)}
          </button>
        </div>
      </div>
    </div>
  `;
}

function renderAdminTicketsQueueTab() {
  const key = app.adminSelectedTicketKey;
  if (key && key.clientId && key.ticketId) {
    const client = (app.clients || []).find(c => c.id === key.clientId);
    const ticket = client?.supportTickets?.find(t => t.id === key.ticketId);
    if (client && ticket) return renderAdminTicketDetail(client, ticket);
    app.adminSelectedTicketKey = null;
  }

  const allTickets = collectAdminTickets();
  if ((app.adminTicketSection || 'dashboard') === 'tickets') {
    return renderAdminSupportTicketsList(allTickets);
  }
  return renderAdminSupportDashboard(allTickets);
}
const CATALOG_STAGE_STYLES = {
  decide: {
    gradient: 'linear-gradient(135deg, #0284C7 0%, #06B6D4 50%, #10B981 100%)',
    bloom: 'rgba(6, 182, 212, 0.35)',
    tag: 'decide'
  },
  execute: {
    gradient: 'linear-gradient(135deg, #0D9488 0%, #10B981 45%, #6366F1 100%)',
    bloom: 'rgba(139, 92, 246, 0.35)',
    tag: 'execute'
  },
  measure: {
    gradient: 'linear-gradient(135deg, #F59E0B 0%, #D97706 45%, #EF4444 100%)',
    bloom: 'rgba(245, 158, 11, 0.35)',
    tag: 'measure'
  },
  assess: {
    gradient: 'linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%)',
    bloom: 'rgba(139, 92, 246, 0.35)',
    tag: 'assess'
  },
  operate: {
    gradient: 'linear-gradient(135deg, #3B82F6 0%, #6366F1 50%, #8B5CF6 100%)',
    bloom: 'rgba(99, 102, 241, 0.35)',
    tag: 'operate'
  }
};

function getCatalogStageStyle(product) {
  const key = (product.stageClass || product.stage || 'operate').toLowerCase();
  return CATALOG_STAGE_STYLES[key] || CATALOG_STAGE_STYLES.operate;
}

function getProductDeploymentClients(productId) {
  return (app.clients || []).filter(c => (c.grantedProducts || []).includes(productId));
}

function renderCatalogSvcCard(product, options = {}) {
  const mode = options.mode || 'admin';
  const style = getCatalogStageStyle(product);
  const deploymentCount = options.deploymentCount ?? 0;
  const isGranted = !!options.isGranted;
  const isRequested = !!options.isRequested;
  const stateClass = isGranted ? ' is-granted' : (isRequested ? ' is-requested' : '');
  const creditLabel = product.creditType || 'Available on both plans';

  let footRight = '';

  if (mode === 'admin') {
    footRight = `<span class="svc-meta-pill${deploymentCount > 0 ? ' is-ok' : ''}">${deploymentCount} account${deploymentCount === 1 ? '' : 's'}</span>`;
  } else if (isGranted) {
    footRight = `<span class="svc-meta-pill is-ok">In your path</span>`;
  } else if (isRequested) {
    footRight = `
      <button type="button" class="svc-plus-btn is-requested" title="Access requested" aria-label="Access requested for ${product.name}">
        ${getIconSvg('Check', 14)}
      </button>
    `;
  } else {
    footRight = `
      <button type="button" class="svc-plus-btn" title="Request access" aria-label="Request access to ${product.name}" onclick="event.stopPropagation(); requestEcosystemAccess('${product.id}')">
        ${getIconSvg('Plus', 14)}
      </button>
    `;
  }

  const statusTags = `
    ${renderProductStagePill(product)}
    ${mode === 'client' && isGranted ? '<span class="svc-status-pill live">Live</span>' : ''}
    ${mode === 'client' && isRequested && !isGranted ? '<span class="svc-status-pill beta">Requested</span>' : ''}
  `;

  return `
    <article
      class="svc-card${stateClass}"
      role="button"
      tabindex="0"
      onclick="openCatalogProductModal('${product.id}', '${mode}')"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openCatalogProductModal('${product.id}','${mode}')}"
    >
      <div class="svc-title-row">
        <div class="svc-mini-icon" style="background:${style.gradient};--icon-gradient:${style.gradient};--icon-bloom:${style.bloom};" aria-hidden="true">
          ${getIconSvg(product.icon || 'Layers', 16, '#fff')}
        </div>
        <div class="svc-card-copy">
          <div class="svc-card-name-row">
            <h3>${product.name}</h3>
            <div class="svc-card-name-tags">${statusTags}</div>
          </div>
          <p class="svc-card-credit">${creditLabel}</p>
        </div>
      </div>
      <p class="svc-desc">${product.description || product.role || ''}</p>
      <div class="svc-card-foot">
        ${footRight}
      </div>
    </article>
  `;
}

function renderAdminProductsCatalogTab() {
  const currentStage = app.adminProductFilterStage || "all";

  let products = PRODUCTS_CATALOG;
  if (currentStage !== "all") {
    products = products.filter(p => p.stage.toLowerCase() === currentStage.toLowerCase());
  }

  // Count active deployments for each product
  const deploymentCounts = {};
  app.clients.forEach(c => {
    (c.grantedProducts || []).forEach(pid => {
      deploymentCounts[pid] = (deploymentCounts[pid] || 0) + 1;
    });
  });

  const operatorName = getBentoFirstName("Kyle");
  const stageCounts = ['decide','execute','measure','assess','operate'].reduce((acc, s) => {
    acc[s] = PRODUCTS_CATALOG.filter(p => p.stage.toLowerCase() === s).length;
    return acc;
  }, { all: PRODUCTS_CATALOG.length });

  return `
    <div class="bento-page">
      ${renderBentoGreeting({
        title: `Hey ${operatorName}, explore the software catalog`,
        subtitle: `${PRODUCTS_CATALOG.length} B2B solutions across Decide → Operate.`
      })}

      ${renderBentoMetrics([
        { value: stageCounts.all, label: 'Catalog products', hint: 'Decide → Operate', icon: 'Layers', tone: 'accent' },
        { value: Object.keys(stageCounts).filter(k => k !== 'all').length, label: 'Journey stages', hint: 'Full operating path', icon: 'Gauge', tone: 'info' },
        { value: Object.values(deploymentCounts).reduce((a,b)=>a+b,0), label: 'Active deployments', hint: 'Assigned across portfolio', icon: 'Server', tone: 'ok' },
        { value: Object.values(deploymentCounts).filter(n => n > 0).length, label: 'Products in use', hint: 'At least one company', icon: 'CheckCircle2', tone: 'ok' }
      ])}

      <div class="bento-surface">
        <div class="bento-panel-head" style="margin:0 0 14px">
          <h2 class="bento-panel-title">Software catalog</h2>
        </div>
        <div class="bento-chip-row" role="tablist" aria-label="Filter catalog by stage">
          ${['all','decide','execute','measure','assess','operate'].map(stage => `
            <button type="button" class="bento-chip ${stage !== 'all' ? `is-${stage}` : ''} ${currentStage === stage ? 'active' : ''}" onclick="app.setAdminProductFilterStage('${stage}')">
              <span>${stage === 'all' ? 'All' : stage.charAt(0).toUpperCase() + stage.slice(1)}</span>
              <span class="bento-chip-count">${stageCounts[stage]}</span>
            </button>
          `).join('')}
        </div>
        <div class="service-cards-deck-grid" style="margin-top:14px">
          ${products.length ? products.map(p => renderCatalogSvcCard(p, {
            mode: 'admin',
            deploymentCount: deploymentCounts[p.id] || 0
          })).join('') : `
            <div class="catalog-empty">
              <p class="catalog-empty-title">No products match this filter</p>
              <p class="catalog-empty-copy">Try another stage above.</p>
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

function getProductManager(client, productId) {
  const assignedName = client?.productAssignees?.[productId];
  if (assignedName) {
    const emp = (typeof YORK_EMPLOYEES !== 'undefined' ? YORK_EMPLOYEES : []).find(e => e.name === assignedName);
    return {
      name: assignedName,
      title: emp?.title || 'Product Strategist',
      email: ''
    };
  }
  const team = client.team || [];
  const managers = team.filter(m => (m.allowedProducts || []).includes(productId));
  if (managers.length) {
    const specialist = managers.find(m => m.role !== 'owner') || managers[0];
    return {
      name: specialist.name || 'Unassigned',
      title: specialist.title || (specialist.role === 'owner' ? 'Owner' : 'Product Strategist'),
      email: specialist.email || ''
    };
  }
  return {
    name: client.ownerName || 'Unassigned',
    title: 'Account owner',
    email: client.ownerEmail || ''
  };
}

function getWorkspaceAdoption(client, productId) {
  const adoption = (client.serviceAdoption && client.serviceAdoption[productId]) || {};
  const status = adoption.status || 'active';
  return {
    status,
    lastUsed: adoption.lastUsed || (status === 'unused' ? 'No activity yet' : 'Recently'),
    usageRate: adoption.usageRate || '',
    notes: adoption.notes || ''
  };
}

function workspaceAdoptionLabel(status) {
  if (status === 'underutilized') return 'Underused';
  if (status === 'unused') return 'Unused';

}

function workspaceAdoptionClass(status) {
  if (status === 'underutilized') return 'open';
  if (status === 'unused') return 'resolved';
  return 'ws-active';
}

function getInitiativeStatusMeta(milestone) {
  const stage = milestone.stage || 'scoping';
  if (stage === 'approved') {
    return { className: 'approved', label: 'Completed', action: 'signed' };
  }
  if (stage === 'client_review') {
    return { className: 'signoff', label: 'Needs sign-off', action: 'signoff' };
  }
  if (stage === 'in_progress') {
    return { className: 'delivery', label: 'In delivery', action: 'progress' };
  }
  return { className: 'scoping', label: 'Scoping', action: 'progress' };
}

function isInitiativeCompleted(milestone) {
  return milestone.stage === 'approved';
}

function getInitiativeProgressSteps(milestone) {
  const stage = milestone.stage || 'scoping';
  const order = ['scoping', 'in_progress', 'client_review', 'approved'];
  const idx = Math.max(0, order.indexOf(stage));
  const labels = [
    { key: 'scoping', name: 'Scoping', meta: 'York defining scope and success criteria' },
    { key: 'in_progress', name: 'In delivery', meta: 'York practice lead executing the work' },
    { key: 'client_review', name: 'Needs sign-off', meta: 'Ready for your review and approval' },
    { key: 'approved', name: 'Completed', meta: milestone.approvedAt ? `Signed off ${milestone.approvedAt}` : 'Deliverable approved' }
  ];
  return labels.map((step, i) => ({
    ...step,
    state: i < idx ? 'done' : (i === idx ? 'current' : 'upcoming')
  }));
}

function findLinkedDeliverable(client, milestone) {
  const linked = milestone.deliverableLinked || '';
  if (!linked || !client.deliverables) return null;
  return client.deliverables.find(d =>
    d.title.includes(linked) || linked.includes(d.title) || d.title === linked
  ) || null;
}

function initiativeCategoryFromPractice(practice) {
  const p = String(practice || '').toLowerCase();
  if (p.includes('gtm')) return 'GTM';
  if (p.includes('eng')) return 'Engineering';
  if (p.includes('secur') || p.includes('advisory')) return 'Advisory';
  if (p.includes('strateg')) return 'Strategy';
  return practice || 'GTM';
}

function parseInitiativeDue(targetDate) {
  const s = String(targetDate || '');
  const yearMatch = s.match(/(20\d{2})/);
  const year = yearMatch ? yearMatch[1] : String(new Date().getFullYear());
  let quarter = 'Q4';
  if (/jan|feb|mar/i.test(s) || /\b0?[1-3]\b/.test(s)) quarter = 'Q1';
  if (/apr|may|jun/i.test(s)) quarter = 'Q2';
  if (/jul|aug|sep/i.test(s)) quarter = 'Q3';
  if (/oct|nov|dec/i.test(s)) quarter = 'Q4';
  return { dueQuarter: quarter, dueYear: year };
}

function ensureInitiativeDetail(milestone, client) {
  if (!milestone) return milestone;
  if (!milestone.cadence) milestone.cadence = 'Continuous';
  if (!milestone.category) milestone.category = initiativeCategoryFromPractice(milestone.practice);
  if (!milestone.desc && milestone.description) milestone.desc = milestone.description;
  if (!milestone.description && milestone.desc) milestone.description = milestone.desc;
  if (!Array.isArray(milestone.owners) || !milestone.owners.length) {
    milestone.owners = [client?.ownerEmail || 'owner@company.com'].filter(Boolean);
  }
  if (!milestone.dueQuarter || !milestone.dueYear) {
    const due = parseInitiativeDue(milestone.targetDate);
    milestone.dueQuarter = milestone.dueQuarter || due.dueQuarter;
    milestone.dueYear = milestone.dueYear || due.dueYear;
  }
  if (!Array.isArray(milestone.checklist) || !milestone.checklist.length) {
    const base = milestone.id || 'ms';
    const doneAll = milestone.stage === 'approved';
    milestone.checklist = [
      {
        id: `${base}-chk-1`,
        title: milestone.deliverableLinked
          ? `Finalize ${milestone.deliverableLinked}`
          : `Define scope for ${milestone.title}`,
        dueDate: milestone.targetDate || 'TBD',
        done: doneAll || milestone.stage === 'client_review' || milestone.stage === 'in_progress'
      },
      {
        id: `${base}-chk-2`,
        title: `Align ${milestone.practice || 'practice'} owners and success metrics`,
        dueDate: milestone.targetDate || 'TBD',
        done: doneAll || milestone.stage === 'client_review'
      },
      {
        id: `${base}-chk-3`,
        title: 'Complete review package and handoff',
        dueDate: milestone.targetDate || 'TBD',
        done: doneAll
      }
    ];
  }
  if (!Array.isArray(milestone.advisors)) milestone.advisors = [];
  if (!Array.isArray(milestone.intelligence)) {
    milestone.intelligence = [];
    if (String(milestone.category || milestone.practice || '').toLowerCase().includes('gtm')) {
      milestone.intelligence.push({
        id: `${milestone.id}-intel-1`,
        mark: 'baseline',
        title: 'Net revenue retention',
        category: 'Retention',
        date: '2026-10-16',
        value: '125%',
        note: ''
      });
    }
  }
  if (!milestone.yorkHelp) {
    milestone.yorkHelp = {
      title: `Design ${String(milestone.category || 'operating').toLowerCase()} outcomes with York`,
      body: `We can help you execute “${milestone.title}” with clear ownership, milestones, and measurable progress. York aligns your team around delivery, streamlines the operating cadence, and keeps the artifact trail ready for sign-off.`
    };
  }
  return milestone;
}

function renderClientMilestonesTab(client) {

    const selected = (client.milestones || []).find(m => m.id === app.clientSelectedInitiativeId);

    app.clientSelectedInitiativeId = null;
  }

  const all = [...(client.milestones || [])];
  const view = app.initiativesViewFilter === 'completed' ? 'completed' : 'active';
  const query = String(app.initiativesSearchQuery || '').toLowerCase().trim();
  const signerName = client.ownerName || app.currentUser?.name || 'Client';

  const signOffCount = all.filter(m => m.stage === 'client_review').length;
  const activeCount = all.filter(m => !isInitiativeCompleted(m)).length;

function ticketDepartmentForProduct(productId) {
  const map = {
    fuel: 'Capital Support',

  };

function ticketAssigneeShort(ticket) {
  if (ticket.assigneeName) return ticket.assigneeName;
  const raw = String(ticket.yorkAssignee || '').trim();
  if (!raw) return 'Unassigned';
  return raw.replace(/\s*\([^)]*\)\s*/g, '').trim() || 'Unassigned';
}

function isTicketUnassigned(ticket) {
  const name = ticketAssigneeShort(ticket);
  return !name || name === 'Unassigned';
}

function isTicketAssignedToMe(ticket) {
  const assignee = ticketAssigneeShort(ticket).toLowerCase();
  if (!assignee || assignee === 'unassigned') return false;
  const me = String(app.currentUser?.name || '').trim().toLowerCase();
  const aliases = [me, 'kyle york', 'york ie admin'].filter(Boolean);
  return aliases.some(a => assignee === a || assignee.includes(a) || a.includes(assignee));
}

function ticketRecencyScore(ticket) {
  const s = String(ticket.updatedAt || ticket.createdAt || '').toLowerCase();
  if (s.includes('just now')) return 100000;
  if (s.includes('today')) return 90000;
  if (s.includes('yesterday')) return 80000;
  const m = s.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})/i);
  if (m) {
    const months = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
    return (months[m[1].slice(0, 3).toLowerCase()] || 0) * 100 + Number(m[2] || 0);
  }
  return 0;
}

        clientDomain: c.domain || '',
        clientEmail: t.creatorEmail || c.ownerEmail || '',
        grantedProducts: c.grantedProducts || []
      });
    });
  });
  return rows;
}

function ticketDisplayStatus(status) {
  if (status === 'resolved') return 'Closed';
  if (status === 'in_progress') return 'In Progress';
  return 'Open';
}

function ticketInitials(name = '') {
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return String(name).substring(0, 2).toUpperCase() || 'YY';
}

function userAvatarSeed(name = '') {
  const label = String(name || 'User').trim() || 'User';
  let h = 2166136261;
  for (let i = 0; i < label.length; i++) {
    h ^= label.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h >>> 0);
}

function guessUserGender(name = '') {
  const first = String(name || '').trim().split(/[\s,&/]+/)[0].toLowerCase();
  const women = new Set([
    'sofia', 'elena', 'priya', 'amelia', 'maya', 'sarah', 'rachel', 'anna', 'emma',
    'olivia', 'sophia', 'ava', 'mia', 'isabella', 'charlotte', 'harper', 'evelyn',
    'abigail', 'emily', 'elizabeth', 'camila', 'luna', 'lisa', 'jessica', 'jennifer',
    'ashley', 'amanda', 'melissa', 'nicole', 'stephanie', 'rebecca', 'laura', 'michelle',
    'kimberly', 'amy', 'angela', 'kelly', 'natalie', 'diana', 'julie', 'victoria',
    'hannah', 'alice', 'grace', 'zoe', 'chloe', 'lily', 'nora', 'aubrey', 'scarlett',
    'ellie', 'stella', 'violet', 'lucy', 'claire', 'leah', 'savannah', 'aria', 'nevaeh',
    'rostova', 'alvarez', 'jenkins', 'kim', 'lin', 'cho', 'shah', 'patel'
  ]);
  if (women.has(first)) return 'women';
  const ambiguous = new Set(['alex', 'jordan', 'casey', 'riley', 'taylor', 'morgan', 'jamie', 'avery', 'quinn', 'parker', 'cameron', 'drew', 'sage']);
  if (ambiguous.has(first)) return userAvatarSeed(name) % 2 ? 'women' : 'men';
  return 'men';
}

function userPhotoUrl(name = 'User') {
  const seed = userAvatarSeed(name);
  const gender = guessUserGender(name);
  const id = seed % 99;
  return `https://randomuser.me/api/portraits/${gender}/${id}.jpg`;
}

function userAvatarFallbackDataUri(name = 'User') {
  const initials = ticketInitials(name);
  const seed = userAvatarSeed(name);
  const hues = [152, 168, 186, 204, 222, 248, 268, 18, 34];
  const hue = hues[seed % hues.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="hsl(${hue} 42% 40%)"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700">${initials}</text></svg>`;
  return `data:image/svg+xml,${encodeURIComponent(svg)}`;
}

function renderUserAvatar(name = 'User', className = 'user-avatar-photo') {
  const label = String(name || 'User').trim() || 'User';
  const safe = label.replace(/"/g, '&quot;');
  const url = userPhotoUrl(label);
  const fallback = userAvatarFallbackDataUri(label);
  return `<span class="${className} user-avatar-photo" title="${safe}" aria-hidden="true"><img src="${url}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${fallback}'" /></span>`;
}

function ensureTicketThread(ticket, client) {
  if (!ticket.department) ticket.department = ticketDepartmentForProduct(ticket.product);
  if (!ticket.topic) ticket.topic = ticket.productName || ticket.product || 'Support';
  if (!ticket.assigneeName) ticket.assigneeName = ticketAssigneeShort(ticket);
  if (!ticket.updatedAt) ticket.updatedAt = ticket.resolvedAt || ticket.createdAt || 'Recently';
  if (!Array.isArray(ticket.participants)) ticket.participants = [];
  if (!Array.isArray(ticket.comments) || !ticket.comments.length) {
    ticket.comments = [];
    if (ticket.description) {
      ticket.comments.push({
        id: 'cmt-seed-' + ticket.id,
        type: 'message',
        author: ticket.creatorName || client?.ownerName || 'Client',
        authorRole: 'client',
        body: ticket.description,
        createdAt: ticket.createdAt || 'Recently'
      });
    }
    if (ticket.yorkAssignee) {
      ticket.comments.push({
        id: 'act-seed-' + ticket.id,
        type: 'activity',
        author: 'Support Desk',
        body: `automatically assigned None → ${ticketAssigneeShort(ticket)}`,
        createdAt: ticket.createdAt || 'Recently'
      });
    }
    if (ticket.yorkNotes) {
      ticket.comments.push({
        id: 'cmt-notes-' + ticket.id,
        type: 'message',
        author: ticketAssigneeShort(ticket),
        authorRole: 'york',
        body: ticket.yorkNotes,
        createdAt: ticket.updatedAt || ticket.createdAt || 'Recently'
      });
    }
  }
  return ticket;
}

function renderClientTeamTab(client) {
  const team = client.team || [];
  const grantedIds = client.grantedProducts || [];
  const grantedProducts = PRODUCTS_CATALOG.filter(p => grantedIds.includes(p.id));
  const serviceCount = grantedProducts.length;
  const roleFilter = app.teamRoleFilter || 'all';
  const query = String(app.teamSearchQuery || '').toLowerCase().trim();

  const roleLabel = (role) => (role === 'owner' ? 'Owner' : 'Member');
  const titleClean = (title = '') => title.replace(/\s*\(Owner\)\s*/i, '').trim();

  const owners = team.filter(m => m.role === 'owner').length;
  const members = team.filter(m => m.role !== 'owner').length;
  let grantCells = 0;
  let possibleCells = 0;
  team.forEach(m => {
    if (m.role === 'owner') {
      grantCells += serviceCount;
      possibleCells += serviceCount;
    } else {
      const allowed = m.allowedProducts || [];
      grantCells += grantedProducts.filter(p => allowed.includes(p.id)).length;
      possibleCells += serviceCount;
    }
  });
  const coveragePct = possibleCells ? Math.round((grantCells / possibleCells) * 100) : 0;

  const memberCoverage = (m) => {
    if (!serviceCount) return { n: 0, text: 'No services', products: [] };
    if (m.role === 'owner') return { n: serviceCount, text: `Full · ${serviceCount}/${serviceCount}`, products: grantedProducts };
    const allowed = m.allowedProducts || [];
    const products = grantedProducts.filter(p => allowed.includes(p.id));
    const n = products.length;
    if (n === 0) return { n, text: `None · 0/${serviceCount}`, products: [] };
    if (n === serviceCount) return { n, text: `Full · ${n}/${serviceCount}`, products };
    return { n, text: `Limited · ${n}/${serviceCount}`, products };
  };

  let filteredTeam = team.filter(m => {
    if (roleFilter === 'owners') return m.role === 'owner';
    if (roleFilter === 'members') return m.role !== 'owner';
    return true;
  });
  if (query) {
    filteredTeam = filteredTeam.filter(m => {
      const hay = `${m.name || ''} ${m.email || ''} ${m.title || ''} ${m.role || ''}`.toLowerCase();
      return hay.includes(query);
    });
  }

  const teamPager = paginateCollection(filteredTeam, 'team');
  const rowsHtml = teamPager.rows.map(m => {
    const isOwner = m.role === 'owner';
    const cov = memberCoverage(m);
    const shown = cov.products.slice(0, 3);
    const extra = Math.max(0, cov.products.length - shown.length);
    return `
      <tr>
        <td>
          <div class="ws-manager-cell">
            ${renderUserAvatar(m.name, `team-member-avatar${isOwner ? ' is-owner' : ''}`)}
            <div class="sd-company-copy">
              <div class="sd-company">${m.name}</div>
              <span class="sd-email">${m.email}${titleClean(m.title) ? ` · ${titleClean(m.title)}` : ''}</span>
            </div>
          </div>
        </td>
        <td><span class="team-member-role ${isOwner ? 'owner' : ''}">${roleLabel(m.role)}</span></td>
        <td>
          <div class="team-access-chips">
            ${serviceCount === 0 ? `<span class="team-access-chip">No products</span>` : `
              ${shown.map(p => `<span class="team-access-chip is-on">${p.name}</span>`).join('')}
              ${extra ? `<span class="team-access-chip is-more">+${extra}</span>` : ''}
              ${!shown.length ? `<span class="team-access-chip">No access</span>` : ''}
            `}
          </div>
          <span class="sd-email" style="margin-top:4px;display:block;">${cov.text}</span>
        </td>
        <td>
          <div class="sd-actions">
            ${isOwner ? `
              <button type="button" class="btn-saas-secondary" onclick="openManageTeamAccessModal('${client.id}', '${m.id}')">
                ${getIconSvg('Eye', 14)}
                <span>View</span>
              </button>
            ` : `
              <button type="button" class="btn-saas-secondary" onclick="openManageTeamAccessModal('${client.id}', '${m.id}')">
                ${getIconSvg('Pencil', 14)}
                <span>Manage access</span>
              </button>
            `}
          </div>
        </td>
      </tr>
    `;
  }).join('');

  return `
    <div class="directory-page">
      <section class="directory-hero">
        <div class="directory-hero-top">
          <div class="page-headline-wrap">
            <h1 class="page-headline-lead">Team &amp; Access</h1>
            <p class="page-headline-sub">Invite people and assign which provisioned products each member can use at ${client.name || 'your company'}.</p>
          </div>
          <button type="button" class="btn-saas-primary directory-hero-cta" onclick="openInviteTeamModal('${client.id}')">
            ${getIconSvg('Plus', 14)}
            <span>Invite member</span>
          </button>
        </div>
      </section>

      ${renderBentoMetrics([
        { value: team.length, label: 'People', hint: 'Active team members', icon: 'Users' },
        { value: owners, label: 'Owners', hint: 'Full account access', icon: 'ShieldCheck', tone: 'ok' },
        { value: members, label: 'Members', hint: 'Role-based access', icon: 'User', tone: 'info' },
        { value: coveragePct + '%', label: 'Permission coverage', hint: 'Provisioned seats', icon: 'Lock', tone: coveragePct >= 70 ? 'ok' : 'warn' }
      ])}

      <section class="directory-table-panel">
        <div class="directory-table-toolbar">
          <div class="directory-table-heading">
            <h2 class="directory-table-title">${roleFilter === 'owners' ? 'Owners' : roleFilter === 'members' ? 'Members' : 'All members'}</h2>
            <p class="directory-table-meta">${teamPager.rangeStart}–${teamPager.rangeEnd} of ${teamPager.total} · ${serviceCount} provisioned product${serviceCount === 1 ? '' : 's'}</p>
          </div>
          <div class="directory-table-controls">
            ${renderToolbarFilter({
              id: 'team-role-filter',

              ariaLabel: 'Filter team by role',
              currentKey: roleFilter,
              onSelect: 'app.setTeamRoleFilter',
              options: [
                { key: 'all', label: 'All', count: team.length },
                { key: 'owners', label: 'Owners', count: owners },
                { key: 'members', label: 'Members', count: members }
              ]
            })}
            <div class="directory-search">
              <i data-lucide="search" class="directory-search-icon"></i>
              <input
                id="team-search-input"
                type="text"
                class="directory-search-input"
                value="${String(app.teamSearchQuery || '').replace(/"/g, '&quot;')}"
                oninput="app.setTeamSearchQuery(this.value)"
                placeholder="Search people..."
              />
              ${app.teamSearchQuery ? `
                <button type="button" class="directory-search-clear" onclick="app.setTeamSearchQuery('');" aria-label="Clear search">✕</button>

        <div class="support-desk-table-wrap">

                      <p class="aa-company-empty-text">${team.length ? 'Try another role or clear search.' : 'Invite a teammate to start assigning product access.'}</p>
                      ${!team.length ? `

function openSendInviteModal(clientId) {
  const client = app.clients.find(c => c.id === clientId);
  if (!client) return;
  const granted = client.grantedProducts || [];
  const isActive = client.status === 'active';
  const isInvited = client.status === 'invited';
  const modalTitle = isActive ? 'Manage product access' : (isInvited ? 'Update product access' : 'Set up product access');
  const modalSub = isActive
    ? 'Turn products on or off for this live account.'
    : (isInvited
      ? 'Adjust which products they get, then resend the portal invite.'
      : 'Choose the products this company should receive, then invite their contact.');
  const statusLabel = isActive ? 'Active' : (isInvited ? 'Invited' : 'Inactive');
  const primaryLabel = isActive ? 'Save access' : (isInvited ? 'Save & resend invite' : 'Invite with access');
  const stages = [
    { key: 'all', label: 'All' },
    { key: 'decide', label: 'Decide' },
    { key: 'execute', label: 'Execute' },
    { key: 'measure', label: 'Measure' },
    { key: 'assess', label: 'Assess' },
    { key: 'operate', label: 'Operate' }
  ];

  const grouped = {};
  PRODUCTS_CATALOG.forEach(p => {
    const key = (p.stageClass || (p.stage || 'other').toLowerCase());
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(p);
  });
  const stageOrder = ['decide', 'execute', 'measure', 'assess', 'operate'];
  const stageCounts = stages.reduce((acc, s) => {

function bindInviteListScrollChrome() {
  const list = document.getElementById('invite-products-list');
  if (!list || list.dataset.scrollChromeBound === '1') return;
  list.dataset.scrollChromeBound = '1';
  let hideTimer;
  list.addEventListener('scroll', () => {
    list.classList.add('is-scrolling');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => list.classList.remove('is-scrolling'), 700);
  }, { passive: true });
}

function syncInviteSelectionUI() {
  const checks = Array.from(document.querySelectorAll('.invite-prod-check'));
  const selected = checks.filter(c => c.checked).length;
  const total = checks.length || PRODUCTS_CATALOG.length;

  checks.forEach(c => {
    const card = c.closest('.svc-assign-card');
    if (card) card.classList.toggle('is-selected', c.checked);
  });

  const countEl = document.getElementById('invite-selected-n');
  if (countEl) countEl.textContent = String(selected);

  const countWrap = document.getElementById('invite-selection-count');
  if (countWrap) {
    const span = countWrap.querySelector('span');
    if (span) span.textContent = `of ${total} selected`;
  }

  const progress = document.getElementById('invite-selection-progress');
  if (progress) {
    progress.style.width = `${total ? Math.round((selected / total) * 100) : 0}%`;
  }

  const meta = document.getElementById('invite-footer-meta');
  if (meta) {
    meta.innerHTML = selected
      ? `<strong>${selected}</strong> service${selected === 1 ? '' : 's'} ready to provision`
      : 'No services selected yet';
  }

  const primary = document.getElementById('invite-primary-btn');
  if (primary) {
    primary.disabled = selected === 0;
    primary.style.opacity = selected === 0 ? '0.55' : '1';
    primary.style.cursor = selected === 0 ? 'not-allowed' : 'pointer';
  }
}

function filterInviteStage(stageKey, btn) {
  document.querySelectorAll('.svc-assign-stage-btn').forEach(b => b.classList.remove('is-active'));
  if (btn) btn.classList.add('is-active');

  document.querySelectorAll('.svc-assign-group').forEach(group => {
    const key = group.getAttribute('data-stage-group');
    group.style.display = (stageKey === 'all' || key === stageKey) ? '' : 'none';
  });
}

function setInvitePreset(type) {
  const checks = document.querySelectorAll('.invite-prod-check');
  checks.forEach(c => {
    if (type === 'all') c.checked = true;
    else if (type === 'clear') c.checked = false;
    else if (type === 'core') c.checked = ['fuel', 'growthos', 'gtm-launchpad', 'pulse'].includes(c.value);
  });

  document.querySelectorAll('.svc-assign-preset').forEach(b => {
    b.classList.toggle('is-active', b.getAttribute('data-preset') === type);
  });

  // Reset stage filter to All so selected cards stay visible
  const allBtn = document.querySelector('.svc-assign-stage-btn[data-stage="all"]');
  if (allBtn) filterInviteStage('all', allBtn);

  syncInviteSelectionUI();
  if (window.lucide) window.lucide.createIcons();
}

function submitInviteServices(clientId) {
  const btn = document.getElementById('invite-primary-btn');
  const checks = document.querySelectorAll('.invite-prod-check:checked');
  const selected = Array.from(checks).map(c => c.value);
  const client = app.clients.find(c => c.id === clientId);
  const isActive = client && client.status === 'active';

  if (btn) {
    btn.disabled = true;
    btn.style.pointerEvents = 'none';
    btn.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;"><svg class="animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle><path d="M12 2a10 10 0 0 1 10 10"></path></svg> <span>${isActive ? 'Saving changes…' : 'Sending invite…'}</span></span>`;
  }

  setTimeout(() => {
    if (btn) {
      btn.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> <span>${isActive ? 'Changes saved!' : 'Invite sent!'}</span></span>`;
      btn.style.background = 'var(--emerald-dark, #059669)';
    }

    setTimeout(() => {
      closeModal();
      if (client && client.status === 'active') {
        client.grantedProducts = selected || [];
        if (client.accessRequests?.length) {
          client.accessRequests = client.accessRequests.filter(id => !client.grantedProducts.includes(id));
        }
        if (!client.serviceAdoption) client.serviceAdoption = {};
        client.grantedProducts.forEach(pid => {
          if (!client.serviceAdoption[pid]) {
            client.serviceAdoption[pid] = {
              status: "active",

              notes: "Access provisioned by York Operating Lead"
            };

          showToast(`Assigned services updated for ${client.name} — ${selected.length} workspace${selected.length === 1 ? '' : 's'} provisioned`, 'success', 3500);
        }
      } else {

  }, 420);
}

function companyLogoInitials(name = 'Company') {
  const parts = String(name || 'Co').trim().split(/[\s&._-]+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  const compact = String(name || 'Co').replace(/[^A-Za-z0-9]/g, '');
  return (compact.substring(0, 2) || 'CO').toUpperCase();
}

function companyLogoSeed(name = 'Company') {
  const label = String(name || 'Co').trim() || 'Co';
  let h = 2166136261;
  for (let i = 0; i < label.length; i++) {
    h ^= label.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h >>> 0);
}

function normalizeCompanyDomain(domain = '') {
  return String(domain || '')
    .trim()
    .toLowerCase()
    .replace(/^https?:\/\//, '')
    .replace(/^www\./, '')
    .split('/')[0]
    .split('?')[0];
}

function resolveCompanyDomain(name = '', domain = '') {
  const direct = normalizeCompanyDomain(domain);
  if (direct) return direct;
  const label = String(name || '').trim();
  if (!label) return '';
  const fromClients = (typeof app !== 'undefined' && app.clients || []).find(c =>
    String(c.name || '').toLowerCase() === label.toLowerCase()
  );
  if (fromClients?.domain) return normalizeCompanyDomain(fromClients.domain);
  const extras = (typeof COMPANY_DIRECTORY_EXTRAS !== 'undefined' ? COMPANY_DIRECTORY_EXTRAS : []);
  const fromDir = extras.find(c => String(c.name || '').toLowerCase() === label.toLowerCase());
  if (fromDir?.domain) return normalizeCompanyDomain(fromDir.domain);
  const slug = label.toLowerCase().replace(/[^a-z0-9]+/g, '');
  return slug ? `${slug}.com` : '';
}

function companyLogoMonogramUrl(name = 'Company') {
  const initials = companyLogoInitials(name);
  const seed = companyLogoSeed(name);
  const colors = ['0F766E', '1D4ED8', '7C3AED', 'B45309', 'BE123C', '0369A1', '047857', '4338CA', '0F172A', 'C2410C'];
  const bg = colors[seed % colors.length];
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(initials)}&background=${bg}&color=fff&size=128&bold=true&format=png&font-size=0.42`;
}

function companyLogoSources(name = 'Company', domain = '') {
  const seed = companyLogoSeed(name);
  const d = resolveCompanyDomain(name, domain);
  const sources = [];
  /* Prefer a stable stock logo image so every account looks like a real portfolio */
  sources.push(COMPANY_LOGO_STOCK[seed % COMPANY_LOGO_STOCK.length]);
  if (d) {
    sources.push(`https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=128`);
  }
  sources.push(companyLogoMonogramUrl(name));
  return Array.from(new Set(sources.filter(Boolean)));
}

function renderCompanyDummyLogo(name = 'Company', size = 'lg', domain = '') {
  const label = String(name || 'Co').trim() || 'Co';
  const safe = label.replace(/"/g, '&quot;');
  const sizeClass = size === 'sm' ? 'is-sm' : (size === 'md' ? 'is-md' : 'is-lg');
  const sources = companyLogoSources(label, domain);
  const primary = sources[0];
  const rest = JSON.stringify(sources.slice(1)).replace(/'/g, '&#39;');
  return `
    <div class="company-dash-logo ${sizeClass}" title="${safe} logo" aria-hidden="true">
      <img
        src="${primary}"
        alt=""
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
        data-logo-fallbacks='${rest}'
        onerror="(function(img){try{var list=JSON.parse(img.getAttribute('data-logo-fallbacks')||'[]');if(!list.length){img.onerror=null;img.src='${companyLogoMonogramUrl(label)}';return;}img.src=list.shift();img.setAttribute('data-logo-fallbacks',JSON.stringify(list));}catch(e){img.onerror=null;}})(this)"
      />
    </div>
  `;
}

/* ─── Click microinteractions (survive SPA re-renders) ─── */
const YORK_CLICK_SELECTOR = [
  'button',
  '[role="button"]',
  '.bento-chip',
  '.filter-tab-btn',
  '.perspective-btn',
  '.sidebar-main-nav-btn',
  '.sidebar-nav-item',
  '.ini-filter-btn',
  '.ini-filter-option',
  '.workspace-launch-btn',
  '.svc-plus-btn',
  '.svc-card',
  '.workspace-card',
  '.topbar-tour-btn',
  '.btn-saas-primary',
  '.btn-saas-secondary',
  '.btn-saas-amber',
  '.bento-cta'
].join(',');

function spawnYorkClickRipple(x, y) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const node = document.createElement('span');
  node.className = 'york-click-ripple';
  node.style.left = `${x}px`;
  node.style.top = `${y}px`;
  document.body.appendChild(node);
  window.setTimeout(() => node.remove(), 520);
}

function normalizeClickLabel(text) {
  return String(text || '').replace(/\s+/g, ' ').trim().slice(0, 48).toLowerCase();
}

function applyYorkClickFxAfterRender() {
  const meta = window.__yorkJustClicked;
  if (!meta || Date.now() - meta.t > 900) return;
  window.__yorkJustClicked = null;

  const selectors = [
    '.filter-tab-btn.active',
    '.perspective-btn.active',
    '.bento-chip.active',
    '.sidebar-main-nav-btn.active',
    '.sidebar-nav-item.active',
    '.ini-filter-option.is-active'
  ].join(',');

  document.querySelectorAll(selectors).forEach((el) => {
    const label = normalizeClickLabel(el.textContent);
    const matched = label === meta.label
      || (meta.label && label.includes(meta.label))
      || (meta.label && meta.label.includes(label));
    if (!matched) return;
    el.classList.add('ui-just-selected', 'ui-press-bounce');
    window.setTimeout(() => {
      el.classList.remove('ui-just-selected', 'ui-press-bounce');
    }, 520);
  });
}

(function initYorkClickFx() {
  if (window.__yorkClickFxReady) return;
  window.__yorkClickFxReady = true;

  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const el = e.target.closest(YORK_CLICK_SELECTOR);
    if (!el) return;
    if (el.disabled || el.getAttribute('aria-disabled') === 'true' || el.hasAttribute('disabled')) return;
    if (el.closest('.tour-root.is-active')) return;

    spawnYorkClickRipple(e.clientX, e.clientY);

    // Keep a fingerprint so selection controls can flash after render()
    window.__yorkJustClicked = {
      label: normalizeClickLabel(el.textContent),
      t: Date.now()
    };

    // Instant bounce for controls that are not immediately destroyed
    if (!el.classList.contains('svc-card')) {
      el.classList.add('ui-press-bounce');
      window.setTimeout(() => el.classList.remove('ui-press-bounce'), 280);
    }
  }, true);
})();

// Global bootstrap
document.addEventListener("DOMContentLoaded", () => {
  render();
});

// Run immediate render
render();
</script>
