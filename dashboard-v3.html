  border: 1px solid color-mix(in srgb, #10B981 28%, transparent);
  box-shadow: none;
}
:root[data-theme="dark"] .copilot-msg-row.is-user .copilot-msg-face {
  background: rgba(16, 185, 129, 0.18);
  color: #6EE7B7;
  border-color: rgba(52, 211, 153, 0.28);
}
.copilot-msg-face i,
.copilot-msg-face svg {
  width: 14px;
  height: 14px;
}
.copilot-msg-ai {
  background: var(--bg-card);
  border: 0.75px solid var(--line);
  color: var(--text-main);
  border-radius: 16px 16px 16px 6px;
  padding: 12px 14px;
  font-size: 13.5px;
  font-weight: 400;
  line-height: 1.55;
  max-width: calc(100% - 36px);
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
}
.copilot-msg-ai strong {
  color: var(--text-main);
  font-weight: 600;
}
.copilot-msg-user {
  background: rgba(16, 185, 129, 0.10);
  color: #064E3B;
  border: 1px solid color-mix(in srgb, #10B981 22%, transparent);
  border-radius: 16px 16px 4px 16px;
  padding: 12px 15px;
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.55;
  max-width: calc(100% - 36px);
  box-shadow: 0 1px 2px rgba(16, 185, 129, 0.08);
}
:root[data-theme="dark"] .copilot-msg-user {
  background: rgba(16, 185, 129, 0.16);
  color: #D1FAE5;
  border-color: rgba(52, 211, 153, 0.28);
  box-shadow: none;
}
.copilot-msg-meta {
  margin-top: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
}
.copilot-msg-user .copilot-msg-meta {
  color: #047857;
  text-align: right;
}
:root[data-theme="dark"] .copilot-msg-user .copilot-msg-meta {
  color: #6EE7B7;
}
.copilot-msg-action {
  margin-top: 10px;
}
.copilot-msg-action button {
  height: 32px;
  padding: 0 12px;
  background: var(--btn-primary-bg);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.copilot-msg-action button:hover {
  background: var(--cta-primary-hover-bg, #005E44);
}

.copilot-composer {
  padding: 12px 14px 14px;
  background: var(--bg-card);
  border-top: 0.75px solid var(--line);
  flex-shrink: 0;
}
.copilot-composer-form {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px 6px 14px;
  border: 0.75px solid var(--line);
  border-radius: 12px;
  background: var(--bg-card);
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
:root[data-theme="dark"] .copilot-composer-form {
  background: rgba(255, 255, 255, 0.04);
  border-color: rgba(255, 255, 255, 0.08);
}
.copilot-composer-form:hover {
  border-color: var(--line-strong);
}
:root[data-theme="dark"] .copilot-composer-form:hover {
  border-color: rgba(255, 255, 255, 0.16);
}
.copilot-composer-form:focus-within {
  background: var(--bg-card);
  border-color: var(--line-strong);
  box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.04), 0 2px 8px rgba(15, 23, 42, 0.04);
}
:root[data-theme="dark"] .copilot-composer-form:focus-within {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.2);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.03);
}
.copilot-input {
  flex: 1;
  height: 36px;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--text-main);
  font-size: 13.5px;
  font-weight: 400;
  outline: none !important;
  box-shadow: none !important;
}
.copilot-input:focus,
.copilot-input:focus-visible {
  outline: none !important;
  box-shadow: none !important;
  border: none !important;
}
.copilot-input::placeholder {
  color: var(--text-muted);
}
.copilot-send {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  background: var(--bg-subtle-2);
  border: 0.75px solid var(--line);
  border-radius: 8px;
  color: var(--text-muted);
  cursor: pointer;
  flex-shrink: 0;
  opacity: 0.6;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
  outline: none;
}
.copilot-send:focus,
.copilot-send:focus-visible {
  outline: none;
  border-color: var(--line-strong);
}
.copilot-composer-form:has(.copilot-input:not(:placeholder-shown)) .copilot-send,
.copilot-send.is-ready {
  background: var(--btn-primary-bg);
  border-color: transparent;
  color: #ffffff;
  opacity: 1;
  transform: scale(1.02);
}
.copilot-composer-form:has(.copilot-input:not(:placeholder-shown)) .copilot-send:hover,
.copilot-send.is-ready:hover {
  background: var(--cta-primary-hover-bg, #005E44);
  transform: scale(1.06);
}
.copilot-send:active {
  transform: scale(0.96);
}
.copilot-send i,
.copilot-send svg {
  width: 14px;
  height: 14px;
}

/* Copilot AI thinking / loading bubble */
.copilot-typing-bubble {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--bg-subtle);
  border: 0.75px solid var(--line);
  color: var(--text-secondary);
  font-size: 12.5px;
  font-weight: 450;
  animation: copilotFadeIn 0.2s ease-out;
}
.copilot-typing-dots {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.copilot-typing-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--emerald-dark, #059669);
  animation: copilotDotBounce 1.2s infinite ease-in-out;
}
.copilot-typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.copilot-typing-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes copilotDotBounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-3px); opacity: 1; }
}
@keyframes copilotFadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.copilot-composer-hint {
  margin: 8px 6px 0;
  font-size: 11px;
  font-weight: 450;
  color: var(--text-muted);
  line-height: 1.35;
}

@media (max-width: 900px) {
  .copilot-panel {
    width: min(40%, 100vw);
    min-width: min(360px, 100vw);
  }
}
@media (max-width: 640px) {
  .copilot-panel {
    width: 100vw;
    min-width: 0;
  }
}

/* Executive Board Deck Presentation Modal */
.deck-modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(10px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.deck-container {
  width: 100%;
  max-width: 1020px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow-drawer);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.deck-slide {
  aspect-ratio: 16 / 9;
  padding: 40px 48px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--bg-card);
}

.deck-slide-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-bottom: 1px solid var(--line);
  padding-bottom: 20px;
}

.deck-slide-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
  padding-top: 20px;
}


/* Radar Sweep Animation */
@keyframes radarRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.radar-sweep {
  animation: radarRotate 4s linear infinite;
}

/* Modal shell — clear elevated dialogs */
@keyframes modalIn {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
:root[data-theme="dark"] .modal-overlay {
  background: rgba(0, 0, 0, 0.65);
}
.modal-content {
  background: var(--bg-card) !important;
  border: 0.75px solid var(--line) !important;
  border-radius: 16px !important;
  box-shadow: 0 24px 56px -16px rgba(15, 23, 42, 0.35), 0 8px 20px rgba(15, 23, 42, 0.08) !important;
  color: var(--text-main) !important;
  max-width: 520px;
  width: 100%;
  max-height: calc(100vh - 48px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-content.\!max-w-2xl,
.modal-content.max-w-2xl { max-width: 640px; }
.modal-content.\!max-w-3xl,
.modal-content.max-w-3xl { max-width: 720px; }

.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

}

  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1 1 auto;
}
.modal-icon {

  height: 36px;
  border-radius: var(--avatar-radius);
  background: var(--bg-subtle);

.modal-icon i,
.modal-icon svg {

  height: 16px;
}
.modal-title {
  margin: 0;

  font-weight: 600 !important;
  color: var(--text-main) !important;
  letter-spacing: -0.01em;
  line-height: 1.25;
}
.modal-subtitle {
  margin: 4px 0 0;
  font-size: 14px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.45;
}
.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);

  place-items: center;

  flex-shrink: 0;

}
.modal-close:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
  border-color: var(--line);
}
.modal-body {
  padding: 20px 24px;

  overflow-x: hidden !important;
  display: flex;
  flex-direction: column;
  gap: 16px;

  min-height: 0;

  scrollbar-color: var(--line-strong) transparent;
}
.modal-body::-webkit-scrollbar {
  width: 6px;
  height: 0px !important;
}
.modal-body::-webkit-scrollbar-track {
  background: transparent;
}
.modal-body::-webkit-scrollbar-thumb {
  background: var(--line-strong);

}
.modal-body::-webkit-scrollbar-thumb:hover {

}
.modal-footer {

}

:root[data-theme="dark"] .aa-custom-modal .modal-footer {

.modal-field {

  flex-direction: column;
  gap: 6px;
}
.modal-label {

  font-weight: 500 !important;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text-muted) !important;
}
.modal-content h1,
.modal-content h2,
.modal-content h3,
.modal-content h4 {
  color: var(--text-main) !important;
}
.modal-content label {
  color: var(--text-secondary) !important;
}
.modal-content input,
.modal-content select,
.modal-content textarea,
.modal-input {
  width: 100%;
  height: 40px;
  padding: 0 12px !important;
  background: var(--bg-card) !important;
  border: 1px solid var(--line) !important;
  color: var(--text-main) !important;
  border-radius: 8px !important;
  font-size: 14px !important;
  font-weight: 400 !important;
  box-sizing: border-box;
}
.modal-content select,
select.modal-input {
  padding-right: var(--select-chevron-pad) !important;
  background-image: var(--select-chevron) !important;

  background-position: right var(--select-chevron-inset) center !important;
  background-size: 12px 12px !important;
}
.modal-content textarea {
  height: auto;
  min-height: 88px;
  padding: 10px 12px !important;
  line-height: 1.5;
  resize: vertical;
}
.modal-content input:focus,
.modal-content select:focus,
.modal-content textarea:focus,
.modal-input:focus {
  border-color: var(--emerald-accent) !important;

  background: var(--bg-card) !important;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--emerald) 14%, transparent) !important;
}

  background: var(--bg-subtle) !important;
  border-color: var(--line) !important;
}
.modal-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: var(--control-h);
  padding: 0 var(--control-px);
  border-radius: var(--radius-control);
  font-size: var(--fs-btn);
  font-weight: var(--fw-btn);

  border: 1px solid var(--line);

.modal-btn:hover {

.modal-btn-primary {

.modal-choice {
  display: flex;
  align-items: flex-start;
  gap: 10px;

}

  border-color: var(--line-strong);

.modal-choice-title {
  font-size: 14px;

  color: var(--text-main);

}
.modal-choice-desc {
  font-size: 12px;

  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.svc-assign-footer-meta {
  margin-right: auto;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
}
.svc-assign-footer-meta strong {
  color: var(--text-main);
  font-weight: 650;
}
.svc-assign-modal .modal-footer {
  background: var(--bg-subtle);
}
@media (max-width: 700px) {
  .svc-assign-grid {
    grid-template-columns: 1fr;
  }
  .svc-assign-progress {
    width: 120px;
  }
}
.modal-console {
  background: #0F172A;
  color: #6EE7B7;
  padding: 14px 16px;
  border-radius: 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  border: 1px solid rgba(255,255,255,0.08);
}


/* ─── CANVAS CONTENT FLOW & LAYOUT RHYTHM ─── */
.canvas-content-flow {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 100%;
}

/* ─── EXECUTIVE CARDS & CONTAINERS ─── */
.clean-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 22px 24px;
  box-shadow: var(--shadow-card);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}
.clean-card:hover {
  border-color: var(--line-strong);
  box-shadow: none;
}

/* ─── CADENCE STRATEGY WIDGET (CLIENT WORKSPACES) ─── */
.cadence-widget {
  background: var(--bg-card);
  color: var(--text-main);
  border-radius: 12px;
  padding: 20px 24px;
  box-shadow: none;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
  overflow: hidden;
}
.cadence-widget::after {
  display: none;
}
.cadence-tag {
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--line);
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  display: inline-block;
}

/* ─── PRODUCT CARDS (WORKSPACES & CATALOG) ─── */
.product-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
  box-shadow: var(--shadow-card);
  position: relative;
}
.product-card:hover {
  border-color: var(--emerald);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
  transform: translateY(-2px);
}
.product-card.active-granted {
  border-color: var(--emerald-light);
  background: var(--bg-card);
}
:root[data-theme="dark"] .product-card.active-granted {
  border-color: rgba(0, 180, 138, 0.35);
}
.product-card.active-granted::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--cta-primary-bg);
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
}

/* Workspaces first-screen hero + card system */
.workspaces-hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.workspaces-eyebrow {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 6px;
}
.workspaces-hero .page-headline-lead {
  font-size: 22px !important;
  letter-spacing: -0.02em;
  color: var(--text-main);
}
:root[data-theme="dark"] .workspaces-hero .page-headline-lead {
  color: var(--text-main);
}
.workspaces-hero-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 2px;
}
.workspaces-meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 12px;
  border-radius: 9999px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  box-shadow: var(--shadow-pill);
}
.workspaces-meta-pill .meta-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--emerald) 20%, transparent);
}
.workspaces-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
@media (max-width: 900px) {
  .workspaces-grid {
    grid-template-columns: 1fr;
  }
}
.workspace-card {
  background: var(--bg-card);
  border: 0.75px solid var(--line);
  border-radius: 12px;
  padding: 18px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: none;
  transition: border-color 0.15s ease, background 0.15s ease;
  min-height: 168px;
}
.workspace-card:hover {
  border-color: var(--line-strong);
  box-shadow: none;
  transform: none;
  background: color-mix(in srgb, var(--bg-card) 92%, var(--bg-subtle));
}
.workspace-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.workspace-card-identity {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.workspace-card-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: var(--icon-gradient, var(--btn-primary-bg));
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 4px 10px -2px var(--icon-bloom, rgba(16, 185, 129, 0.35)), inset 0 1px 1px rgba(255, 255, 255, 0.4);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.workspace-card-icon i,
.workspace-card-icon i[data-lucide],
.workspace-card-icon svg,
.workspace-card-icon svg.lucide {
  width: 15px !important;
  height: 15px !important;
  color: #fff !important;
  stroke: #fff !important;
  filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.18));
}
.workspace-card-name {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: -0.02em;
  line-height: 1.25;
}
.workspace-card-stage {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  flex-shrink: 0;
}
.workspace-card-live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.01em;
}
.workspace-card-live .live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: none;
}
.workspace-card-role {
  margin: 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  line-height: 1.4;
}
.workspace-card-desc {
  margin: 0;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.5;
  flex: 1;
}
.workspace-status-block {
  margin-top: auto;
  padding-top: 4px;
}
.workspace-status-label {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.workspace-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.workspace-status-row .live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--emerald);
}
.workspace-status-bar {
  height: 5px;
  border-radius: 9999px;
  background: var(--bg-subtle-2);
  overflow: hidden;
}
.workspace-status-bar > span {
  display: block;
  height: 100%;
  width: 100%;
  border-radius: 9999px;
  background: var(--btn-primary-bg);
}
.workspace-launch-btn {
  width: auto;
  align-self: flex-start;
  height: 28px;
  margin-top: 4px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  background: transparent;
  border: none;
  border-radius: 0;
  color: var(--emerald-dark) !important;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: color 0.15s ease, gap 0.15s ease;
}
.workspace-launch-btn:hover {
  background: transparent;
  color: var(--text-main) !important;
  gap: 9px;
}
.workspace-launch-btn:active {
  transform: scale(0.96);
  opacity: 0.8;
}

/* ─── SOW MILESTONES PIPELINE ─── */
.pipeline-col {
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  min-height: 380px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.milestone-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  box-shadow: var(--shadow-card);
  transition: all 0.18s ease;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.milestone-card:hover {
  border-color: var(--line-strong);
  box-shadow: none;
  transform: none;
}

/* Initiatives — aligned with Support Desk / Team visual language */
.initiatives-table-wrap {
  width: 100%;
  overflow-x: auto;
  background: var(--bg-card);
}
.initiatives-table {
  --table-hover-green: rgba(16, 185, 129, 0.08);
  --table-hover-green-strong: rgba(16, 185, 129, 0.12);
  width: 100%;
  min-width: 0;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
  text-align: left;
  font-size: 13px;
}
.initiatives-table col.col-ini-name { width: 24%; }
.initiatives-table col.col-ini-practice { width: 16%; }
.initiatives-table col.col-ini-status { width: 14%; }
.initiatives-table col.col-ini-deliverable { width: 20%; }
.initiatives-table col.col-ini-target { width: 13%; }
.initiatives-table col.col-ini-actions { width: 13%; }
.initiatives-table thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: var(--table-row-pad-y) var(--table-row-pad-x);
  height: var(--table-row-min-h);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  border-bottom: 1px solid var(--line);
  background: #F7F9FC;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-sizing: border-box;
}
.initiatives-table tbody td {
  padding: var(--table-row-pad-y) var(--table-row-pad-x);
  height: var(--table-row-min-h);
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  color: var(--text-secondary);
  background: var(--bg-card);
  overflow: hidden;
  min-width: 0;
  box-sizing: border-box;
}
.initiatives-table tbody td > * {
  max-width: 100%;
}
.initiatives-table tbody tr:last-child td { border-bottom: none; }
.initiatives-table tbody tr {
  height: var(--table-row-min-h);
  cursor: pointer;
}
.initiatives-table tbody tr:hover td {
  background: var(--bg-subtle);
}
.initiatives-table tbody tr.sd-row-clickable:hover td {
  background: var(--table-hover-green, rgba(16, 185, 129, 0.08)) !important;
}
.ini-detail-panel {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
  overflow: hidden;
}
.ini-detail-section {
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
}
.ini-detail-section:last-child { border-bottom: none; }
.ini-detail-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.ini-detail-body {
  font-size: 14px;
  line-height: 1.55;
  color: var(--text-secondary);
}
.ini-detail-title {
  margin: 0;
  font-size: 15px;
  font-weight: 650;
  color: var(--text-main);
  letter-spacing: -0.01em;
}
.ini-progress {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.ini-progress-step {
  display: grid;
  grid-template-columns: 18px 1fr;
  gap: 12px;
  align-items: start;
}
.ini-progress-rail {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100%;
}
.ini-progress-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--bg-subtle-2);
  border: 2px solid var(--line-strong, var(--line));
  flex-shrink: 0;
  margin-top: 4px;
}
.ini-progress-step.is-done .ini-progress-dot,
.ini-progress-step.is-current .ini-progress-dot {
  background: var(--emerald, #10B981);
  border-color: var(--emerald, #10B981);
}
.ini-progress-line {
  width: 2px;
  flex: 1;
  min-height: 22px;
  background: var(--line);
  margin: 4px 0;
}
.ini-progress-step.is-done .ini-progress-line {
  background: color-mix(in srgb, var(--emerald, #10B981) 55%, var(--line));
}
.ini-progress-copy {
  padding-bottom: 16px;
}
.ini-progress-step:last-child .ini-progress-copy { padding-bottom: 0; }
.ini-progress-name {
  font-size: 13px;
  font-weight: 650;
  color: var(--text-main);
}
.ini-progress-step.is-upcoming .ini-progress-name { color: var(--text-muted); }
.ini-progress-meta {
  margin-top: 2px;
  font-size: 12px;
  color: var(--text-muted);
}
.ini-deliverable-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #F7F9FC;
}
:root[data-theme="dark"] .ini-deliverable-card {
  background: var(--bg-subtle);
}
.ini-deliverable-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--bg-card);
  border: 1px solid var(--line);
  color: var(--text-secondary);
  flex-shrink: 0;
}
.ini-deliverable-icon i,
.ini-deliverable-icon svg {
  width: 16px;
  height: 16px;
}

/* Initiative workspace (Fuel-structure, York light tokens) */
.ini-workspace {
  width: 100%;
  max-width: none;
}
.ini-ws-back-row {
  margin-bottom: 4px;
}
.ini-ws-meta .initiatives-status-pill {
  vertical-align: middle;
  margin-left: 2px;
}
.ini-ws-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 14px;
  padding: 18px 20px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background:
    radial-gradient(ellipse 60% 80% at 0% 0%, rgba(16, 185, 129, 0.08), transparent 55%),
    var(--bg-card);
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
}
.ini-ws-eyebrow {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.ini-ws-title {
  margin: 0;
  font-size: clamp(1.45rem, 2.4vw, 1.85rem);
  font-weight: 650;
  letter-spacing: -0.03em;
  color: var(--text-main);
  line-height: 1.2;
}
.ini-ws-meta {
  margin: 8px 0 0;
  font-size: 13px;
  color: var(--text-muted);
}
.ini-ws-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
  flex-shrink: 0;
}
.ini-delete-btn {
  color: #B91C1C !important;
  border-color: rgba(185, 28, 28, 0.28) !important;
}
.ini-delete-btn:hover {
  background: rgba(185, 28, 28, 0.06) !important;
}
.ini-close-btn {
  width: 32px;
  height: 32px;
}
.ini-progress-block {
  margin-bottom: 14px;
}
.ini-progress-strip {
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-card);
}
.ini-progress-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.ini-progress-count {
  font-size: 12px;
  font-weight: 550;
  color: var(--text-muted);
}
.ini-progress-track {
  height: 8px;
  border-radius: 999px;
  background: var(--bg-subtle-2, #E8EEF4);
  overflow: hidden;
  border: 1px solid var(--line);
}
.ini-progress-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #0F766E, var(--emerald, #10B981));
  transition: width 0.25s ease;
}
.ini-ws-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: 14px;
  align-items: stretch;
  margin-bottom: 14px;
}
.ini-panel {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 0;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.ini-panel-details { grid-column: 1; grid-row: 1; }
.ini-panel-milestones { grid-column: 2; grid-row: 1 / span 2; }
.ini-panel-advisors { grid-column: 1; grid-row: 2; }
.ini-panel-intel { grid-column: 1 / -1; grid-row: 3; }
.ini-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.ini-panel-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--emerald-dark, #0F766E);
}
.ini-panel-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.ini-field {
  width: 100%;
  min-height: 36px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background-color: var(--bg-subtle, #F7F9FC);
  color: var(--text-main);
  font-size: 13px;
  font-weight: 500;
  box-sizing: border-box;
}
select.ini-field {
  padding-right: var(--select-chevron-pad);
  background-image: var(--select-chevron);
  background-repeat: no-repeat;
  background-position: right var(--select-chevron-inset) center;
  background-size: 12px 12px;
}
.ini-field:focus {
  outline: none;
  border-color: color-mix(in srgb, var(--emerald, #10B981) 55%, var(--line));
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
}
.ini-textarea {
  min-height: 96px;
  resize: vertical;
  line-height: 1.5;
  font-weight: 400;
}
.ini-field-label {
  display: grid;
  gap: 6px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.ini-details-form {
  display: grid;
  gap: 12px;
}
.ini-details-top {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 0.7fr) minmax(0, 0.7fr);
  gap: 10px;
}
.ini-details-bottom {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
  gap: 16px;
}
.ini-details-read {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.ini-details-read > .ini-detail-body {
  margin: 0;
  padding: 0 0 2px;
}
.ini-details-meta-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px 20px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.ini-details-meta-grid > div {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ini-details-meta-grid .ini-detail-label {
  margin-bottom: 0;
}
.ini-details-meta-grid .ini-detail-body {
  margin: 0;
  font-size: 13px;
  font-weight: 550;
  color: var(--text-main);
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.ini-details-meta-grid .ini-owner-list {
  margin-bottom: 0;
}
.ini-due-row {
  display: grid;
  grid-template-columns: 1fr 1fr;

  display: flex;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: #F7F9FC;
  flex-wrap: wrap;
}
:root[data-theme="dark"] .mt-thread-tabs {
  background: var(--bg-subtle);
}
.mt-thread-tabs .bento-chip {
  margin: 0;
  background: var(--bg-card);
  border: 1px solid var(--line);
}
.mt-thread-tabs .bento-chip.active {
  border-color: color-mix(in srgb, var(--emerald) 35%, var(--line));
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
}
.mt-reply {
  border-top: 1px solid var(--line);
  padding: 16px;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  box-sizing: border-box;
}
:root[data-theme="dark"] .mt-reply {
  background: var(--bg-card);
}
.mt-thread-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 280px;
  background: var(--bg-card);
}
.mt-activity {
  font-size: 12px;
  color: var(--text-muted);
  padding: 2px 4px;
  line-height: 1.45;
}
.mt-activity strong { color: var(--text-secondary); font-weight: 650; }
.mt-msg {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #FAFBFC;
  padding: 14px;
}
:root[data-theme="dark"] .mt-msg {
  background: var(--bg-subtle);
  border-color: var(--line);
}
.mt-msg-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.mt-avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--avatar-radius);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: var(--bg-subtle-2);
  border: var(--avatar-border);
  flex-shrink: 0;
  overflow: hidden;
  padding: 0;
}
.mt-avatar.is-york {
  box-shadow: 0 0 0 2px color-mix(in srgb, #3B82F6 55%, transparent);
  border-color: transparent;
}
.mt-msg-name {
  font-size: 13px;
  font-weight: 650;
  color: var(--text-main);
}
.mt-msg-time {
  font-size: 12px;
  color: var(--text-muted);
}
.mt-msg-body {
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-secondary);
  white-space: pre-wrap;
}
.mt-reply-label {
  margin: 0;
  padding: 0;
  font-size: 13px;
  font-weight: 650;
  color: var(--text-main);
  line-height: 1.3;
}
.mt-reply textarea,
.mt-reply .mt-reply-input {
  display: block;
  width: 100%;
  max-width: 100%;
  margin: 0;
  min-height: 96px;
  height: auto;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #FFFFFF;
  padding: 12px;
  font-size: 13px;
  font-weight: 400;
  font-family: inherit;
  color: var(--text-main);
  box-sizing: border-box;
  outline: none;
  box-shadow: none;
  align-self: stretch;
}
:root[data-theme="dark"] .mt-reply textarea,
:root[data-theme="dark"] .mt-reply .mt-reply-input {
  background: var(--bg-card);
}
.mt-reply textarea:focus,
.mt-reply .mt-reply-input:focus {
  border-color: var(--line-strong, var(--line));
  box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.06);
  background: #FFFFFF;
}
.mt-reply-actions {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin: 0;
  padding: 0;
  width: 100%;
}
.mt-reply-actions .btn-saas-primary {
  margin: 0;
}
.mt-side-block {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.mt-side-block:last-child { border-bottom: none; }
.mt-side-label {
  display: block;
  margin-bottom: 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.mt-side-value {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}
.mt-side-row {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  align-items: center;
  column-gap: 12px;
  font-size: 12px;
  margin-top: 0;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  min-width: 0;
}
.mt-side-label + .mt-side-row,
.mt-side-block > .mt-side-row:first-child {
  border-top: none;
  padding-top: 0;
}
.mt-side-row span:first-child {
  color: var(--text-muted);
  font-weight: 600;
  line-height: 1.35;
}
.mt-side-row span:last-child {
  color: var(--text-main);
  font-weight: 600;
  text-align: left;
  line-height: 1.35;
  min-width: 0;
  word-break: break-word;
}
.mt-participant {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}
.mt-participant .mt-avatar { width: 28px; height: 28px; font-size: 10px; }
.mt-side-select {
  width: 100%;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background-color: var(--bg-subtle);
  color: var(--text-main);
  font-size: 13px;
  font-weight: 600;
  padding: 0 var(--select-chevron-pad) 0 10px;
}

/* Support Desk (client portal) */
.support-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 24px;
  border-radius: 16px;
  background: linear-gradient(135deg, #063828 0%, #084C36 55%, #0A5C42 100%);
  color: #ffffff;
  box-shadow: 0 12px 28px rgba(8, 76, 54, 0.28);
}
.support-hero-tags {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.support-hero-tag {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #A7F3D0;
}
.support-hero-sla {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 600;
  background: rgba(52, 211, 153, 0.18);
  border: 1px solid rgba(52, 211, 153, 0.35);
  color: #D1FAE5;
}
.support-hero-title {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.3;
  color: #ffffff;
}
.support-hero-desc {
  margin: 8px 0 0;
  font-size: 14px;
  line-height: 1.5;
  color: rgba(255, 255, 255, 0.78);
  max-width: 560px;
}
.support-raise-btn {
  flex-shrink: 0;
  height: 40px;
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: 10px;
  border: none;
  background: #ffffff;
  color: #063828;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  transition: transform 0.12s ease, background 0.15s ease;
}
.support-raise-btn:hover {
  background: #F0FDF4;
  transform: translateY(-1px);
}
.support-tickets-panel {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.support-tickets-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-subtle);
}
.support-tickets-title {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
}
.support-tickets-caption {
  font-size: 12px;
  color: var(--text-muted);
}
.support-ticket-list {
  display: flex;
  flex-direction: column;
}
.support-ticket-card {
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.support-ticket-card:last-child {
  border-bottom: none;
}
.support-ticket-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.support-ticket-badges {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.support-status-badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 9px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 600;
}
.support-status-badge.in_progress {
  background: var(--info-bg);
  color: var(--info-text);
  border: 1px solid color-mix(in srgb, var(--info-text) 28%, transparent);
}
.support-status-badge.resolved {
  background: var(--ok-bg);
  color: var(--ok-text);
  border: 1px solid color-mix(in srgb, var(--ok-text) 28%, transparent);
}
.support-status-badge.open,
.support-status-badge.new {
  background: var(--warn-bg);
  color: var(--warn-text);
  border: 1px solid color-mix(in srgb, var(--warn-text) 28%, transparent);
}
.support-product-badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 9px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--line);
}
.support-ticket-title {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: -0.02em;
  line-height: 1.35;
}
.support-ticket-id {
  color: var(--text-faint);
  font-weight: 600;
}
.support-ticket-time {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--text-muted);
  padding-top: 2px;
  white-space: nowrap;
}
.support-ticket-desc {
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.support-ticket-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  font-size: 12px;
  color: var(--text-muted);
}
.support-ticket-meta strong {
  color: var(--text-secondary);
  font-weight: 600;
}
.support-ticket-meta .sev-high { color: #B91C1C; }
.support-ticket-meta .sev-medium { color: #C2410C; }
.support-ticket-meta .sev-low { color: var(--emerald-dark); }
.support-york-response {
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--emerald-subtle);
  border: 1px solid var(--emerald-light);
}
.support-york-response-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--emerald-dark);
  margin-bottom: 4px;
}
.support-york-response-text {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.support-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-muted);
}
@media (max-width: 800px) {
  .support-hero {
    flex-direction: column;
    align-items: flex-start;
  }
  .support-tickets-header {
    flex-direction: column;
    align-items: flex-start;
  }
}

/* Team & Access — assign matrix on member detail */
.team-access-matrix {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
@media (max-width: 720px) {
  .team-access-matrix {
    grid-template-columns: 1fr;
  }
}
.team-access-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-card);
  min-width: 0;
}
.team-access-row.is-on {
  border-color: color-mix(in srgb, var(--emerald, #10B981) 35%, var(--line));
  background: color-mix(in srgb, var(--emerald, #10B981) 6%, var(--bg-card));
}
.team-access-row.is-locked {
  background: #F7F9FC;
}
:root[data-theme="dark"] .team-access-row.is-locked {
  background: var(--bg-subtle);
}
.team-access-row-main {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.team-access-row-copy { min-width: 0; }
.team-access-row-name {
  font-size: 13.5px;
  font-weight: 650;
  color: var(--text-main);
}
.team-access-row-meta {
  margin-top: 2px;
  font-size: 12px;
  color: var(--text-muted);
}
.team-access-toggle {
  flex-shrink: 0;
  height: 32px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
}
.team-access-toggle.is-on {
  background: color-mix(in srgb, var(--emerald, #10B981) 12%, var(--bg-card));
  border-color: color-mix(in srgb, var(--emerald, #10B981) 40%, var(--line));
  color: var(--ok-text, #047857);
}
.team-access-toggle:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}
.team-access-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-width: 320px;
}
.team-access-chip {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--line);
  background: var(--bg-subtle-2);
  color: var(--text-secondary);
  white-space: nowrap;
}
.team-access-chip.is-on {
  background: color-mix(in srgb, var(--emerald, #10B981) 12%, var(--bg-card));
  border-color: color-mix(in srgb, var(--emerald, #10B981) 30%, var(--line));
  color: var(--ok-text, #047857);
}
.team-access-chip.is-more {
  background: var(--bg-card);
  color: var(--text-muted);
}
.team-access-surface {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 18px 16px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.team-access-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.team-access-toolbar-title {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: -0.01em;
}
.team-access-toolbar-meta {
  margin: 3px 0 0;
  font-size: 13px;
  color: var(--text-muted);
}
.team-access-legend {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-muted);
}
.team-access-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.team-access-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--line-strong);
}
.team-access-dot.on {
  background: var(--emerald, #10B981);
}
.team-access-dot.lock {
  background: var(--text-secondary);
}
.team-member-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 980px) {
  .team-member-grid {
    grid-template-columns: 1fr;
  }
}
.team-member-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
}
.team-member-card:hover {
  border-color: var(--line-strong);
  box-shadow: var(--shadow-card-hover, 0 8px 20px rgba(15, 23, 42, 0.06));
  transform: translateY(-1px);
}
.team-member-card.is-owner {
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--emerald-subtle, #ECFDF5) 70%, var(--bg-card)) 0%, var(--bg-card) 58%);
}
:root[data-theme="dark"] .team-member-card.is-owner {
  background:
    linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, var(--bg-card) 58%);
}
.team-member-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.team-member-identity {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}
.team-member-avatar {
  width: 40px;
  height: 40px;
  border-radius: var(--avatar-radius);
  background: var(--bg-subtle-2);
  color: var(--text-secondary);
  border: var(--avatar-border);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 650;
  flex-shrink: 0;
  overflow: hidden;
  padding: 0;
}
.team-member-card.is-owner .team-member-avatar,
.team-member-avatar.is-owner {
  background: var(--bg-subtle-2);
  color: var(--text-secondary);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--emerald) 45%, transparent);
  border-color: transparent;
}
.team-member-name {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.3;
}
.team-member-meta {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 260px;
}
.team-member-role {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
  flex-shrink: 0;
}
.team-member-role.owner {
  background: color-mix(in srgb, var(--emerald-subtle, #ECFDF5) 80%, white);
  color: var(--emerald-dark, #047857);
  border-color: color-mix(in srgb, var(--emerald, #10B981) 28%, transparent);
}
:root[data-theme="dark"] .team-member-role.owner {
  background: rgba(16, 185, 129, 0.16);
  color: #6EE7B7;
  border-color: rgba(110, 231, 183, 0.28);
}
.team-member-coverage {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.team-member-coverage-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.team-member-coverage-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
}
.team-member-coverage-value {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.team-member-coverage-value.full {
  color: var(--emerald-dark, #047857);
}
.team-member-coverage-value.none {
  color: var(--text-muted);
  font-weight: 500;
}
.team-member-bar {
  height: 6px;
  border-radius: 999px;
  background: var(--bg-subtle-2);
  overflow: hidden;
}
.team-member-bar > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #059669 0%, #10B981 55%, #34D399 100%);
}
.team-member-services-label {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.team-member-services {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.team-service-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 550;
  cursor: default;
  transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s;
}
.team-service-chip.on {
  background: color-mix(in srgb, var(--emerald-subtle, #ECFDF5) 85%, white);
  border-color: color-mix(in srgb, var(--emerald, #10B981) 35%, transparent);
  color: var(--emerald-dark, #047857);
}
:root[data-theme="dark"] .team-service-chip.on {
  background: rgba(16, 185, 129, 0.16);
  border-color: rgba(110, 231, 183, 0.3);
  color: #6EE7B7;
}
.team-service-chip.off {
  background: var(--bg-subtle);
  border-color: var(--line);
  color: var(--text-muted);
}
.team-service-chip.locked {
  cursor: default;
  background: var(--bg-subtle-2);
  border-color: var(--line-strong);
  color: var(--text-main);
}
.team-service-chip.is-editable {
  cursor: pointer;
}
.team-service-chip.is-editable:hover {
  border-color: var(--line-strong);
  color: var(--text-main);
  background: var(--bg-subtle-2);
}
.team-service-chip.is-editable.on:hover {
  border-color: color-mix(in srgb, var(--emerald, #10B981) 50%, transparent);
}
.team-service-chip.is-pending-grant {
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--emerald, #10B981) 22%, transparent);
}
.team-service-chip.is-pending-revoke {
  box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.22);
  border-color: rgba(239, 68, 68, 0.35);
  color: #B91C1C;
  background: #FEF2F2;
}
:root[data-theme="dark"] .team-service-chip.is-pending-revoke {
  background: rgba(239, 68, 68, 0.12);
  color: #FCA5A5;
  border-color: rgba(248, 113, 113, 0.35);
}
.team-service-chip i,
.team-service-chip svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}
.team-member-card.is-editing {
  border-color: color-mix(in srgb, var(--emerald, #10B981) 35%, var(--line));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--emerald, #10B981) 12%, transparent);
}
.team-member-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 2px;
}
.team-member-actions-hint {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.35;
}
.team-member-actions-btns {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.team-member-actions .btn-saas-primary {
  flex-shrink: 0;
}
.team-access-empty {
  grid-column: 1 / -1;
  padding: 36px 20px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 14px;
  background: var(--bg-subtle);
}
.team-access-empty-title {
  margin: 0 0 4px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
}
.team-access-empty-copy {
  margin: 0 0 14px;
  font-size: 13px;
  color: var(--text-muted);
}
.team-access-note {
  margin: 0;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
}
.team-invite-services {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
.team-invite-service {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  max-width: 100%;
  padding: 6px 12px 6px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 12.5px;
  font-weight: 550;
  line-height: 1.25;
  cursor: pointer;
  user-select: none;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
}
.team-invite-service input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  width: 0;
  height: 0;
}
.team-invite-service__check {
  width: 16px;
  height: 16px;
  min-width: 16px;
  border-radius: 5px;
  border: 1.5px solid var(--line-strong, var(--line));
  background: var(--bg-subtle);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: transparent;
  transition: all 0.15s ease;
}
.team-invite-service__check svg {
  width: 10px;
  height: 10px;
  stroke-width: 2.5;
}
.team-invite-service__name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
}
.team-invite-service:hover {
  border-color: color-mix(in srgb, var(--emerald, #10B981) 28%, var(--line));
  color: var(--text-main);
}
.team-invite-service:has(input:checked) {
  background: var(--emerald-subtle, #ECFDF5);
  border-color: color-mix(in srgb, var(--emerald, #10B981) 40%, transparent);
  color: var(--emerald-dark, #047857);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--emerald, #10B981) 10%, transparent);
}
.team-invite-service:has(input:checked) .team-invite-service__check {
  background: var(--emerald, #10B981);
  border-color: var(--emerald, #10B981);
  color: #fff;
}
:root[data-theme="dark"] .team-invite-service,
.dark .team-invite-service {
  background: var(--bg-subtle);
}
:root[data-theme="dark"] .team-invite-service:has(input:checked),
.dark .team-invite-service:has(input:checked) {
  background: rgba(16, 185, 129, 0.14);
  border-color: rgba(110, 231, 183, 0.35);
  color: #6EE7B7;
  box-shadow: none;
}
:root[data-theme="dark"] .team-invite-service:has(input:checked) .team-invite-service__check,
.dark .team-invite-service:has(input:checked) .team-invite-service__check {
  background: #10B981;
  border-color: #10B981;
  color: #052e1c;
}

/* ─── THREAT SIGNALS ─── */
.threat-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow-card);
  transition: all 0.2s ease;
}
.threat-card:hover {
  border-color: var(--line-strong);
  box-shadow: none;
}
.counter-strategy-box {
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
}

/* ─── PERKS CATALOG ─── */
.perk-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-card);
  min-height: 220px;
}
.perk-card:hover {
  transform: translateY(-2px);
  border-color: var(--emerald);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
}
.savings-bar-container {
  height: 8px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 9999px;
  overflow: hidden;
  position: relative;
}
.savings-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #10B981 0%, #34D399 100%);
  border-radius: 9999px;
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ─── BADGES ─── */
.badge-in-path {
  background-color: var(--emerald-subtle);
  color: var(--emerald-dark);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 9999px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid rgba(0, 180, 138, 0.3);
}
.badge-in-path::before {
  content: "";
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background-color: var(--emerald);
}

.badge-member-access {
  background-color: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 9999px;
  border: 1px solid var(--line);
}

/* York Suite catalog (client portal) */
.eco-panel {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow-card);
  padding: 22px 22px 20px;
}
.eco-panel-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}
.eco-eyebrow {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.eco-title {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-main);
  line-height: 1.25;
}
.eco-hint {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  padding-bottom: 4px;
  white-space: nowrap;
}
.eco-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}
.eco-filter-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.eco-filter-btn:hover {
  border-color: var(--line-strong);
  color: var(--text-main);
}
.eco-filter-btn.active {
  background: var(--bg-subtle-2);
  border-color: var(--line-strong);
  color: var(--text-main);
  font-weight: 500;
}
.eco-filter-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-subtle-2);
  color: var(--text-muted);
}
.eco-filter-btn.active .eco-filter-count {
  background: var(--bg-card);
  color: var(--text-muted);
}
.eco-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.eco-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 168px;
  box-shadow: var(--shadow-card);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.eco-card:hover {
  border-color: var(--line-active);
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-2px);
}
.eco-card-stage {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.eco-card-name {
  margin: 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-main);
  letter-spacing: -0.01em;
  line-height: 1.3;
}
.eco-card-desc {
  margin: 0;
  font-size: 14px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.5;
  flex: 1;
}
.eco-card-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.eco-available {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}
.eco-workspace-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  padding: 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--emerald-dark);
  cursor: pointer;
}
.eco-workspace-link:hover {
  color: #084C36;
}
.eco-request-btn {
  height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.eco-request-btn:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
  border-color: var(--line-strong);
}
@media (max-width: 1100px) {
  .eco-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 700px) {
  .eco-panel-top {
    flex-direction: column;
    align-items: flex-start;
  }
  .eco-grid {
    grid-template-columns: 1fr;
  }
}

// Helper: Calculate Syndicate Perk Savings for a client
function getClientPerkSavings(client) {
  const claimedIds = client.claimedPerks || [];
  let claimedTotal = 0;
  let totalAvailable = 0;
  SYNDICATE_PERKS_CATALOG.forEach(perk => {
    totalAvailable += perk.valueNumber;
    if (claimedIds.includes(perk.id)) {
      claimedTotal += perk.valueNumber;
    }
  });
  const remainingTotal = Math.max(0, totalAvailable - claimedTotal);
  const pct = Math.round((claimedTotal / (totalAvailable || 1)) * 100);
  return {
    claimedTotal,
    remainingTotal,
    totalAvailable,
    pct,
    claimedCount: claimedIds.length,
    totalCount: SYNDICATE_PERKS_CATALOG.length
  };
}

const YORK_EMPLOYEES = [
  { id: 'emp-kyle', name: 'Kyle York', title: 'Partner & Strategic Advisory' },
  { id: 'emp-mike', name: 'Mike Veilleux', title: 'Partner & GTM Practice Lead' },
  { id: 'emp-alex', name: 'Alex Tremblay', title: 'VP Engineering' },
  { id: 'emp-priya', name: 'Priya Patel', title: 'Principal Market Analyst' }
];

function getYorkEmployeeOptions(selectedName) {
  const selected = String(selectedName || '').trim();
  const known = YORK_EMPLOYEES.map(e => {
    const label = `${e.name} · ${e.title}`;
    const isOn = selected === e.name || selected.startsWith(e.name);
    return `<option value="${e.name}"${isOn ? ' selected' : ''}>${label}</option>`;
  }).join('');
  if (selected && !YORK_EMPLOYEES.some(e => e.name === selected || selected.startsWith(e.name))) {
    return `<option value="${selected}" selected>${selected}</option>${known}`;
  }
  return known;
}

function getYorkEmployeeByName(name) {
  const selected = String(name || '').trim();
  if (!selected) return null;
  return YORK_EMPLOYEES.find(e => e.name === selected || selected.startsWith(e.name))
    || { name: selected, title: 'Product Strategist' };
}

function escapePsAttr(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function canEditProductStrategist() {
  const role = app?.currentUser?.role;
  return role === 'admin' || role === 'client_owner';
}

function renderPsPersonAvatar(name, sizeClass = 'ps-combo-avatar') {
  return renderUserAvatar(name || 'User', sizeClass);
}

function renderProductStagePill(productOrStage) {
  const stageRaw = typeof productOrStage === 'string'
    ? productOrStage
    : (productOrStage?.stage || productOrStage?.stageClass || '');
  const key = String(
    (typeof productOrStage === 'object' && productOrStage?.stageClass)
      ? productOrStage.stageClass
      : stageRaw
  ).toLowerCase().trim();
  const label = String(stageRaw || key || '—').toUpperCase();
  const safeKey = ['decide', 'execute', 'measure', 'assess', 'operate'].includes(key) ? key : 'operate';
  return `<span class="ws-stage-pill is-${safeKey}">${label}</span>`;
}

function renderProductStrategistReadonly(selected) {
  const emp = getYorkEmployeeByName(selected);
  if (!emp) {
    return `<span class="sd-email">Unassigned</span>`;
  }
  return `
    <div class="ps-combo-readonly">
      ${renderPsPersonAvatar(emp.name, 'ps-combo-avatar')}
      <div class="ps-combo-trigger-copy">
        <div class="ps-combo-trigger-name">${escapePsAttr(emp.name)}</div>
        <div class="ps-combo-trigger-meta">${escapePsAttr(emp.title || 'Product Strategist')}</div>
      </div>
    </div>
  `;
}

function renderProductStrategistSelect({
  id,
  selected = '',
  mode = 'modal',
  ref = '',
  ariaLabel = 'Product Strategist',
  width = '100%'
} = {}) {
  const sel = String(selected || '').trim();
  const emp = getYorkEmployeeByName(sel);
  const options = [
    { value: '', name: 'Unassigned', title: 'Clear Product Strategist', clear: true },
    ...YORK_EMPLOYEES.map(e => ({ value: e.name, name: e.name, title: e.title }))
  ];
  if (sel && !YORK_EMPLOYEES.some(e => e.name === sel || sel.startsWith(e.name))) {
    options.splice(1, 0, { value: sel, name: sel, title: 'Current assignment' });
  }
  const optsHtml = options.map(o => `
    <button
      type="button"
      class="ps-combo-option${o.value === sel ? ' is-selected' : ''}"
      role="option"
      data-value="${escapePsAttr(o.value)}"
      data-search="${escapePsAttr(`${o.name} ${o.title}`.toLowerCase())}"
      onclick="event.stopPropagation(); pickProductStrategist('${id}', this.getAttribute('data-value'))"
    >
      ${o.clear
        ? `<span class="ps-combo-option-avatar is-clear" aria-hidden="true">—</span>`
        : renderPsPersonAvatar(o.name, 'ps-combo-avatar')}
      <span class="ps-combo-option-copy">
        <span class="ps-combo-option-name">${o.name}</span>
        <span class="ps-combo-option-title">${o.title}</span>
      </span>
    </button>
  `).join('');

  const triggerInner = emp ? `
    ${renderPsPersonAvatar(emp.name, 'ps-combo-avatar')}
    <span class="ps-combo-trigger-copy">
      <span class="ps-combo-trigger-name">${escapePsAttr(emp.name)}</span>
      <span class="ps-combo-trigger-meta">${escapePsAttr(emp.title || 'Product Strategist')}</span>
    </span>
  ` : `
    <span class="ps-combo-option-avatar is-clear" aria-hidden="true">+</span>
    <span class="ps-combo-trigger-copy">
      <span class="ps-combo-trigger-name">Assign strategist</span>
      <span class="ps-combo-trigger-meta is-placeholder">Search &amp; select</span>
    </span>
  `;

  return `
    <div

    >
      <input type="hidden" id="${id}" value="${escapePsAttr(sel)}" />
      <button
        type="button"
        class="ps-combo-trigger"
        id="${id}-trigger"
        aria-label="${escapePsAttr(ariaLabel)}"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-controls="${id}-menu"
        onclick="event.stopPropagation(); openProductStrategistCombo('${id}')"
      >
        ${triggerInner}
        <i data-lucide="chevron-down" class="ps-combo-chevron" aria-hidden="true"></i>
      </button>
      <div class="ps-combo-menu" id="${id}-menu" hidden role="listbox" aria-label="${escapePsAttr(ariaLabel)}">

          <i data-lucide="search" class="ps-combo-search-icon" aria-hidden="true"></i>

            type="text"
            class="ps-combo-input"
            id="${id}-input"
            placeholder="Search by name or role..."
            aria-label="Search Product Strategist"
            autocomplete="off"
            oninput="filterProductStrategistCombo('${id}', this.value)"
            onkeydown="productStrategistComboKeydown(event, '${id}')"
            onclick="event.stopPropagation()"
          />

          ${optsHtml}
          <div class="ps-combo-empty" hidden>No matches</div>
        </div>
      </div>
    </div>
  `;
}

function closeAllProductStrategistCombos(exceptId) {
  document.querySelectorAll('.ps-combo.is-open').forEach(wrap => {
    const id = wrap.getAttribute('data-ps-id');
    if (exceptId && id === exceptId) return;
    wrap.classList.remove('is-open');
    const menu = document.getElementById(`${id}-menu`);
    const trigger = document.getElementById(`${id}-trigger`);
    const input = document.getElementById(`${id}-input`);
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
    if (menu) {
      menu.hidden = true;
      menu.classList.remove('is-fixed');
      menu.style.top = '';
      menu.style.left = '';
      menu.style.width = '';
      menu.style.minWidth = '';
      menu.style.right = '';
    }
    if (input) input.value = '';
  });
}

function positionProductStrategistMenu(id) {
  const wrap = document.getElementById(`ps-wrap-${id}`);
  const menu = document.getElementById(`${id}-menu`);
  const trigger = wrap?.querySelector('.ps-combo-trigger');
  if (!wrap || !menu || !trigger) return;
  const rect = trigger.getBoundingClientRect();
  const width = Math.max(rect.width, 280);
  let top = rect.bottom + 6;
  let left = rect.left;
  menu.classList.add('is-fixed');
  menu.style.width = `${width}px`;
  menu.style.minWidth = `${Math.min(width, 280)}px`;
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
  menu.style.right = 'auto';
  const mRect = menu.getBoundingClientRect();
  if (mRect.bottom > window.innerHeight - 8) {
    top = Math.max(8, rect.top - mRect.height - 6);
    menu.style.top = `${top}px`;
  }
  if (left + width > window.innerWidth - 8) {
    left = Math.max(8, window.innerWidth - width - 8);
    menu.style.left = `${left}px`;
  }
}

function openProductStrategistCombo(id) {
  closeAllProductStrategistCombos(id);
  const wrap = document.getElementById(`ps-wrap-${id}`);
  const menu = document.getElementById(`${id}-menu`);
  const trigger = document.getElementById(`${id}-trigger`);
  if (!wrap || !menu) return;
  wrap.classList.add('is-open');
  menu.hidden = false;
  if (trigger) trigger.setAttribute('aria-expanded', 'true');
  const input = document.getElementById(`${id}-input`);
  if (input) input.value = '';
  filterProductStrategistCombo(id, '');
  positionProductStrategistMenu(id);
  requestAnimationFrame(() => {
    positionProductStrategistMenu(id);
    if (input) input.focus();
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  });
}

function filterProductStrategistCombo(id, query) {
  const wrap = document.getElementById(`ps-wrap-${id}`);
  const menu = document.getElementById(`${id}-menu`);
  if (!menu) return;
  if (wrap && !wrap.classList.contains('is-open')) {
    wrap.classList.add('is-open');
    menu.hidden = false;
  }
  const q = String(query || '').trim().toLowerCase();
  let visible = 0;
  menu.querySelectorAll('.ps-combo-option').forEach(opt => {
    const hay = opt.getAttribute('data-search') || '';
    const isClear = opt.getAttribute('data-value') === '';
    const match = !q ? true : (isClear ? 'unassigned'.includes(q) : hay.includes(q));
    opt.hidden = !match;
    if (match) visible += 1;
  });
  const empty = menu.querySelector('.ps-combo-empty');
  if (empty) empty.hidden = visible > 0;
  menu.querySelectorAll('.ps-combo-option.is-active').forEach(el => el.classList.remove('is-active'));
  if (!menu.hidden) positionProductStrategistMenu(id);
}

function pickProductStrategist(id, value) {
  const wrap = document.getElementById(`ps-wrap-${id}`);
  const hidden = document.getElementById(id);
  const next = String(value || '');
  if (hidden) hidden.value = next;
  closeAllProductStrategistCombos();
  const mode = wrap?.getAttribute('data-ps-mode') || 'modal';
  const ref = wrap?.getAttribute('data-ps-ref') || '';
  if (mode === 'company-add') {
    app.setCompanyAddStrategist(ref, next);
  } else if (mode === 'product') {
    const [clientId, productId] = ref.split('|');
    if (clientId && productId) app.assignProductEmployee(clientId, productId, next);
  } else if (mode === 'modal' && typeof updateAddCompanyPreview === 'function') {
    updateAddCompanyPreview();
    // Refresh trigger label in modal without full page render
    const emp = getYorkEmployeeByName(next);
    const trigger = document.getElementById(`${id}-trigger`);
    if (trigger) {
      trigger.innerHTML = emp ? `
        ${renderPsPersonAvatar(emp.name, 'ps-combo-avatar')}
        <span class="ps-combo-trigger-copy">
          <span class="ps-combo-trigger-name">${escapePsAttr(emp.name)}</span>
          <span class="ps-combo-trigger-meta">${escapePsAttr(emp.title || 'Product Strategist')}</span>
        </span>
        <i data-lucide="chevron-down" class="ps-combo-chevron" aria-hidden="true"></i>
      ` : `
        <span class="ps-combo-option-avatar is-clear" aria-hidden="true">+</span>
        <span class="ps-combo-trigger-copy">
          <span class="ps-combo-trigger-name">Assign strategist</span>
          <span class="ps-combo-trigger-meta is-placeholder">Search &amp; select</span>
        </span>
        <i data-lucide="chevron-down" class="ps-combo-chevron" aria-hidden="true"></i>
      `;
      if (window.lucide) window.lucide.createIcons();
    }
  }
}

function productStrategistComboKeydown(event, id) {
  const menu = document.getElementById(`${id}-menu`);
  if (!menu) return;
  const options = Array.from(menu.querySelectorAll('.ps-combo-option:not([hidden])'));
  const active = menu.querySelector('.ps-combo-option.is-active');
  let idx = active ? options.indexOf(active) : -1;
  if (event.key === 'ArrowDown') {
    event.preventDefault();
    openProductStrategistCombo(id);
    idx = Math.min(options.length - 1, idx + 1);
    options.forEach((o, i) => o.classList.toggle('is-active', i === idx));
    options[idx]?.scrollIntoView({ block: 'nearest' });
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    openProductStrategistCombo(id);
    idx = Math.max(0, idx - 1);
    options.forEach((o, i) => o.classList.toggle('is-active', i === idx));
    options[idx]?.scrollIntoView({ block: 'nearest' });
  } else if (event.key === 'Enter') {
    event.preventDefault();
    const target = options[idx] || options[0];
    if (target) pickProductStrategist(id, target.getAttribute('data-value') || '');
  } else if (event.key === 'Escape') {
    event.preventDefault();
    closeAllProductStrategistCombos();
  }
}

if (typeof window !== 'undefined' && !window.__yorkPsComboBound) {
  window.__yorkPsComboBound = true;
  document.addEventListener('click', (e) => {
    if (e.target && e.target.closest && (e.target.closest('.ps-combo') || e.target.closest('.ps-combo-menu'))) return;
    closeAllProductStrategistCombos();
  });
  window.addEventListener('resize', () => closeAllProductStrategistCombos());
  document.addEventListener('scroll', () => {
    const open = document.querySelector('.ps-combo.is-open');
    if (!open) return;
    const id = open.getAttribute('data-ps-id');
    if (id) positionProductStrategistMenu(id);
  }, true);
}

function getCompanyNotes(client) {
  if (!client) return [];
  if (Array.isArray(client.companyNotes) && client.companyNotes.length) {
    return client.companyNotes;
  }
  return (client.blockers || []).map(b => ({
    id: b.id,
    title: b.title || 'Note',
    body: b.description || '',
    status: b.status === 'resolved' ? 'resolved' : 'open',
    createdAt: b.reportedDate || b.createdAt || '—',
    author: b.yorkAssignee || b.owner || 'Admin',
    severity: b.severity || 'medium'
  }));
}

function ensureCompanyNotes(client) {
  if (!client) return [];
  if (!Array.isArray(client.companyNotes)) {
    client.companyNotes = getCompanyNotes(client);
  }
  return client.companyNotes;
}

// Token calculation helpers (Tokens, not credits)
function getCompanyTokens(client) {
  if (!client) return { allocated: 25000, total: 25000, used: 0, percent: 0, balance: 25000 };
  if (client.tokenUsage && typeof client.tokenUsage.allocated === "number") {
    const allocated = client.tokenUsage.allocated || 25000;
    const used = client.tokenUsage.used || 0;
    const percent = Math.min(100, Math.round((used / allocated) * 100));
    return { allocated, total: allocated, used, percent, balance: allocated - used };
  }
  const map = {
    "client-cloudscale": { allocated: 60000, used: 38450 },
    "client-novubio": { allocated: 35000, used: 18200 },
    "client-apexfin": { allocated: 25000, used: 5000 },
    "client-datastream": { allocated: 25000, used: 0 },
    "client-biogenix": { allocated: 15000, used: 0 },
    "client-krypton": { allocated: 20000, used: 0 },
    "client-veloce": { allocated: 25000, used: 0 },
    "client-omnihealth": { allocated: 30000, used: 0 },
    "client-aerosphere": { allocated: 25000, used: 0 }
  };
  const item = map[client.id] || { allocated: 25000, used: 0 };
  const percent = Math.min(100, Math.round((item.used / item.allocated) * 100));
  return { allocated: item.allocated, total: item.allocated, used: item.used, percent, balance: item.allocated - item.used };
}

function getPortfolioTokenTotals() {
  let totalAllocated = 0;
  let totalUsed = 0;
  app.clients.forEach(c => {
    const t = getCompanyTokens(c);
    totalAllocated += t.allocated;
    totalUsed += t.used;
  });
  const percent = totalAllocated > 0 ? Math.round((totalUsed / totalAllocated) * 100) : 0;
  return { totalAllocated, totalUsed, percent, totalRemaining: totalAllocated - totalUsed };
}

  confirmAddSelectedCompanies() {
    const selected = new Set(this.companyAddSelected || []);
    if (!selected.size) {
      if (typeof showToast === 'function') showToast('Select at least one company to add.', 'info');
      return;
    }
    const candidates = getCompanyDirectoryCandidates();
    const picked = candidates.filter(c => selected.has(c.id));
    const strategists = this.companyAddStrategists || {};
    let added = 0;
    picked.forEach(c => {
      const created = this.addCompany({
        name: c.name,
        domain: c.domain,
        ownerName: c.ownerName,
        ownerEmail: c.ownerEmail,
        industry: c.meta || 'B2B Software',
        yorkAssignee: strategists[c.id] || '',
        productStrategist: strategists[c.id] || ''
      }, { silent: true });
      if (created) added += 1;
      const deal = (this.hubspotDeals || []).find(d => d.id === c.id);
      if (deal && created) {
        deal.invited = true;
        deal.clientId = created.id;
      }
    });
    this.companyAddSelected = [];
    this.companyAddQuery = '';
    this.companyAddLetter = 'all';
    this.companyAddStrategists = {};
    this.companyAddOpen = false;
    this.adminFilterStatus = 'inactive';
    this.saveState();
    render();
    if (typeof showToast === 'function') {
      showToast(added === 1
        ? `Added ${picked[0].name}. Send an invite to provision services.`
        : `Added ${added} companies. Send invites to provision services.`, 'success');
    }
  }

    const yorkAssignee = (companyData.yorkAssignee || companyData.productStrategist || companyData.assignedEmployee || '').trim();
    const newClient = {
      id: 'client-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
      name: companyData.name.trim(),
      domain: companyData.domain.trim() || (companyData.name.toLowerCase().replace(/[^a-z0-9]/g, '') + '.io'),
      ownerName: (companyData.ownerName || '').trim() || 'Primary Contact',
      ownerEmail: (companyData.ownerEmail || '').trim() || ('contact@' + ((companyData.domain || 'company.io').trim())),
      status: 'pending_invite',
      industry: companyData.industry || 'B2B Software',
      yorkLead: yorkAssignee || companyData.yorkLead || 'Kyle York & Mike Veilleux',
      yorkAssignee: yorkAssignee || '',
      productStrategist: yorkAssignee || '',
      grantedProducts: [],
      serviceAdoption: {},
      productAssignees: {},
      supportTickets: [],
      blockers: [],
      companyNotes: [],

    });

    render();

    }).join(", ");
    if (typeof showToast === 'function') {

  addTicketReply(clientId, ticketId, body) {
    const client = this.clients.find(c => c.id === clientId) || this.getCurrentClient();
    if (!client?.supportTickets) return;
    const ticket = client.supportTickets.find(t => t.id === ticketId);
    if (!ticket) return;
    const textBody = String(body || '').trim();
    if (!textBody) {
      if (typeof showToast === 'function') showToast('Write a reply before sending.', 'info');
      return;
    }
    ensureTicketThread(ticket, client);
    const isAdmin = this.currentUser?.role === 'admin';
    const author = this.currentUser?.name || client.ownerName || 'You';
    ticket.comments.push({
      id: 'cmt-' + Date.now(),
      type: 'message',
      author,
      authorRole: isAdmin ? 'york' : 'client',
      body: textBody,
      createdAt: 'Just now'
    });
    ticket.updatedAt = 'Just now';
    if (ticket.status === 'open' && isAdmin) ticket.status = 'in_progress';
    this.saveState();
    render();
    if (typeof showToast === 'function') showToast('Reply sent.', 'success');
  }

  setClientTicketStatus(clientId, ticketId, newStatus) {
    if (this.currentUser?.role !== 'admin') {
      if (typeof showToast === 'function') showToast('Only York assignees can change ticket status.', 'info');
      return;
    }
    const client = this.clients.find(c => c.id === clientId) || this.getCurrentClient();
    if (!client?.supportTickets) return;
    const ticket = client.supportTickets.find(t => t.id === ticketId);
    if (!ticket) return;
    const prev = ticket.status;
    if (prev === newStatus) return;
    ensureTicketThread(ticket, client);
    const actor = this.currentUser?.name || ticket.yorkAssignee || 'York Specialist';
    ticket.comments.push({
      id: 'act-' + Date.now(),
      type: 'activity',
      author: actor,
      body: `changed the status from ${ticketStatusLabel(prev).toUpperCase()} to ${ticketStatusLabel(newStatus).toUpperCase()}`,
      createdAt: 'Just now'
    });
    ticket.status = newStatus;
    ticket.updatedAt = 'Just now';
    if (newStatus === 'resolved') ticket.resolvedAt = 'Just now';
    this.saveState();
    render();
    if (typeof showToast === 'function') showToast(`Ticket marked ${ticketStatusLabel(newStatus)}.`, 'success');
  }

    ensureInitiativeDetail(ms, client);
    const titleEl = document.getElementById('ini-detail-title');
