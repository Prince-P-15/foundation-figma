    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class'
      };
    }
  </script>
  
  <script>
    (function(){
      try {
        var params = new URLSearchParams(window.location.search || '');
        var forceAuth = params.get('auth') === '1';
        var sessionActive = sessionStorage.getItem('york_session_active') === 'true';

        // Sign in / Get started from the website lands here with ?auth=1
        if (forceAuth) {
          sessionStorage.setItem('york_session_active', 'true');
          sessionActive = true;
          try {
            var raw = localStorage.getItem('york_console_state_v19');
            if (raw) {
              var st = JSON.parse(raw);
              st.currentUser = null;
              localStorage.setItem('york_console_state_v19', JSON.stringify(st));
            }
          } catch (authErr) {}
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, '', 'dashboard-v3.html');
          }
        }

        // Console requires an active website → auth session
        if (!sessionActive) {
          window.location.replace('index.html');
          return;
        }

        var saved = localStorage.getItem('york_theme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
          if (saved === 'dark') document.documentElement.classList.add('dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e){}
    })();

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      if (next === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      try {
        localStorage.setItem('york_theme', next);
      } catch(e){}
      if (typeof showToast === 'function') {
        showToast(next === 'dark' ? 'Dark theme enabled' : 'Light theme enabled', 'info', 2000);
      }
    }
  </script>

/* WCAG 2.0 AA — 2.4.7 Focus Visible */
:focus {

}
:focus:not(:focus-visible) {
  outline: none;
}
:focus-visible {
  outline: 3px solid var(--focus-ring, var(--emerald-accent));
  outline-offset: 2px;
}
/* When a control clears outline for a custom ring, keep an accessible fallback */

select:focus-visible,
textarea:focus-visible,
button:focus-visible,
[role="button"]:focus-visible,
a:focus-visible {
  outline: 3px solid var(--focus-ring, var(--emerald-accent));

}

  box-shadow: 0 0 0 3px color-mix(in srgb, var(--emerald) 18%, transparent);
}
.sidebar-main-nav-btn i,
.sidebar-main-nav-btn svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  color: var(--text-muted);
}
.sidebar-main-nav-btn:hover i,
.sidebar-main-nav-btn:hover svg {
  color: var(--text-main);
}
.sidebar-main-nav-btn.active i,
.sidebar-main-nav-btn.active svg {
  color: var(--emerald-dark);
}
.sidebar-main-nav-btn.active .sidebar-badge {
  color: var(--emerald-dark);
}

.sidebar-nav-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 4px var(--sidebar-pad-x) 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
  box-sizing: border-box;
}
.sidebar-category-group {
  margin-top: 10px;
}
.sidebar-category-group:first-child {
  margin-top: 0;
}
.sidebar-category-title {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.02em;
  text-transform: none;
  color: var(--text-muted);
  padding: 6px var(--sidebar-nav-pad-x) 4px;
  line-height: 1.3;
}
.sidebar-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px var(--sidebar-nav-pad-x);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 400;
  color: var(--text-secondary);
  transition: background 0.12s, color 0.12s;
  cursor: pointer;
  box-sizing: border-box;
  min-width: 0;
}
.sidebar-nav-item:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
}
.sidebar-nav-item.active {
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  font-weight: 500;
}
:root[data-theme="dark"] .sidebar-nav-item.active {
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
}
.sidebar-nav-item i {
  width: 16px;
  height: 16px;
  color: var(--text-muted);
}
.sidebar-nav-item.active i {
  color: var(--emerald-dark);
}
:root[data-theme="dark"] .sidebar-nav-item.active i {
  color: var(--emerald-dark);
}
.sidebar-nav-label {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-main-nav-btn > span:not(.sidebar-badge):not(.collapsed-dot-indicator),
.sidebar-nav-item .sidebar-nav-label {
  flex: 1 1 auto;
  min-width: 0;
  text-align: left;
}
.sidebar-badge {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  padding: 0 2px;
  margin-left: auto;
  border-radius: 6px;
  background: transparent;
  color: var(--text-muted);
  border: none;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
  white-space: nowrap;
  box-sizing: border-box;
}
.sidebar-badge.new,
.sidebar-badge.alert,
.sidebar-badge.signoff,
.sidebar-badge.is-open {
  border: none;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
  letter-spacing: 0;
  margin-left: auto;
  line-height: 1.25;
}
.sidebar-badge.new,
.sidebar-badge.signoff {
  background: transparent;
  color: var(--text-muted);
}
.sidebar-badge.alert,
.sidebar-badge.is-open {
  background: rgba(245, 158, 11, 0.18);
  color: #B45309;
}

/* Client portal nav — same quiet treatment as admin */
.client-portal-nav {
  flex: 1;
  overflow-y: auto;
  border-bottom: none;
  padding: 4px var(--sidebar-pad-x) 12px;
  gap: 2px;
  box-sizing: border-box;
}
.client-portal-nav .sidebar-main-nav-btn {
  padding: 8px var(--sidebar-nav-pad-x);
}
.client-portal-nav .sidebar-main-nav-btn i,
.client-portal-nav .sidebar-main-nav-btn svg {
  width: 16px;
  height: 16px;
  color: var(--text-muted);
}
.client-portal-nav .sidebar-main-nav-btn.nav-support i,
.client-portal-nav .sidebar-main-nav-btn.nav-support svg {
  color: var(--text-muted);
}
.client-portal-nav .sidebar-main-nav-btn.active {
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border-color: transparent;
  box-shadow: none;
}
.client-portal-nav .sidebar-main-nav-btn.active i,
.client-portal-nav .sidebar-main-nav-btn.active svg {
  color: var(--emerald-dark);
}
.client-portal-nav .sidebar-main-nav-btn.active .sidebar-badge,
.client-portal-nav .sidebar-main-nav-btn.active .sidebar-badge.signoff {
  background: transparent;
  color: var(--emerald-dark);
  border-color: transparent;
}
:root[data-theme="dark"] .client-portal-nav .sidebar-main-nav-btn.active {
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border-color: transparent;
}
:root[data-theme="dark"] .client-portal-nav .sidebar-main-nav-btn.active i,
:root[data-theme="dark"] .client-portal-nav .sidebar-main-nav-btn.active svg {
  color: var(--emerald-dark);
}
:root[data-theme="dark"] .client-portal-nav .sidebar-main-nav-btn.active .sidebar-badge,
:root[data-theme="dark"] .client-portal-nav .sidebar-main-nav-btn.active .sidebar-badge.signoff {
  background: transparent;
  color: var(--emerald-dark);
}

.sidebar-footer {
  border-top: 1px solid var(--line);
  padding: 10px var(--sidebar-pad-x) 12px;
  background: var(--bg-card);
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
}
.topbar-role-switcher {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-right: 4px;
  flex-shrink: 0;
}
.topbar-role-label {
  font-size: 12px;
  font-weight: 550;
  color: var(--text-muted);
  white-space: nowrap;
}
.topbar-role-switcher .perspective-toggle {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  height: 34px;
  box-sizing: border-box;
}
.topbar-role-switcher .perspective-btn {
  height: 28px;
  padding: 0 10px;
}
@media (max-width: 720px) {
  .topbar-role-label { display: none; }
}
.sidebar-compute-meter {
  padding: 8px var(--sidebar-nav-pad-x);
  border-radius: 8px;
  background: var(--bg-subtle);
  border: none;
  margin: 0;
  cursor: pointer;
  transition: background 0.15s;
  box-sizing: border-box;
}
.sidebar-compute-meter:hover {
  border: none;
  background: var(--bg-subtle-2);
}
.sidebar-compute-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
}
.sidebar-compute-bar {
  height: 5px;
  background: var(--bg-subtle-2);
  border-radius: 99px;
  overflow: hidden;
}
.sidebar-compute-bar i {
  display: block;
  height: 100%;
  width: 61%;
  background: var(--emerald);
  border-radius: 99px;
}

.sidebar-user-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 0;
  border-top: none;
  margin-top: 0;
}
.sidebar-user-tile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px var(--sidebar-nav-pad-x);
  border-radius: 8px;
  cursor: default;
  background: transparent;
  box-sizing: border-box;
  min-width: 0;
}
.sidebar-user-avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--avatar-radius);
  background: var(--bg-subtle-2);
  color: #FFFFFF;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
  overflow: hidden;
  padding: 0;
  border: var(--avatar-border);
}
.user-avatar-photo {
  overflow: hidden;
  padding: 0 !important;
  line-height: 0;
  flex-shrink: 0;
  display: inline-grid !important;
  place-items: center;
  background: var(--bg-subtle-2);
  border-radius: 50% !important;
  border: var(--avatar-border);
}
.user-avatar-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 50%;
}
.sidebar-user-avatar.user-avatar-photo,
.team-member-avatar.user-avatar-photo,
.mt-avatar.user-avatar-photo,
.ws-manager-avatar.user-avatar-photo {
  border-radius: 50% !important;
}
.sidebar-user-meta {
  flex: 1;
  min-width: 0;
}
.sidebar-user-name {
  font-size: 14px;
  font-weight: 500;
  display: block;
  line-height: 1.25;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-user-role {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-logout-btn {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  width: 100%;
  height: 32px;
  padding: 0 var(--sidebar-nav-pad-x);
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  box-sizing: border-box;
}
.sidebar-logout-btn:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
  border: none;
}
.sidebar-logout-btn i,
.sidebar-logout-btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}



/* ─── MAIN DESK CANVAS ─── */
.desk-canvas {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--page-stack-gap);
  padding: 20px 24px 32px;
  max-width: none;
  margin: 0;
  width: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  box-sizing: border-box;
  background: var(--bg-app);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.5;
}

/* ─── STATIC TOP NAV (identical on every screen) ─── */
.app-topbar,
.floating-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  width: 100%;
  height: 56px;
  min-height: 56px;
  max-height: 56px;
  padding: 0 20px;
  background: var(--bg-card);
  border: none;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  box-shadow: none;
  box-sizing: border-box;
  flex-shrink: 0;
  z-index: 30;
  overflow: visible;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
  flex: 1;
}

:root[data-theme="dark"] .app-topbar,
:root[data-theme="dark"] .floating-topbar {
  background: var(--bg-card);
  border-bottom-color: var(--line);
  box-shadow: none;
}

.topbar-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: -0.01em;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 220px;
  flex-shrink: 0;
}
/* Perspective Switcher (Realistic Institutional Segmented Control) */
.perspective-toggle {
  display: inline-flex;
  align-items: center;
  background: var(--bg-subtle);
  padding: 3px;
  border-radius: 6px;
  border: 1px solid var(--line);
  gap: 2px;
}
.perspective-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  height: 28px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.perspective-btn:hover {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.6);
}
.perspective-btn.active {
  background: var(--bg-card);
  color: var(--text-main);
  font-weight: 600;
  border-color: var(--line);
  box-shadow: none;
}
.perspective-btn i, .perspective-btn svg {
  width: 13px;
  height: 13px;
  color: var(--text-muted);
}
.perspective-btn.active i, .perspective-btn.active svg {
  color: var(--emerald-dark);
}
:root[data-theme="dark"] .perspective-btn:hover {
  background: rgba(255, 255, 255, 0.06);
}
:root[data-theme="dark"] .perspective-btn.active {
  background: #172033;
  color: #F8FAFC;
  border-color: rgba(255, 255, 255, 0.12);
}
:root[data-theme="dark"] .perspective-btn.active i, :root[data-theme="dark"] .perspective-btn.active svg {
  color: #00D6A4;
}

/* Filter Segmented Control */
.filter-segmented-control {
  display: inline-flex;
  align-items: center;
  background: var(--bg-subtle);
  padding: 3px;
  border-radius: 6px;
  border: 1px solid var(--line);
  height: 36px;
  box-sizing: border-box;
  gap: 2px;
}
.filter-tab-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  height: 28px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.12s ease, box-shadow 0.18s ease;
  white-space: nowrap;
}
.filter-tab-btn:hover {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.6);
}
.filter-tab-btn.active {
  background: var(--bg-card);
  color: var(--text-main);
  font-weight: 600;
  border-color: var(--line);
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
}
.filter-tab-btn.active.ui-just-selected {
  border-color: color-mix(in srgb, var(--emerald) 35%, var(--line));
}
.filter-tab-count {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.filter-tab-btn.active .filter-tab-count {
  color: var(--text-muted);
}
:root[data-theme="dark"] .filter-tab-btn:hover {
  background: rgba(255, 255, 255, 0.06);
}
:root[data-theme="dark"] .filter-tab-btn.active {
  background: #172033;
  color: #F8FAFC;
  border-color: rgba(255, 255, 255, 0.12);
}
:root[data-theme="dark"] .filter-tab-btn.active .filter-tab-count {
  color: var(--text-muted);
}

/* Backward compatibility for version pills */
.version-switch-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--bg-subtle);
  padding: 3px;
  border-radius: 6px;
  border: 1px solid var(--line);
}
.v-tab-btn {
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.15s ease;
  white-space: nowrap;
  display: inline-block;
}
.v-tab-btn:hover {
  color: var(--text-main);
  background: var(--bg-card);
}
.v-tab-btn.active {
  font-weight: 600;
  background: var(--bg-card);
  color: var(--text-main);
  border: 1px solid var(--line);
}

/* SEARCH — 16px after title in the left cluster */
.top-search-pill {
  width: 100%;
  min-width: 160px;
  max-width: 360px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 12px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s ease;
  font-size: 14px;
  box-sizing: border-box;
  flex: 1;
  position: relative;
  z-index: 1;
}

.top-search-pill:hover {
  background: var(--bg-pill-hover);
  border-color: var(--line-strong);
  color: var(--text-main);
}

:root[data-theme="dark"] .top-search-pill {
  background: #080C14;
  border-color: rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
}

:root[data-theme="dark"] .top-search-pill:hover {
  background: #101827;
  border-color: rgba(0, 180, 138, 0.35);
  color: var(--text-main);
}

.top-search-inner {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}

.top-search-inner i, .top-search-inner svg {
  width: 15px;
  height: 15px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.top-search-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 14px;
  font-weight: 400;
  color: var(--text-muted);
  text-align: left;
}

.top-search-kbd {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 6px;
  background: var(--bg-card);
  color: var(--text-muted);
  border: 1px solid var(--line);
  flex-shrink: 0;
}

:root[data-theme="dark"] .top-search-kbd {
  background: #141E32;
  border-color: rgba(255, 255, 255, 0.12);
  color: var(--text-muted);
}

/* Right Actions Group — pinned to the right edge of every screen */
.topbar-actions-group {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  min-width: 0;
  justify-self: end;
}
.topbar-primary-slot {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
}
.topbar-primary-slot:empty {
  display: none;
}
.topbar-primary-slot .export-pill-btn,
.topbar-primary-slot .bento-cta {
  height: 34px;
  padding: 0 12px;
  font-size: 12px;
  border-radius: 8px;
  white-space: nowrap;
}

.topbar-action-btn, .top-circle-btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
  box-sizing: border-box;
  flex-shrink: 0;
}

.topbar-action-btn:hover, .top-circle-btn:hover {
  background: var(--bg-pill-hover);
  color: var(--text-main);
  border-color: var(--line-strong);
}

:root[data-theme="dark"] .topbar-action-btn,
:root[data-theme="dark"] .top-circle-btn {
  background: #080C14;
  border-color: rgba(255, 255, 255, 0.08);
}

:root[data-theme="dark"] .topbar-action-btn:hover,
:root[data-theme="dark"] .top-circle-btn:hover {
  background: #141E32;
  color: #F8FAFC;
  border-color: rgba(255, 255, 255, 0.16);
}

.topbar-bell-dot {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #EF4444;
  border: 1.5px solid var(--bg-card);
}
.topbar-bell-dot.is-hidden { display: none; }

.notif-wrap {
  position: relative;
  z-index: 50;
}
.notif-panel {
  position: fixed;
  top: 64px;
  right: 16px;
  width: min(360px, calc(100vw - 24px));
  max-height: min(480px, calc(100vh - 80px));
  background: var(--bg-card);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  box-shadow: var(--shadow-drawer);
  z-index: 10050;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: contentSwapIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.notif-panel[hidden] { display: none !important; }
.notif-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.notif-panel-title {
  font-size: 13.5px;
  font-weight: 650;
  color: var(--text-main);
  letter-spacing: -0.01em;
}
.notif-panel-meta {
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 500;
}
.notif-mark-read {
  border: none;
  background: transparent;
  color: var(--emerald-dark);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
}
.notif-mark-read:hover {
  background: var(--emerald-subtle);
}
.notif-list {
  max-height: 340px;
  overflow-y: auto;
  padding: 6px;
}
.notif-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 10px;
  border-radius: 10px;
  cursor: default;
  transition: background 0.15s ease;
}
.notif-item:hover {
  background: var(--bg-subtle);
}
.notif-item.is-unread {
  background: color-mix(in srgb, var(--emerald-subtle) 55%, transparent);
}
.notif-item.is-unread:hover {
  background: var(--emerald-subtle);
}
.notif-icon {
  width: 34px;
  height: 34px;

/* Table toolbar filters — quiet select-style control */
.ini-filter-wrap {
  position: relative;
  flex-shrink: 0;
}
.ini-filter-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 12px 0 12px;
  border-radius: 8px;
  border: 1px solid var(--line-strong, var(--line));
  background: var(--bg-card);
  color: var(--text-main);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  white-space: nowrap;
}
.ini-filter-btn:hover {
  background: #FAFBFC;
  border-color: color-mix(in srgb, var(--text-muted) 35%, var(--line));
}
.ini-filter-wrap.is-open .ini-filter-btn {
  border-color: color-mix(in srgb, var(--emerald) 40%, var(--line));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--emerald) 12%, transparent);
  background: var(--bg-card);
}
.ini-filter-btn > i[data-lucide],
.ini-filter-btn > svg.lucide {
  display: none;
}
.ini-filter-label {
  color: var(--text-muted);
  font-weight: 500;
  font-size: 12px;
}
.ini-filter-label::after {
  content: "";
  display: inline-block;
  width: 1px;
  height: 12px;
  margin: 0 2px 0 8px;
  background: var(--line-strong, var(--line));
  vertical-align: -1px;
}
.ini-filter-pill {
  display: inline-flex;
  align-items: center;
  gap: 0;
  height: auto;
  padding: 0;
  border-radius: 0;
  background: transparent;
  color: var(--text-main);
  border: none;
  font-size: 12.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.ini-filter-chevron {
  display: inline-grid;
  place-items: center;
  margin-left: 4px;
  margin-right: 0;
  color: var(--text-faint);
  transition: transform 0.15s ease, color 0.15s ease;
}
.ini-filter-chevron i,
.ini-filter-chevron svg {
  width: 14px !important;
  height: 14px !important;
}
.ini-filter-btn:hover .ini-filter-chevron,
.ini-filter-wrap.is-open .ini-filter-chevron {
  color: var(--text-muted);
}
.ini-filter-wrap.is-open .ini-filter-chevron {
  transform: rotate(180deg);
}
.ini-filter-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: max(200px, 100%);
  padding: 6px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  box-shadow: 0 10px 28px rgba(15, 23, 42, 0.10), 0 2px 6px rgba(15, 23, 42, 0.04);
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 1px;
  animation: popFade 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}
.ini-filter-menu[hidden] {
  display: none !important;
}
.ini-filter-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  padding: 8px 10px;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 12.5px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease;
}
.ini-filter-option:hover {
  background: #F7F9FC;
  color: var(--text-main);
}
.ini-filter-option.is-active {
  background: #F0FDF6;
  color: var(--emerald-dark);
  font-weight: 600;
}
:root[data-theme="dark"] .ini-filter-option:hover {
  background: var(--bg-subtle);
}
:root[data-theme="dark"] .ini-filter-option.is-active {
  background: rgba(16, 185, 129, 0.14);
  color: #34D399;
}
.ini-filter-option-name {
  line-height: 1.25;
}
.ini-filter-option-count {
  font-variant-numeric: tabular-nums;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-faint);
  background: transparent;
  padding: 0;
  border-radius: 0;
  min-width: 1.25em;
  text-align: right;
}
.ini-filter-option.is-active .ini-filter-option-count {
  background: transparent;
  color: var(--emerald-dark);
}
:root[data-theme="dark"] .ini-filter-btn:hover {
  background: var(--bg-subtle);
}
:root[data-theme="dark"] .ini-filter-option.is-active .ini-filter-option-count {
  color: #34D399;
}

/* ─── YORK PAGE SYSTEM — content-led, calm hierarchy ─── */
.bento-page {
  display: flex;
  flex-direction: column;
  gap: 24px;
  max-width: 1120px;
  font-size: 14px;
  font-weight: 400;

}
.bento-greeting-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 0;
}
.bento-greeting-copy { min-width: 0; flex: 1; }
.bento-greeting-title {
  margin: 0;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.25;

.bento-greeting-sub {

  gap: 8px;

.bento-date-text {

  white-space: nowrap;
}

.bento-cta {
  height: 32px;

  background: var(--btn-primary-bg);
  color: var(--btn-primary-fg, #fff) !important;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;

.bento-cta:hover { background: var(--btn-primary-hover); border-color: var(--btn-primary-hover); }
.bento-cta:active { transform: scale(0.97); }
.bento-cta-secondary {
  background: var(--bg-card);
  color: var(--text-secondary) !important;
  border-color: var(--line);
}
.bento-cta-secondary:hover {
  background: var(--bg-subtle);
  color: var(--text-main) !important;
  border-color: var(--line);
}
.bento-metric-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  padding: 0;
  margin: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  overflow: visible;
}
.bento-metric-strip[data-count="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bento-metric-strip[data-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.bento-metric-strip[data-count="5"] { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.bento-metric {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 8px;
  padding: 18px 20px;
  margin: 0;
  min-width: 0;
  min-height: 120px;
  background: var(--bg-card);
  border: 0.75px solid var(--line);
  border-radius: var(--radius-card, 14px);
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
  position: relative;
  overflow: hidden;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: default;
}
.bento-metric:hover {
  border-color: var(--line-active);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  transform: translateY(-2px);
}
.bento-metric.ok,
.bento-metric.warn {
  background: var(--bg-card);
  border-color: var(--line);
}
.bento-metric.ok::before,
.bento-metric.warn::before {
  display: none !important;
  content: none !important;
}
.bento-metric-label {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  line-height: 1.3;
  order: 0;
}
.bento-metric-value {
  font-size: 26px;
  font-weight: 750;
  letter-spacing: -0.04em;
  color: var(--text-main);
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  order: 1;
  margin-top: 2px;
}
.bento-metric-hint {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  line-height: 1.35;
  order: 2;
  margin-top: 2px;
}
.bento-metric-value.warn,
.bento-metric.warn .bento-metric-value { color: var(--warn-text); }
.bento-metric-value.ok,
.bento-metric.ok .bento-metric-value { color: var(--ok-text); }
@media (max-width: 900px) {
  .bento-metric-strip,
  .bento-metric-strip[data-count="5"],
  .bento-metric-strip[data-count="4"],
  .bento-metric-strip[data-count="3"] {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 560px) {
  .bento-metric-strip,
  .bento-metric-strip[data-count="5"],
  .bento-metric-strip[data-count="4"],
  .bento-metric-strip[data-count="3"],
  .bento-metric-strip[data-count="2"] {
    grid-template-columns: 1fr;
  }
}
.bento-grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 16px;
}
.bento-span-3 { grid-column: span 3; }
.bento-span-4 { grid-column: span 4; }
.bento-span-5 { grid-column: span 5; }
.bento-span-6 { grid-column: span 6; }
.bento-span-7 { grid-column: span 7; }
.bento-span-8 { grid-column: span 8; }
.bento-span-12 { grid-column: span 12; }
.bento-surface {

  border: none;
  border-radius: 0;
  padding: 0;
  min-width: 0;
}
.bento-surface > .bento-panel-head {
  margin: 0 0 14px;

/* ─── REALISTIC SAAS BUTTON SYSTEM (LINEAR / STRIPE SPEC) ─── */
.btn-saas-secondary {
  height: 32px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--cta-radius, 8px);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 550;
  letter-spacing: -0.01em;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  cursor: pointer;
  transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  box-sizing: border-box;
}
.btn-saas-secondary:hover {
  background: var(--bg-subtle);
  border-color: var(--line-strong);
  color: var(--text-main);
  box-shadow: 0 2px 5px rgba(15, 23, 42, 0.08);
  transform: translateY(-1px);
}
.btn-saas-secondary:active {
  background: var(--bg-subtle-2);
  transform: scale(0.97);
  box-shadow: none;
}
.btn-saas-secondary i, .btn-saas-secondary svg {
  width: 14px;
  height: 14px;
  color: var(--text-muted);
  stroke-width: 1.8;
  transition: color 0.15s ease;
}
.btn-saas-secondary:hover i, .btn-saas-secondary:hover svg {
  color: var(--text-main);
}

.btn-saas-primary {
  height: 32px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--cta-primary-bg);
  border: 1px solid var(--cta-primary-border);
  border-radius: var(--cta-radius, 8px);
  color: var(--cta-primary-color, #FFFFFF) !important;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  box-shadow: var(--cta-primary-shadow);
  cursor: pointer;
  transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  box-sizing: border-box;
}
.btn-saas-primary:hover {
  background: var(--cta-primary-hover-bg);
  box-shadow: var(--cta-primary-shadow-hover);
  transform: translateY(-1px);
}
.btn-saas-primary:active {
  transform: scale(0.97);
  box-shadow: 0 1px 4px rgba(16, 185, 129, 0.2);
}
.btn-saas-primary i, .btn-saas-primary svg {
  width: 14px;
  height: 14px;
  color: var(--cta-primary-color, #FFFFFF) !important;
  stroke-width: 2;
}

.btn-saas-amber {
  height: 32px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--warn-bg);
  border: 1px solid #FCD34D;
  border-radius: var(--cta-radius, 8px);
  color: var(--warn-text);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(245, 158, 11, 0.12);
  cursor: pointer;
  transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  box-sizing: border-box;
}
.btn-saas-amber:hover {
  filter: brightness(0.96);
  transform: translateY(-1px);
}
.btn-saas-amber:active {
  transform: scale(0.97);
}
.btn-saas-amber i, .btn-saas-amber svg {
  width: 14px;
  height: 14px;
  color: var(--warn-text);
  stroke-width: 2;
}

  border-radius: var(--avatar-radius);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: var(--avatar-border);
  display: grid;
  place-items: center;
  font-weight: 750;
  font-size: 12px;
  letter-spacing: -0.02em;
  flex-shrink: 0;
  overflow: hidden;
}
:root[data-theme="dark"] .company-monogram {
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border-color: var(--line);
}

.stage-tag {
  font-size: 11px;
  font-weight: 650;
  padding: 3px 8px;
  border-radius: 9999px;
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--line);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 1.3;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 9999px;
  font-size: 11.5px;
  font-weight: 650;
  line-height: 1;
  white-space: nowrap;
}
.status-pill.status-active {
  background: var(--ok-bg, var(--emerald-subtle));
  color: var(--ok-text);
  border: 1px solid color-mix(in srgb, var(--ok-text) 22%, transparent);
}
.status-pill.status-invited {
  background: var(--info-bg, #EFF6FF);
  color: var(--info-text, #1D4ED8);
  border: 1px solid color-mix(in srgb, var(--info-text, #1D4ED8) 22%, transparent);
}
.status-pill.status-pending {
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--line);
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.status-dot-active {
  background: #10B981;
}
.status-dot-invited {
  background: #3B82F6;
  animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}
.status-dot-pending {
  background: #94A3B8;
}

:root[data-theme="dark"] .status-pill.status-active {
  background: var(--ok-bg);
  color: var(--ok-text);
  border-color: color-mix(in srgb, var(--ok-text) 28%, transparent);
}
:root[data-theme="dark"] .status-pill.status-invited {
  background: var(--info-bg);
  color: var(--info-text);
  border-color: color-mix(in srgb, var(--info-text) 28%, transparent);
}
:root[data-theme="dark"] .status-pill.status-pending {
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border-color: var(--line);
}

/* Export / Action CTA Button - Clean Fallback */
.export-pill-btn {
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 14px;
  background: var(--btn-primary-bg) !important;
  color: #FFFFFF !important;
  border-radius: 6px !important;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  box-shadow: none !important;
  border: 1px solid var(--btn-primary-bg) !important;
  transition: background 0.15s ease;
  cursor: pointer;
  box-sizing: border-box;
  white-space: nowrap;
}
.export-pill-btn:hover {
  background: var(--btn-primary-hover) !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 4px rgba(8, 76, 54, 0.25) !important;
}
.export-pill-btn i, .export-pill-btn svg {
  width: 14px;
  height: 14px;
}

/* ─── 4-CARD METRIC DECK (REALISTIC EXECUTIVE KPI CARDS) ─── */
.metrics-card-deck {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  width: 100%;
}
.metrics-card-deck[data-count="1"] { grid-template-columns: minmax(0, 1fr); }
.metrics-card-deck[data-count="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.metrics-card-deck[data-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metrics-card-deck[data-count="5"] { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.metrics-card-deck .deck-card {
  width: 100%;
  min-width: 0;
}

.deck-card {
  padding: 18px 20px;
  border-radius: var(--radius-card, 14px);
  border: 0.75px solid var(--line);
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
  background: var(--bg-card);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 120px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: default;
  position: relative;
}
.deck-card:hover {
  border-color: var(--line-active);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  transform: translateY(-2px);
}

.deck-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.deck-card-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: -0.01em;
}
.deck-card-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border: 1px solid color-mix(in srgb, var(--emerald) 18%, transparent);
  transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  flex-shrink: 0;
}
.deck-card:hover .deck-card-icon {
  transform: scale(1.06) translateY(-1px);
  background: color-mix(in srgb, var(--emerald-subtle) 72%, #fff);
  box-shadow: 0 4px 10px color-mix(in srgb, var(--emerald) 14%, transparent);
}
/* Only scenario exception: attention / risk */
.deck-card-icon.is-warn {
  background: var(--warn-bg);
  color: var(--warn-text);
  border-color: color-mix(in srgb, #F59E0B 28%, transparent);
}
.deck-card:hover .deck-card-icon.is-warn {
  background: color-mix(in srgb, var(--warn-bg) 75%, #fff);
  box-shadow: 0 4px 10px rgba(245, 158, 11, 0.12);
}
.deck-card-icon i,
.deck-card-icon i[data-lucide],
.deck-card-icon svg,
.deck-card-icon svg.lucide {
  width: 15px !important;
  height: 15px !important;
  color: currentColor !important;
  stroke: currentColor !important;
}

.deck-card-value {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  color: var(--text-main);
  margin: 0 0 6px;
}

.deck-card-caption {
  font-size: 12.5px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 5px;
}
.deck-card-caption b {
  font-weight: 600;
  color: var(--emerald-dark);
}

/* ─── EXECUTIVE BILLING & COMPUTE RESOURCE CARD ─── */
.billing-executive-card {
  background: var(--bg-card);
  border: 0.75px solid var(--line);
  border-radius: 16px;
  padding: 12px 20px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 14px 0 20px;
  transition: all 0.2s ease;
}
:root[data-theme="dark"] .billing-executive-card {
  background: #172033;
  border-color: rgba(255, 255, 255, 0.08);
}
.billing-segment {
  display: flex;
  align-items: center;
  gap: 12px;
}
.billing-plan-seg {
  flex: 0 0 auto;
}
.billing-plan-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border: 1px solid rgba(0, 179, 137, 0.25);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
:root[data-theme="dark"] .billing-plan-icon {
  background: rgba(0, 179, 137, 0.18);
  color: #34D399;
}
.billing-plan-icon svg, .billing-plan-icon i {
  width: 18px;
  height: 18px;
}
.billing-seg-content {
  display: flex;
  flex-direction: column;
}
.billing-plan-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.billing-plan-name {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: -0.01em;
}
.billing-live-tag {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 1.5px 6px;
  border-radius: 4px;
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border: 1px solid rgba(0, 179, 137, 0.3);
  letter-spacing: 0.05em;
}
:root[data-theme="dark"] .billing-live-tag {
  background: rgba(0, 179, 137, 0.15);
  color: #34D399;
  border-color: rgba(52, 211, 153, 0.3);
}
.billing-plan-meta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 1px;
}
.billing-v-divider {
  width: 1px;
  height: 30px;
  background: var(--line);
  flex-shrink: 0;
}
.billing-compute-seg {
  flex: 1 1 320px;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.billing-compute-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
}
.billing-compute-title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  color: var(--text-secondary);
}
.billing-compute-title svg, .billing-compute-title i {
  width: 13px;
  height: 13px;
  color: var(--emerald);
}
.billing-compute-stat {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.billing-pct-pill {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--emerald-dark);
  background: var(--emerald-subtle);
  border: 1px solid rgba(0, 179, 137, 0.25);
  padding: 0 6px;
  border-radius: 99px;
}
:root[data-theme="dark"] .billing-pct-pill {
  background: rgba(0, 179, 137, 0.18);
  color: #34D399;
}
.billing-tokens-count {
  font-size: 12px;
  color: var(--text-main);
  font-weight: 600;
}
.billing-tokens-total {
  color: var(--text-muted);
  font-weight: 400;
  font-size: 12px;
}
.billing-progress-track {
  height: 6px;
  background: var(--bg-subtle-2);
  border-radius: 99px;
  overflow: hidden;
  width: 100%;
}
.billing-progress-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--emerald);
  transition: width 0.4s ease;
}
.billing-stats-seg {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-shrink: 0;
}
.billing-mini-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.billing-stat-caption {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.billing-stat-value {
  font-size: 14px;
  color: var(--text-main);
}
.billing-stat-max {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 2px;
}
.billing-tier-chip {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--line);
}
.billing-action-seg {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.billing-manage-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 36px;
  padding: 0 16px;
  border-radius: var(--cta-radius) !important; /* Strict 8px crisp corners matching website */
  background: var(--cta-primary-bg) !important;
  color: var(--cta-primary-color) !important;
  border: 1px solid var(--cta-primary-border) !important;
  box-shadow: var(--cta-primary-shadow) !important;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}
.billing-manage-btn:hover {
  background: var(--cta-primary-hover-bg) !important;
  color: #FFFFFF !important;
  transform: translateY(-2px);
  box-shadow: var(--cta-primary-shadow-hover) !important;
}
.billing-manage-btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
  transform: skewX(-20deg);
  transition: left 0.75s ease;
  pointer-events: none;
}
.billing-manage-btn:hover::after {
  left: 140%;
}
.billing-manage-btn svg, .billing-manage-btn i {
  width: 13px;
  height: 13px;
  transition: transform 0.2s ease;
}
.billing-manage-btn:hover svg, .billing-manage-btn:hover i {
  transform: translateX(3px);
}
@media (max-width: 1100px) {
  .billing-executive-card {
    flex-wrap: wrap;
    gap: 14px;
  }
}
@media (max-width: 768px) {
  .billing-executive-card {
    flex-direction: column;
    align-items: stretch;
  }
  .billing-v-divider { display: none; }
  .billing-compute-seg { max-width: 100%; }
  .billing-stats-seg { justify-content: space-between; }
  .billing-action-seg { justify-content: flex-end; }
}

/* ─── 2-CARD BOTTOM SECTION (SPACIOUS EXECUTIVE SPLIT) ─── */
.bottom-cards-row {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 20px;
  align-items: stretch;
}

.feature-large-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 24px 26px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.feature-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 20px;
}
.feature-card-heading-box {
  display: flex;
  flex-direction: column;
}
.feature-card-title {
  font-size: 17.5px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-main);
}
.feature-card-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 3px;
}

.feature-card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-filter-pill {
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  background: var(--bg-subtle);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: all 0.15s;
}
.card-filter-pill:hover, .card-filter-pill.active {
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border-color: var(--emerald-light);
}
.card-round-icon-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--bg-subtle);
  display: grid;
  place-items: center;
  color: var(--text-muted);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: all 0.15s;
}
.card-round-icon-btn:hover {
  background: var(--bg-subtle-2);
  color: var(--text-main);
}
.card-round-icon-btn.open {
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border-color: var(--emerald-light);
  box-shadow: 0 0 0 3px var(--emerald-subtle);
}
.card-round-icon-btn.has-filter {
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border-color: var(--emerald);
}
.card-filter-dropdown-wrap {
  position: relative;
}
/* Ensure [hidden] always hides regardless of flex/grid/block on classes */
[hidden] {
  display: none !important;
}
.card-filter-popover {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 290px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
  z-index: 100;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: filterPop 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}
.card-filter-popover[hidden] {
  display: none !important;
}
:root[data-theme="dark"] .card-filter-popover {
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
  background: #141E32;
  border-color: rgba(255, 255, 255, 0.08);
}
@keyframes filterPop {
  from { opacity: 0; transform: translateY(-4px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.filter-popover-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.filter-popover-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-popover-title i, .filter-popover-title svg {
  width: 13px;
  height: 13px;
  color: var(--emerald);
}
.filter-popover-close {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.15s;
}
.filter-popover-close:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
  border-color: var(--line);
}
.filter-popover-close i, .filter-popover-close svg {
  width: 13px;
  height: 13px;
  pointer-events: none;
}
.filter-popover-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.filter-popover-subhead {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-family: var(--font-mono);
}
.filter-popover-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.popover-chip {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
}
.popover-chip:hover {
  background: var(--bg-subtle-2);
  color: var(--text-main);
}
.popover-chip.active {
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border-color: var(--emerald-light);
  font-weight: 600;
}
:root[data-theme="dark"] .popover-chip.active {
  background: rgba(0, 180, 138, 0.2);
  color: #34D399;
  border-color: rgba(0, 180, 138, 0.4);
}
.filter-popover-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.filter-popover-reset {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 4px;
}
.filter-popover-reset:hover {
  color: var(--text-main);
  background: var(--bg-subtle);
}
.filter-popover-apply {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 6px;
  background: var(--emerald);
  color: #FFFFFF;
  border: none;
  cursor: pointer;
  transition: opacity 0.15s;
}
.filter-popover-apply:hover {
  opacity: 0.9;
}

/* Services filter close button */
.services-filter-close-btn {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.15s;
}
.services-filter-close-btn:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
  border-color: var(--line);
}
.services-filter-close-btn i, .services-filter-close-btn svg {
  width: 12px;
  height: 12px;
  pointer-events: none;
}

/* ─── LEFT CARD: INITIATIVES DELIVERY COLUMN BARS + DATA LIST ─── */
.chart-columns-visual {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  align-items: flex-end;
  padding: 44px 16px 22px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 20px;
  position: relative;
  box-sizing: border-box;
}

.bar-column-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  justify-content: flex-end;
  cursor: pointer;
  position: relative;
  z-index: 2;
}

.bar-column-pill-track {
  width: 100%;
  max-width: 44px;
  height: 92px;

.telemetry-stream-feed {

/* ─── FULL-WIDTH DECK (SERVICES REGISTRY) ─── */
.full-width-deck-section {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 26px 28px;
  box-shadow: var(--shadow-card);

.full-section-head {

  justify-content: space-between;

  letter-spacing: -0.02em;
  color: var(--text-main);
}

  font-size: 14px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ─── SERVICE GRID & UNIFIED PRODUCT CARD VISUALS (MATCHING WEBSITE) ─── */
.service-cards-deck-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  align-items: stretch;
}
@media (max-width: 1100px) {
  .service-cards-deck-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 640px) {
  .service-cards-deck-grid {
    grid-template-columns: 1fr;
  }
}

.svc-card,
.service-deck-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 0;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
  cursor: pointer;
  position: relative;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
  min-height: 228px;
  height: 100%;
  text-align: left;
  box-sizing: border-box;
  opacity: 0;
  transform: translateY(10px);
  animation: svcCardIn 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.svc-card:nth-child(1) { animation-delay: 0.02s; }
.svc-card:nth-child(2) { animation-delay: 0.05s; }
.svc-card:nth-child(3) { animation-delay: 0.08s; }
.svc-card:nth-child(4) { animation-delay: 0.11s; }
.svc-card:nth-child(5) { animation-delay: 0.14s; }
.svc-card:nth-child(6) { animation-delay: 0.17s; }
.svc-card:nth-child(7) { animation-delay: 0.2s; }
.svc-card:nth-child(8) { animation-delay: 0.23s; }
.svc-card:nth-child(9) { animation-delay: 0.26s; }
.svc-card:nth-child(n+10) { animation-delay: 0.3s; }
@keyframes svcCardIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (prefers-reduced-motion: reduce) {
  .svc-card,
  .service-deck-card {
    opacity: 1;
    transform: none;
    animation: none;
  }
}

/* Subtle card hover — soft lift, no heavy cyan halo */
.svc-card:hover,
.svc-card.highlighted,
.service-deck-card:hover {
  background: var(--bg-card);
  border-color: color-mix(in srgb, var(--line-strong) 70%, rgba(6, 184, 178, 0.35));

    0 8px 18px -10px rgba(15, 23, 42, 0.14),

  border-color: rgba(255, 255, 255, 0.08);
}

:root[data-theme="dark"] .svc-card:hover,
:root[data-theme="dark"] .svc-card.highlighted,
:root[data-theme="dark"] .service-deck-card:hover {

  opacity: 1;

:root[data-theme="dark"] .svc-cat-tag.build,
:root[data-theme="dark"] .svc-cat-tag.decide { background: rgba(59, 130, 246, 0.16); color: #93C5FD; border-color: rgba(147, 197, 253, 0.3); }

:root[data-theme="dark"] .svc-cat-tag.gtm,

/* Right-aligned status pill inside card top row */

.service-deck-badge {

  font-weight: 600;

  color: var(--text-muted);

}
.svc-status-pill.live, .service-deck-badge.live { color: #047857; background: #ECFDF5; border-color: #A7F3D0; }
.svc-status-pill.beta, .service-deck-badge.beta { color: #B45309; background: #FFFBEB; border-color: #FDE68A; }
.svc-status-pill.new, .service-deck-badge.new { color: #1D4ED8; background: #EFF6FF; border-color: #BFDBFE; }

:root[data-theme="dark"] .svc-status-pill.live, :root[data-theme="dark"] .service-deck-badge.live { color: #34D399; background: rgba(0, 180, 138, 0.16); border-color: rgba(52, 211, 153, 0.3); }
:root[data-theme="dark"] .svc-status-pill.beta, :root[data-theme="dark"] .service-deck-badge.beta { color: #FDE68A; background: rgba(245, 158, 11, 0.16); border-color: rgba(253, 230, 138, 0.3); }
:root[data-theme="dark"] .svc-status-pill.new, :root[data-theme="dark"] .service-deck-badge.new { color: #93C5FD; background: rgba(59, 130, 246, 0.16); border-color: rgba(147, 197, 253, 0.3); }

.svc-plan-tag {
  display: none;
}

.svc-title-row {

  gap: 12px;
  margin: 0 0 10px;
  min-width: 0;
}
.svc-mini-icon,
.service-deck-icon {

  height: 32px;
  border-radius: 9px;

}
.svc-mini-icon i,
.svc-mini-icon i[data-lucide],
.svc-mini-icon svg,
.svc-mini-icon svg.lucide,
.service-deck-icon i,
.service-deck-icon i[data-lucide],
.service-deck-icon svg,
.service-deck-icon svg.lucide {

.svc-card-copy {
  min-width: 0;
  flex: 1;
}
.svc-card-name-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 8px;
  min-width: 0;
}
.svc-card-name-row h3 {
  min-width: 0;
}
.svc-card-name-tags {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.svc-card h3,
.service-deck-name {

  font-weight: 600;

}
.svc-card-credit {

}

.svc-card p.svc-desc,

/* Card foot — actions always readable */

.svc-learn-label {

.svc-card:hover .svc-arrow-glyph,
.svc-card.highlighted .svc-arrow-glyph {

}
.svc-plus-btn {

  height: 34px;

}
.svc-plus-btn:active {

}
.svc-plus-btn.is-requested,
.svc-plus-btn.is-granted {

}
.svc-meta-pill {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
}
.svc-meta-pill.is-ok {
  color: var(--emerald-dark, #047857);
}
.svc-cat-tag.gradient {

}
.svc-card.is-granted {

}
.svc-card.is-requested {
  border-color: rgba(245, 158, 11, 0.35);
}
.catalog-empty {

  padding: 48px 20px;
  color: var(--text-muted);
}
.catalog-empty-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);

}
.catalog-empty-copy {

}
/* Product detail modal — same width/layout language as company dashboard */
.modal-content.company-dash-modal.product-detail-modal {

.product-detail-modal .company-dash-avatar {

}

.product-detail-account-copy {

}
.product-detail-account-name {

/* Category Filter Pills in Registry */
.category-pill-tray {
  display: flex;

  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
.category-pill-btn {
  padding: 7px 15px;
  border-radius: var(--radius-pill);
  background: var(--bg-subtle);
  border: 1px solid var(--line);

  font-weight: 600;
  color: var(--text-secondary);

  transition: all 0.15s;
}
.category-pill-btn:hover {
  background: var(--bg-subtle-2);
  color: var(--text-main);
}
.category-pill-btn.active {
  background: var(--emerald-subtle);
  color: var(--emerald-dark);

}
:root[data-theme="dark"] .category-pill-btn.active {

/* Filter bar & Dropdown in Services Registry */
.services-filter-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;

}
.services-filter-bar .grow { flex: 1; }
.services-filter-dropdown-wrap { position: relative; }
.services-filter-trigger-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  padding: 0 14px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);

  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: none;
}
.services-filter-trigger-btn i { width: 14px; height: 14px; color: var(--text-muted); transition: color 0.15s; }
.services-filter-trigger-btn:hover { background: var(--bg-subtle); border-color: var(--line-strong); }
.services-filter-trigger-btn:hover i { color: var(--text-main); }
.services-filter-trigger-btn.open { border-color: var(--emerald); box-shadow: 0 0 0 3px var(--emerald-subtle); }
.services-filter-trigger-btn.open .filter-chevron { transform: rotate(180deg); }
.services-filter-active-pill {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;

}
.services-filter-trigger-btn.has-filter .services-filter-active-pill {

}
:root[data-theme="dark"] .services-filter-trigger-btn.has-filter .services-filter-active-pill {
  background: rgba(0, 180, 138, 0.2);
  color: #34D399;
}

.services-filter-dropdown-menu {

  left: 0;
  width: 280px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(15, 23, 42, 0.04);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  z-index: 100;
  animation: popFade 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.services-filter-dropdown-menu[hidden] {
  display: none !important;
}
.services-filter-menu-head {

}
.services-filter-menu-title {

  font-weight: 600;

  align-items: center;

}
.services-filter-menu-title i { width: 12px; height: 12px; }
.services-filter-reset-action {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
}
.services-filter-reset-action:hover { color: var(--text-main); background: var(--bg-subtle); }
.services-filter-menu-items { display: flex; flex-direction: column; gap: 2px; }
.services-filter-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  background: none;
  border: none;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-main);
  cursor: pointer;

  text-align: left;
  transition: all 0.12s ease;
}
.services-filter-item:hover { background: var(--bg-subtle); }
.services-filter-item.active { background: var(--emerald-subtle); color: var(--emerald-dark); font-weight: 600; }
:root[data-theme="dark"] .services-filter-item.active { background: rgba(0, 180, 138, 0.2); color: #34D399; }
.services-f-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--text-muted); }
.services-f-dot.rd { background: #2563EB; }
.services-f-dot.audit { background: #D97706; }
.services-f-dot.gtm { background: #7C3AED; }
.services-f-dot.signal { background: #0284C7; }
.services-f-dot.ai { background: var(--emerald); }
.services-f-dot.people { background: #6366F1; }
.services-f-dot.support { background: #0D9488; }
.services-f-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.services-f-count { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); background: var(--bg-subtle-2); padding: 1px 6px; border-radius: 99px; }
.services-filter-item.active .services-f-count {

  color: var(--emerald-dark);
}

.services-active-filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 10px;
  background: var(--emerald-subtle);
  border: 1px solid var(--emerald-light);
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  color: var(--emerald-dark);
}
:root[data-theme="dark"] .services-active-filter-chip { background: rgba(0, 180, 138, 0.2); border-color: rgba(0, 180, 138, 0.4); color: #34D399; }
.services-active-chip-clear { background: none; border: none; cursor: pointer; display: grid; place-items: center; color: var(--emerald-dark); padding: 2px; border-radius: 50%; }
.services-active-chip-clear:hover { background: rgba(0, 180, 138, 0.2); }
.services-active-chip-clear i { width: 12px; height: 12px; }

.services-fsearch {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--bg-card);
  color: var(--text-muted);

}
.services-fsearch:focus-within { border-color: var(--emerald); box-shadow: 0 0 0 3px var(--emerald-subtle); }
.services-fsearch input { border: 0; outline: 0; background: none; flex: 1; font-size: 14px; color: var(--text-main); }

/* ─── INTEGRATED DASHBOARD PRODUCT JOURNEY SECTION ─── */
/* ─── INTEGRATED DASHBOARD PRODUCT JOURNEY SECTION (REFINED EXECUTIVE LIFECYCLE FLOW) ─── */
.journey-pipeline-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 24px 26px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: relative;
  overflow: hidden;
}

.journey-pipeline-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.journey-header-left {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.journey-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.journey-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 9999px;
  background: var(--emerald-subtle);
  border: 1px solid var(--emerald-light);
  color: var(--emerald-dark);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.journey-pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 0 2px rgba(0, 180, 138, 0.25);
  animation: pulseDot 2s infinite ease-in-out;
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

.journey-pipeline-title {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-main);
}

.journey-pipeline-sub {
  font-size: 12px;
  color: var(--text-muted);
}

/* 8-Stage Interactive Timeline Rail - Sculpted & Connected */
.journey-steps-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
  position: relative;
  align-items: stretch;
}

@media (max-width: 1200px) {
  .journey-steps-grid {
    grid-template-columns: repeat(4, 1fr);
    row-gap: 14px;
  }
}
@media (max-width: 640px) {
  .journey-steps-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.journey-step-btn {
  padding: 14px 12px 12px;
  border-radius: 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  position: relative;
  text-align: left;
  min-height: 152px;
  height: 152px;
  box-sizing: border-box;
}

.journey-step-btn:hover {
  background: var(--bg-card);
  border-color: var(--line-strong);
  box-shadow: none;
}

/* Toast system — icons + microinteractions */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: min(380px, calc(100vw - 32px));
  pointer-events: none;
}
.york-toast {
  pointer-events: auto;
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--text-main);
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1), 0 1px 3px rgba(15, 23, 42, 0.05);
  overflow: hidden;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.york-toast.is-in {
  opacity: 1;
  transform: translateY(0);
}
.york-toast.is-out {
  opacity: 0;
  transform: translateY(6px);
}
:root[data-theme="dark"] .york-toast {
  background: #151C2C;
  color: #F8FAFC;
  border-color: rgba(255, 255, 255, 0.1);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
}
.york-toast-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  margin-top: 0;
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border: 1px solid color-mix(in srgb, var(--emerald) 18%, transparent);
}
.york-toast-icon svg {
  width: 14px;
  height: 14px;
  stroke-width: 2;
}
.york-toast.is-success .york-toast-icon,
.york-toast.is-info .york-toast-icon,
.york-toast.is-loading .york-toast-icon {
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border-color: color-mix(in srgb, var(--emerald) 18%, transparent);
}
.york-toast.is-error .york-toast-icon {
  background: var(--danger-bg);
  color: var(--danger-text);
  border-color: color-mix(in srgb, #F43F5E 22%, transparent);
}
.york-toast.is-warning .york-toast-icon {
  background: var(--warn-bg);
  color: var(--warn-text);
  border-color: color-mix(in srgb, #F59E0B 28%, transparent);
}
:root[data-theme="dark"] .york-toast.is-success .york-toast-icon,
:root[data-theme="dark"] .york-toast.is-info .york-toast-icon,
:root[data-theme="dark"] .york-toast.is-loading .york-toast-icon {
  color: #34D399;
  background: rgba(16, 185, 129, 0.14);
  border-color: rgba(16, 185, 129, 0.22);
}
:root[data-theme="dark"] .york-toast.is-error .york-toast-icon {
  color: #FB7185;
  background: rgba(244, 63, 94, 0.16);
  border-color: rgba(244, 63, 94, 0.24);
}
:root[data-theme="dark"] .york-toast.is-warning .york-toast-icon {
  color: #FBBF24;
  background: rgba(245, 158, 11, 0.16);
  border-color: rgba(245, 158, 11, 0.24);
}
.york-toast-body {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.45;
  padding-top: 4px;
}
.york-toast-body a,
.york-toast-body button {
  color: inherit;
}
.york-toast-close {
  width: 24px;
  height: 24px;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: var(--text-muted);
  display: grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}
.york-toast-close:hover {
  background: var(--bg-subtle);
  color: var(--text-main);
}
:root[data-theme="dark"] .york-toast-close:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #F8FAFC;
}
.york-toast-close svg {
  width: 13px;
  height: 13px;
}
.york-toast-progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: transparent;
  overflow: hidden;
}
.york-toast-progress > span {
  display: block;
  height: 100%;
  width: 100%;
  transform-origin: left center;
  animation: toastProgress linear forwards;
}
.york-toast.is-success .york-toast-progress > span,
.york-toast.is-info .york-toast-progress > span,
.york-toast.is-loading .york-toast-progress > span { background: var(--emerald); }
.york-toast.is-error .york-toast-progress > span { background: #F43F5E; }
.york-toast.is-warning .york-toast-progress > span { background: #F59E0B; }
.york-toast.is-loading .york-toast-progress > span {
  width: 40%;
  animation: toastIndeterminate 1.1s ease-in-out infinite;
}
@keyframes toastProgress {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}
@keyframes toastIndeterminate {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(320%); }
}
@keyframes toastIconPop {
  0% { transform: scale(0.6); opacity: 0.4; }
  60% { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes toastSpin {
  to { transform: rotate(360deg); }
}
.york-toast-icon.is-spin svg {
  animation: toastSpin 0.85s linear infinite;
}
@media (prefers-reduced-motion: reduce) {
  .york-toast,
  .york-toast-icon.is-spin svg,
  .york-toast-progress > span {
    animation: none !important;
    transition: opacity 0.15s ease;
  }
  .york-toast {
    transform: none;
  }
}

.theme-sun-icon { display: none !important; }
.theme-moon-icon { display: block !important; }
:root[data-theme="dark"] .theme-sun-icon { display: block !important; color: #FDE047; }
:root[data-theme="dark"] .theme-moon-icon { display: none !important; }

.copilot-status-pill {

}
.copilot-context {
  margin-top: 4px;
  font-size: 12px;
  font-weight: 450;

.copilot-close {

.copilot-close:hover {

}
.copilot-close i,
.copilot-close svg {

}

.copilot-chips {

}

.copilot-quick-chip {
  display: inline-flex;

  gap: 6px;
  background: var(--emerald-subtle);

  font-weight: 600;
  padding: 6px 11px;
  border-radius: 9999px;

  flex-shrink: 0;
}
.copilot-quick-chip:hover {
  border-color: var(--emerald-accent);
  color: var(--emerald-dark);
  background: var(--emerald-light);
}
.copilot-quick-chip i,
.copilot-quick-chip svg {
  width: 13px;
  height: 13px;
  color: var(--emerald-accent);
}

.copilot-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background:
    radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--emerald) 6%, transparent), transparent 55%),
    var(--bg-subtle);
}

.copilot-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  text-align: left;
  padding: 8px 2px 4px;
  gap: 10px;
  min-height: 100%;

}
.copilot-empty-orb {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  margin-bottom: 2px;
  background: linear-gradient(135deg, #12A883 0%, #84CC16 52%, #F59E0B 100%);
  color: #000;
  border: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.3) inset,
    0 8px 20px rgba(18, 168, 131, 0.22);
}
.copilot-empty-orb i,
.copilot-empty-orb svg {
  width: 20px;
  height: 20px;
  color: #000 !important;
  stroke: #000 !important;
}
.copilot-empty-title {
  font-size: 17px;
  font-weight: 650;
  color: var(--text-main);
  line-height: 1.25;
  letter-spacing: -0.02em;
}
.copilot-empty-sub {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.5;
  max-width: 300px;

}
.copilot-suggest-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;

}
.copilot-empty-title,
.copilot-empty-sub {

}
.copilot-suggest {

  padding: 12px 14px;
  border-radius: 14px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
}
.copilot-suggest:hover {
  border-color: color-mix(in srgb, var(--emerald) 35%, var(--line));
  background: var(--bg-card);
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
}
.copilot-suggest-top {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.3;
}
.copilot-suggest-top i,
.copilot-suggest-top svg {
  width: 15px;
  height: 15px;
  color: var(--emerald-accent);
  flex-shrink: 0;
}
.copilot-suggest-desc {
  display: block;
  margin-top: 4px;
  margin-left: 23px;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.45;
}

.copilot-msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  max-width: 100%;
}
.copilot-msg-row.is-user {
  flex-direction: row-reverse;
}
.copilot-msg-face {
  width: 28px;
  height: 28px;
  border-radius: var(--avatar-radius);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  overflow: hidden;
  background: var(--emerald-subtle);
  color: var(--emerald-dark);
  border: 1px solid color-mix(in srgb, var(--emerald) 18%, transparent);
}
.copilot-msg-row.is-user .copilot-msg-face {
  background: rgba(16, 185, 129, 0.12);
