<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=dashboard-v3.html?auth=1">
  <title>Sign in to York IE Console...</title>
  <script>
    try {
      sessionStorage.removeItem('york_session_active');
      var raw = localStorage.getItem('york_console_state_v19');
      if (raw) {
        var st = JSON.parse(raw);
        st.currentUser = null;
        localStorage.setItem('york_console_state_v19', JSON.stringify(st));
      }
    } catch (e) {}
    window.location.replace('dashboard-v3.html?auth=1');
  </script>
</head>
<body style="font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #FFFFFF; color: #737373;">
  <p>Opening York IE sign in…</p>
</body>
</html>
